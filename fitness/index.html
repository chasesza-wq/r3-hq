<style>
/* ==========================================================================
   FITNESS OS · Delray Beach 33444
   Direction: Quiet, palette pulled down to a darker neutral.
   Store guidance bar borrowed from Deck. Logos only, no wordmarks.
   ========================================================================== */
:root{
  --bg:#0B0C0D; --surf:#141618; --surf2:#1C1F22; --surf3:#272B2F;
  --ink:#ECEEEF; --dim:#8A9096; --dim2:#585F65;
  --acc:#C4B7A6; --acc-d:#2A2621;
  --ok:#7FA88C; --warn:#C9A26B; --bad:#C4796B;
  --ui:"Avenir Next","Avenir",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#08090A;color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center}
button,input{font-family:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tnum{font-variant-numeric:tabular-nums}

/* device frame on desktop, edge to edge on a phone */
#frame{width:100%;max-width:430px;height:100vh;height:100dvh;max-height:932px;position:relative;
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:520px) and (min-height:700px){
  #frame{border-radius:38px;box-shadow:0 30px 70px -30px rgba(0,0,0,.85);height:900px}
}

/* ---------- primitives ---------- */
.lab{font:600 10px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--dim2)}
.pad{padding:0 20px}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:14px}
.body::-webkit-scrollbar{width:0}
/* Today is a single screen by contract. It never scrolls, so everything on it
   has to earn its height. Sizes flex against the viewport instead of wrapping. */
.body.fixed{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
.today{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:0 20px 6px}
.today>*{flex:none}
/* the hero soaks up whatever height is left over, so a taller phone gets a
   calmer card rather than gaps floating between the rows below it */
.today .grow{flex:1 1 auto;min-height:0;max-height:298px;
  display:flex;align-items:center;justify-content:center}
.head{padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 16px}
.head h1{font-size:26px;font-weight:500;letter-spacing:-.025em;margin-top:6px;text-wrap:balance}
.card{background:var(--surf);border-radius:22px;padding:20px;margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}
.big{font-size:52px;font-weight:200;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--dim);margin-left:5px}
.pill{background:var(--acc);color:var(--acc-d);border-radius:100px;padding:15px 24px;
  font-size:15px;font-weight:600;width:100%;letter-spacing:-.01em}
.pill:active{transform:scale(.985)}
.pill.gh{background:none;color:var(--ink);border:1px solid var(--surf3)}
.pill.sm{padding:10px 16px;font-size:13px;width:auto}
.stat{display:flex;gap:9px}
.stat>div,.stat>button{flex:1;min-width:0;background:var(--surf);border-radius:18px;padding:15px;text-align:left}
.stat b{display:block;font-size:21px;font-weight:300;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums}
.stat .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chipr{display:flex;gap:6px;flex-wrap:wrap}
.mchip{background:var(--surf2);border-radius:100px;padding:5px 11px;font-size:11.5px;font-weight:600;
  color:var(--dim);letter-spacing:.02em}
.mchip.on{background:var(--acc);color:var(--acc-d)}
.mchip.ok{background:rgba(127,168,140,.16);color:var(--ok)}

/* ---------- nav ---------- */
nav{margin:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--surf2);border-radius:22px;
  display:flex;padding:6px;flex:none;box-shadow:0 12px 26px -16px rgba(0,0,0,.8)}
nav button{flex:1;color:var(--dim2);border-radius:17px;padding:9px 0 10px;display:flex;
  flex-direction:column;align-items:center;gap:4px;font:600 9px var(--ui);letter-spacing:.09em;text-transform:uppercase}
nav button[aria-current="true"]{background:var(--bg);color:var(--acc)}
nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav .dot{position:absolute;transform:translate(14px,-3px);width:6px;height:6px;border-radius:50%;background:var(--acc)}

/* ---------- store guidance bar (from Deck) ---------- */
.shelf{display:flex;gap:9px;overflow-x:auto;padding:2px 20px 6px;scroll-snap-type:x mandatory}
.shelf::-webkit-scrollbar{height:0}
.shelf>*{scroll-snap-align:start;flex:none}
.stc{width:132px;background:var(--surf);border:1.5px solid transparent;border-radius:19px;padding:12px;
  display:flex;flex-direction:column;gap:10px;text-align:left}
.stc[aria-pressed="true"]{border-color:var(--acc);background:var(--surf2)}
.plate{background:#EFEDE8;border-radius:12px;height:50px;display:flex;align-items:center;justify-content:center;padding:9px}
.plate img{max-height:100%;max-width:100%;object-fit:contain;display:block}
.stc .pz{display:block;font-size:19px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stc .mi{display:block;font-size:11px;color:var(--dim2);font-weight:600;margin-top:3px;line-height:1.35}
.badge{display:inline-block;border-radius:7px;padding:3px 7px;font-size:10px;font-weight:700;letter-spacing:.02em}
.badge.win{background:var(--acc);color:var(--acc-d)}
.badge.prot{background:rgba(127,168,140,.18);color:var(--ok)}
.badge.mute{background:var(--surf3);color:var(--dim)}
.badge.warn{background:rgba(201,162,107,.16);color:var(--warn)}

/* ---------- mode switch ---------- */
.modes{display:flex;background:var(--surf2);border-radius:100px;padding:4px;margin:0 20px 14px}
.modes button{flex:1;border-radius:100px;padding:10px 0;font-size:13px;font-weight:600;color:var(--dim)}
.modes button[aria-pressed="true"]{background:var(--acc);color:var(--acc-d)}

/* ---------- list rows ---------- */
.li{display:flex;align-items:center;gap:13px;padding:10px 0;width:100%;text-align:left}
.li .th{width:44px;height:44px;border-radius:13px;overflow:hidden;background:var(--surf2);flex:none}
.li .th img{width:100%;height:100%;object-fit:cover;display:block}
.li .nm{font-size:14.5px;font-weight:500;letter-spacing:-.005em}
.li .sb{font-size:11.5px;color:var(--dim);margin-top:2px;font-weight:500}
.li .why{font-size:10.5px;color:var(--dim2);margin-top:3px;font-weight:600;letter-spacing:.03em}
.li .pz{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.li .pz .cf{display:block;font-size:8.5px;font-weight:700;letter-spacing:.09em;margin-top:2px}
.cf.v{color:var(--ok)} .cf.c{color:var(--dim2)} .cf.e{color:var(--warn)}
.cb{width:25px;height:25px;border-radius:50%;border:1.5px solid var(--dim2);flex:none;position:relative}
.li.done .cb{background:var(--acc);border-color:var(--acc)}
.li.done .cb:after{content:"";position:absolute;inset:6px;background:var(--acc-d);
  clip-path:polygon(11% 50%,38% 77%,89% 17%,79% 8%,38% 57%,21% 39%)}
.li.done .nm{color:var(--dim2);text-decoration:line-through}
.li.done .th{opacity:.4}

/* ---------- recipe card ---------- */
.rc{border-radius:24px;overflow:hidden;background:var(--surf);position:relative}
.rc .im{aspect-ratio:4/3;position:relative}
.rc .im img{width:100%;height:100%;object-fit:cover;display:block}
.rc .gr{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,12,13,.95) 5%,rgba(11,12,13,.3) 48%,transparent 78%)}
.rc .cap{position:absolute;left:18px;right:18px;bottom:15px}
.rc h3{font-size:22px;font-weight:500;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.judge{display:flex;gap:13px;justify-content:center;padding:16px 0 6px}
.judge button{width:58px;height:58px;border-radius:50%;border:1px solid var(--surf3);background:var(--surf);
  color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:300}
.judge button.y{border-color:var(--acc);color:var(--acc)}
.impact{background:var(--surf2);border-radius:16px;padding:13px 15px;margin-top:13px;
  display:flex;align-items:center;gap:11px}
.impact .k{flex:1;font-size:12.5px;line-height:1.5;color:var(--dim);font-weight:500}
.impact b{color:var(--ink);font-weight:600}

/* ---------- meal strip ---------- */
.meal{width:158px;background:var(--surf);border-radius:18px;overflow:hidden;text-align:left}
.meal .im{height:78px}
.meal .im img{width:100%;height:100%;object-fit:cover;display:block}
.meal .bd{padding:11px 12px 12px}
.meal .nm{font-size:13px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.meal .sv{display:flex;align-items:center;gap:9px;margin-top:9px}
.meal .sv button{width:26px;height:26px;border-radius:50%;background:var(--surf2);color:var(--dim);
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.meal .sv span{font-size:12px;font-weight:600;color:var(--dim);flex:1;text-align:center}

/* ---------- sheets ---------- */
.sheet{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.85,.3,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:36px;height:4px;border-radius:3px;background:var(--surf3);margin:10px auto 0;flex:none}
.sx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:5;width:34px;height:34px;
  border-radius:50%;background:rgba(11,12,13,.62);backdrop-filter:blur(9px);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:300}
.hero{height:238px;position:relative;flex:none}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .gr{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 3%,rgba(11,12,13,.25) 55%,rgba(11,12,13,.35))}
.hero .cap{position:absolute;left:20px;right:20px;bottom:14px}
.step{display:flex;gap:13px;padding:11px 0}
.step .n{width:23px;height:23px;border-radius:50%;background:var(--surf2);color:var(--dim);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.step p{font-size:13.5px;line-height:1.6;color:var(--dim)}
.mini{position:absolute;left:0;right:0;bottom:0;z-index:60;background:var(--surf);
  border-radius:26px 26px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
  transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.85,.3,1);visibility:hidden;
  box-shadow:0 -14px 40px -18px rgba(0,0,0,.9)}
.mini.on{transform:none;visibility:visible}
.scrim{position:absolute;inset:0;z-index:55;background:rgba(6,7,8,.6);opacity:0;visibility:hidden;transition:opacity .25s}
.scrim.on{opacity:1;visibility:visible}
.numin{width:100%;background:var(--surf2);border:1px solid var(--surf3);border-radius:15px;padding:15px 17px;
  font-size:26px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;outline:none;margin:15px 0;
  -moz-appearance:textfield}
.numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numin:focus{border-color:var(--acc)}

/* ---------- toast ---------- */
.toast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:70;
  background:var(--acc);color:var(--acc-d);border-radius:100px;padding:13px 18px;text-align:center;
  font-size:13.5px;font-weight:600;opacity:0;transform:translateY(10px);transition:opacity .22s,transform .22s;
  pointer-events:none}
.toast.on{opacity:1;transform:none}
</style>

<div id="frame">
  <div class="body" id="view"></div>
  <nav id="nav"></nav>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="mini" id="mini"></div>
  <div class="toast" id="toast"></div>
</div>

/* price with the user's own correction winning over anything I estimated */
function priceOf(slug,sid){
  sid=sid||S.store;
  const o=S.over[slug]&&S.over[slug][sid];
  if(o!=null) return o;
  return FD[slug].price[sid];
}
function confOf(slug,sid){
  sid=sid||S.store;
  if(S.over[slug]&&S.over[slug][sid]!=null) return "v";
  return FD[slug].conf[sid];
}

/* ==========================================================================
   THE LIST. One derivation, used by both modes.
   staples + every planned meal, rolled up to whole purchasable units.
   ========================================================================== */
function buildList(){
  const need={};
  STAPLES.forEach(s=>{
    need[s.slug]=need[s.slug]||{units:0,why:[]};
    need[s.slug].units+=s.qty;
    need[s.slug].why.push({t:"Staple",k:"staple"});
  });
  Object.keys(S.planned).forEach(rid=>{
    const n=S.planned[rid]; if(!n) return;
    const r=RD[rid]; if(!r) return;
    r.ing.forEach(i=>{
      need[i.slug]=need[i.slug]||{units:0,why:[]};
      need[i.slug].units+=i.units*n;
      need[i.slug].why.push({t:r.name+(n>1?" ×"+n:""),k:"recipe",id:rid});
    });
  });
  const rows=Object.keys(need).map(slug=>{
    const f=FD[slug], q=Math.max(1,Math.ceil(need[slug].units-0.001));
    const p=priceOf(slug);
    return {slug,f,qty:q,unitPrice:p,line:p==null?null:+(p*q).toFixed(2),
            why:need[slug].why,conf:confOf(slug),stocked:p!=null};
  });
  const AISLE={Produce:1,Protein:2,Dairy:3,Carbs:4,Fats:5};
  rows.sort((a,b)=> (AISLE[a.f.cat]-AISLE[b.f.cat]) || a.f.name.localeCompare(b.f.name));
  return rows;
}
const listTotal=rows=>rows.reduce((a,r)=>a+(r.line||0),0);
const listLeft =rows=>rows.filter(r=>!S.checked[r.slug]).reduce((a,r)=>a+(r.line||0),0);
const listProtein=rows=>rows.reduce((a,r)=>a+r.f.p*r.qty,0);
const plannedCount=()=>Object.values(S.planned).reduce((a,b)=>a+b,0);

/* what a recipe would do to the list if he kept it. Shown at decision time. */
function impactOf(r){
  const rows=buildList(); const have={}; rows.forEach(x=>have[x.slug]=x);
  let addCost=0, newItems=0;
  r.ing.forEach(i=>{
    const p=priceOf(i.slug); if(p==null) return;
    if(!have[i.slug]){ newItems++; addCost+=p*Math.max(1,Math.ceil(i.units-0.001)); }
  });
  return {newItems, addCost:+addCost.toFixed(2), already:r.ing.length-newItems};
}

const BASE=(()=>{const o=[];for(let i=0;i<42;i++){

const roll7=a=>a.map((_,i)=>{const s=a.slice(Math.max(0,i-6),i+1);return s.reduce((x,y)=>x+y,0)/s.length;});
function linePath(v,w,h,p){p=p||0;const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
  return v.map((x,i)=>{const X=p+(i/(v.length-1))*(w-p*2),Y=p+(1-(x-mn)/r)*(h-p*2);
  return (i?"L":"M")+X.toFixed(1)+" "+Y.toFixed(1);}).join(" ");}
function lastY(v,h,p){p=p||0;const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
  return p+(1-(v[v.length-1]-mn)/r)*(h-p*2);}
function ring(pct,size,sw,col,track){
  const r=(size-sw)/2,c=2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+track+'" stroke-width="'+sw+'"/>'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" '+
   'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-Math.min(1,pct))).toFixed(1)+'" '+
   'transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>';
}
/* fluid version: the SVG scales to whatever box CSS gives it, so Today can
   shrink the ring on a small phone instead of pushing content off screen */
function ringFluid(pct,sw,col,track){
  const r=(100-sw)/2,c=2*Math.PI*r;
  return '<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block">'+
   '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+track+'" stroke-width="'+sw+'"/>'+
   '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" '+
   'stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+(c*(1-Math.min(1,pct))).toFixed(2)+'" '+
   'transform="rotate(-90 50 50)"/></svg>';
}

}

/* ==========================================================================
   RENDER + EVENTS
   ========================================================================== */
const VIEWS={today:vToday,prog:vProg,log:vLog,shop:vShop,rec:vRec};
function render(){
  $("view").innerHTML=VIEWS[S.tab]();
  $("view").classList.toggle("fixed", S.tab==="today");   /* Today never scrolls */
  renderNav(); save();
  if(S.tab==="log") paintOfflineState();
}
let tt;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2100); }

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;

  if(d.close!==undefined||b.id==="scrim"){ $("sheet").classList.remove("on"); return; }
  if(d.priceCancel!==undefined){ closeMini(); return; }
  if(d.priceSave!==undefined){
    const v=parseFloat($("pin").value);
    if(!isNaN(v)&&v>0){ S.over[priceSlug]=S.over[priceSlug]||{}; S.over[priceSlug][S.store]=+v.toFixed(2);
      toast(FD[priceSlug].name+" set to "+money(v)); }
    closeMini(); render(); return; }

  if(d.tab){ S.tab=d.tab; $("sheet").classList.remove("on"); render(); $("view").scrollTop=0; return; }
  if(d.store){ S.store=d.store; render(); toast(SD[d.store].name+" · list re-priced"); return; }
  if(d.mode){ S.mode=d.mode; render(); $("view").scrollTop=0; return; }
  if(d.check){ S.checked[d.check]=!S.checked[d.check]; render(); return; }
  if(d.price){ openPrice(d.price); return; }
  if(d.open){ openRecipe(d.open); return; }
  if(d.reset!==undefined){ S.yay=[]; S.nay=[]; render(); return; }

  if(d.plan){
    const id=d.plan, dd=+d.d;
    if(dd===-99) delete S.planned[id];
    else{
      const n=(S.planned[id]||0)+dd;
      if(n<=0) delete S.planned[id]; else S.planned[id]=n;
    }
    if(S.planned[id]&&S.yay.indexOf(id)<0){ S.yay.push(id); S.nay=S.nay.filter(x=>x!==id); }
    if(b.hasAttribute("data-close-after")) $("sheet").classList.remove("on");
    render();
    toast(S.planned[id]?RD[id].name+" added, list updated":RD[id].name+" removed");
    return;
  }

  if(d.judge){
    const id=d.r;
    S.yay=S.yay.filter(x=>x!==id); S.nay=S.nay.filter(x=>x!==id);
    if(d.judge==="y"){ S.yay.push(id); S.planned[id]=(S.planned[id]||0)+1;
      toast("Kept. "+RD[id].ing.length+" ingredients on the list"); }
    else { S.nay.push(id); toast("Skipped"); }
    render(); return;
  }

  if(d.step){
    const f=LOGF.find(x=>x.k===d.step);
    const cur=S.logged[f.k]!=null?S.logged[f.k]:f.v;
    S.logged[f.k]=+(cur+f.st*(+d.d)).toFixed(2);
    render(); return;
  }
  if(d.saveLog!==undefined){
    const w=S.logged.weight!=null?S.logged.weight:151.8;
    S.weights.push({d:new Date().toISOString().slice(0,10),v:w});
    S.logged={}; render(); toast("Saved. Trend and rate updated"); return;
  }

  if(d.export!==undefined){ exportData(); return; }
  if(d.import!==undefined){ $("importFile").click(); return; }
});

/* ==========================================================================
   BACKUP. Plain JSON, versioned, so a restore two phones from now still works.
   ========================================================================== */
function exportData(){
  const payload={app:"fitness-os-delray",v:1,exported:new Date().toISOString(),state:S};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="fitness-os-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Backup downloaded");
}
document.addEventListener("change",e=>{
  if(e.target.id!=="importFile") return;
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const p=JSON.parse(rd.result);
      if(p.app!=="fitness-os-delray"||!p.state) throw new Error("not a Fitness OS backup");
      S=Object.assign(S,p.state); save(); render();
      toast("Restored from "+String(p.exported).slice(0,10));
    }catch(err){ toast("That file is not a Fitness OS backup"); }
  };
  rd.readAsText(f); e.target.value="";
});

/* ==========================================================================
   OFFLINE. Registration is wrapped because this same file also runs from a
   claude.ai artifact URL, where the worker will not resolve. Failing there is
   fine; it just means no offline until it is on its own host.
   ========================================================================== */
let swReady=false;
function paintOfflineState(){
  const el=$("offlineState"); if(!el) return;
  el.textContent = swReady ? "Offline ready · works with no signal"
                           : "Online only · install it on its own host for offline";
  el.style.color = swReady ? "var(--ok)" : "var(--dim2)";
}
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      swReady=true; paintOfflineState();
      reg.addEventListener("updatefound",()=>{
        const w=reg.installing; if(!w) return;
        w.addEventListener("statechange",()=>{
          if(w.state==="installed"&&navigator.serviceWorker.controller)
            toast("Update ready. Close and reopen the app");
        });
      });
    }).catch(()=>{ swReady=false; paintOfflineState(); });
  });
}
$("scrim").addEventListener("click",closeMini);

render();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0c">
<title>The Library</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ------------------------------------------------------------------ */
  /* The Library, mobile. A lamplit reading room, not a media app.      */
  /* Ink #0b0b0c · panels #131316/#18181b · hairlines #27272a/#3f3f46   */
  /* Amber #f59e0b · bright #fcd34d · brass #c9a86a                     */
  /* Paper #0d0c0a · paper text #e8dfcd/#d8c8a6                         */
  /* ------------------------------------------------------------------ */
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;height:100dvh;overflow:hidden;
    background:#0b0b0c;color:#d6d3d1;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  img{max-width:100%}
  button{font-family:inherit;color:inherit}
  :root{color-scheme:dark}

  /* ---- screens: three stacked scroll containers, one visible -------- */
  .screen{
    position:fixed;top:0;left:0;right:0;
    bottom:calc(60px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    /* Must be explicit. Setting only overflow-y makes CSS compute overflow-x to
       `auto`, not `visible`, so the 430px .glow inside a 390px pane made the
       whole screen pan 20px sideways — the page drifting out of focus. */
    overflow-x:hidden;
    visibility:hidden;
  }
  .screen.on{visibility:visible}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 36px}

  /* ---- bottom nav ---------------------------------------------------- */
  #tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;height:calc(60px + env(safe-area-inset-bottom,0px));
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:rgba(11,11,12,.96);border-top:1px solid #1c1c1f;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  .tab{
    flex:1;min-height:44px;border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:#71717a;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  }
  .tab svg{width:21px;height:21px}
  .tab.on{color:#fcd34d}
  .tab:active{opacity:.65}

  /* ---- shared bits ---------------------------------------------------- */
  .kicker{font-family:Georgia,"Times New Roman",serif;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:#c9a86a}
  .h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;line-height:1.2;font-weight:700;color:#e8dfcd;margin:6px 0 0}
  .sub{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:#78716c;margin-top:5px}
  .axis-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#a8a29e;margin:22px 0 0}
  .axis-label.brass{color:#c9a86a}

  .pill{display:inline-flex;align-items:center;border-radius:9999px;padding:1px 8px;font-size:10px;font-weight:700;letter-spacing:.02em;line-height:1.7;white-space:nowrap}
  .pill-calm{background:rgba(12,74,110,.35);color:#7dd3fc}
  .pill-confront{background:rgba(136,19,55,.35);color:#fda4af}
  .pill-fuel{background:rgba(120,53,15,.35);color:#fcd34d}

  .clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}

  .thumbbox{position:relative;display:block;overflow:hidden;background:linear-gradient(160deg,#161310,#221e17)}
  .thumbbox img{width:100%;height:100%;object-fit:cover;display:block}
  .thumbbox.noimg img{display:none}
  .tglyph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;font-size:26px;color:#c9a86a;opacity:.65}
  .thumbbox.noimg .tglyph,.thumbbox.nothumb .tglyph{display:flex}
  .badge{position:absolute;right:6px;bottom:6px;border-radius:6px;background:rgba(9,9,11,.85);color:#e7e5e4;font-size:11px;font-weight:600;padding:2px 6px;line-height:1.2;z-index:2}
  .check{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:9999px;background:rgba(9,9,11,.8);color:#fbbf24;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2}

  /* ---- Today ----------------------------------------------------------- */
  /* No fixed width: a 430px box inside a 390px pane leaks into the pane's
     scrollable overflow even under overflow-x:hidden. Span the wrap instead. */
  .glow{position:absolute;top:-130px;left:0;right:0;height:300px;
        background:radial-gradient(closest-side at 50% 50%,rgba(245,158,11,.08),transparent);pointer-events:none}
  #screen-today .wrap{position:relative}

  /* ---- Today: the sections below the three ----------------------------- */
  .sect{margin-top:34px}
  .sect-head{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
  .sect-h{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
          color:#a8a29e;margin:0}
  .sect-n{font-size:11px;color:#57575e;font-variant-numeric:tabular-nums}
  .sect-note{font-family:Georgia,"Times New Roman",serif;font-style:italic;
             font-size:12.5px;color:#6b6b73;margin:-4px 0 12px}

  /* The one place sideways movement is intentional. Everything else is
     clipped, because an accidental 20px drift is what made this screen feel
     broken in the first place. */
  .rail{display:flex;gap:11px;overflow-x:auto;overflow-y:hidden;
        scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
        overscroll-behavior-x:contain;padding-bottom:4px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail>*{scroll-snap-align:start;flex:0 0 auto}
  .qcard{width:170px;background:#131316;border:1px solid #27272a;border-radius:13px;
         overflow:hidden;text-align:left;padding:0;color:inherit;display:block}
  .qthumb{aspect-ratio:16/9;width:100%;display:block}
  .qbody{padding:9px 11px 12px;display:block}
  .qtitle{font-family:Georgia,"Times New Roman",serif;font-size:13.5px;line-height:1.32;
          font-weight:700;color:#e8dfcd;display:-webkit-box;-webkit-line-clamp:2;
          -webkit-box-orient:vertical;overflow:hidden}
  .qmeta{display:flex;align-items:center;gap:7px;margin-top:7px}

  /* The last thing he wrote, quoted back. The strongest reason to return. */
  .quote{border-left:2px solid rgba(201,168,106,.5);padding:2px 0 2px 15px;
         font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.55;
         color:#d8c8a6;font-style:italic}
  .quote-src{display:block;margin-top:9px;font-style:normal;font-size:11.5px;
             color:#6b6b73}

  /* Honest, small, and never congratulatory when nothing happened. */
  .week{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .wcell{background:#131316;border:1px solid #27272a;border-radius:12px;padding:13px 12px}
  .wnum{font-size:23px;font-weight:300;color:#e8dfcd;line-height:1;
        font-variant-numeric:tabular-nums}
  .wlab{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
        color:#6b6b73;margin-top:7px}

  /* ---- press feedback: most of what makes a web app feel native -------- */
  /* Asymmetric on purpose. A native control compresses fast (~90ms, ease-in)
     and releases slow with a little overshoot (~380ms). Using one symmetric
     duration for both halves is the clearest tell that something is a web
     page pretending to be an app. */
  .dcard,.row,.qcard,.pagecard,.charge-btn,.fchip,.peek-btn,.hbtn,
  .finish,.close-btn,.sound-btn,.morebtn,.clearbtn,.open-art{
    transition:transform .38s cubic-bezier(.16,1.02,.32,1),
               border-color .3s ease,background .3s ease,opacity .3s ease}
  .dcard:active,.row:active,.qcard:active,.pagecard:active,.charge-btn:active,
  .fchip:active,.peek-btn:active,.hbtn:active,.finish:active,.close-btn:active,
  .sound-btn:active,.morebtn:active,.clearbtn:active,.open-art:active{
    transition:transform .09s cubic-bezier(.4,0,.6,1),
               border-color .09s ease,background .09s ease,opacity .09s ease}
  .dcard:active,.row:active,.pagecard:active{transform:scale(.977)}
  .qcard:active{transform:scale(.958)}
  .charge-btn:active,.fchip:active,.peek-btn:active,.hbtn:active,
  .finish:active,.close-btn:active,.sound-btn:active{transform:scale(.952)}
  .dcard:active,.qcard:active{border-color:#3f3f46}

  /* A touch-origin bloom on the primary action. The highlight starts where
     the thumb actually landed, which is why it reads as a response rather
     than a decoration. --px/--py are written by the touch handler. */
  .peek-btn.primary,.open-art,.finish{position:relative;overflow:hidden;isolation:isolate}
  .peek-btn.primary::after,.open-art::after,.finish::after{
    content:"";position:absolute;left:var(--px,50%);top:var(--py,50%);
    width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:9999px;
    background:radial-gradient(closest-side,rgba(252,211,77,.30),transparent);
    opacity:0;transform:scale(.2);pointer-events:none;z-index:-1}
  .peek-btn.primary.bloom::after,.open-art.bloom::after,.finish.bloom::after{
    animation:bloom .62s cubic-bezier(.22,.85,.3,1) forwards}
  @keyframes bloom{
    0%{opacity:.85;transform:scale(.2)}
    100%{opacity:0;transform:scale(1)}}

  /* ---- peek sheet ------------------------------------------------------ */
  #peek{position:fixed;inset:0;z-index:120;visibility:hidden;pointer-events:none}
  #peek.on{visibility:visible;pointer-events:auto}
  #peek-scrim{position:absolute;inset:0;background:rgba(6,6,8,.72);opacity:0;
              transition:opacity .3s ease;-webkit-backdrop-filter:blur(3px);
              backdrop-filter:blur(3px)}
  #peek.on #peek-scrim{opacity:1}
  #peek-sheet{position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(#151418,#0e0e10);
    border-top:1px solid #2e2a24;border-radius:20px 20px 0 0;
    padding:0 0 calc(env(safe-area-inset-bottom,0px) + 18px);
    box-shadow:0 -22px 60px rgba(0,0,0,.6);
    transform:translateY(100%);
    /* transform only. Animating height or layout here drops frames. */
    transition:transform .38s cubic-bezier(.32,.72,.28,1);
    max-height:88dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
  #peek.on #peek-sheet{transform:translateY(0)}
  #peek-grab{display:block;width:100%;min-height:44px;border:none;
             background:transparent;padding:11px 0 7px}
  #peek-grab::before{content:"";display:block;width:38px;height:4px;border-radius:2px;
                     background:#3f3f46;margin:0 auto}
  #peek-stage{background:#000}
  #peek-stage iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
  #peek-stage img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  #peek-body{padding:16px 18px 4px}
  .peek-title{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.28;
              font-weight:700;color:#e8dfcd}
  .peek-chan{font-size:12.5px;color:#a8a29e;margin-top:5px}
  .peek-why{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px;
            line-height:1.5;color:rgba(214,197,163,.62);margin-top:11px}
  .peek-acts{display:flex;gap:9px;margin-top:17px}
  .peek-btn{flex:1;min-height:48px;border-radius:12px;font-size:14.5px;font-weight:700;
            border:1px solid #3f3f46;background:rgba(24,24,27,.85);color:#e4e4e7;
            display:flex;align-items:center;justify-content:center;gap:7px;
            text-decoration:none;transition:transform .16s cubic-bezier(.32,.72,.28,1)}
  .peek-btn:active{transform:scale(.97)}
  .peek-btn.primary{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.14);
                    color:#fcd34d}

  /* ---- toast ----------------------------------------------------------- */
  #toast{position:fixed;left:16px;right:16px;z-index:200;
         bottom:calc(72px + env(safe-area-inset-bottom,0px));
         background:rgba(24,22,18,.97);border:1px solid #3f3f46;border-radius:12px;
         color:#e8dfcd;font-size:13.5px;line-height:1.45;padding:12px 15px;
         box-shadow:0 14px 40px rgba(0,0,0,.55);
         opacity:0;transform:translateY(10px);pointer-events:none;
         transition:opacity .26s ease,transform .26s cubic-bezier(.32,.72,.28,1)}
  #toast.on{opacity:1;transform:none}

  /* ---- entrance choreography ------------------------------------------ */
  /* One mechanism covers both the load sequence and scroll reveals: anything
     marked .reveal starts hidden and animates when it crosses into view. What
     is already on screen at boot animates immediately with a stagger, which
     is the load sequence; everything below the fold waits for the scroll.
     Previously every .sect ran the same animation at t=0, so the whole page
     twitched once and then never responded to scrolling again. */
  @keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
  .reveal{opacity:0}
  .reveal.in{animation:rise .55s cubic-bezier(.22,.85,.3,1) both;
             animation-delay:var(--d,0ms)}

  /* ---- collapsing title bar ------------------------------------------- */
  /* The large title scrolls away and a compact one takes over. This is what
     every first-party iOS app does, and its absence is why the screen read as
     a web page no matter how good the cards looked. */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:35;
    display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 54px 10px;
    background:rgba(11,11,12,.72);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    border-bottom:1px solid rgba(28,28,31,0);
    opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity .24s ease,transform .28s cubic-bezier(.32,.72,.28,1),
               border-bottom-color .24s ease}
  .topbar.on{opacity:1;transform:none;border-bottom-color:#1c1c1f}
  .topbar-t{font-family:Georgia,"Times New Roman",serif;font-size:15px;
            font-weight:700;color:#e8dfcd;white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis}

  /* ---- rails: fade the edge that still has content -------------------- */
  .rail{
    -webkit-mask-image:linear-gradient(to right,#000 0,#000 100%);
    mask-image:linear-gradient(to right,#000 0,#000 100%)}
  .rail.more-right{
    -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 30px),transparent 100%);
    mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 30px),transparent 100%)}
  .rail.more-left{
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 30px,#000 100%);
    mask-image:linear-gradient(to right,transparent 0,#000 30px,#000 100%)}
  .rail.more-left.more-right{
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 30px,#000 calc(100% - 30px),transparent 100%);
    mask-image:linear-gradient(to right,transparent 0,#000 30px,#000 calc(100% - 30px),transparent 100%)}

  /* ---- images settle in, they do not pop ------------------------------ */
  .thumbbox img{
    opacity:0;transform:scale(1.045);
    transition:opacity .45s ease,transform .8s cubic-bezier(.22,.85,.3,1)}
  .thumbbox img.ld{opacity:1;transform:none}

  /* ---- first-paint skeletons ------------------------------------------ */
  @keyframes shimmer{to{background-position:-200% 0}}
  .skel{background:linear-gradient(90deg,#131316 0%,#1c1c21 45%,#131316 90%);
        background-size:200% 100%;animation:shimmer 1.5s linear infinite;
        border-radius:13px;border:1px solid #1c1c1f}
  .skel-card{height:196px;margin-top:16px}
  .skel-line{height:13px;border-radius:6px;margin-top:10px}

  /* ---- tab change ------------------------------------------------------ */
  /* Content arrives from the side you travelled, so the tab bar reads as a
     position in a row rather than three unrelated pages. */
  .screen{opacity:0}
  .screen.on{opacity:1}
  @keyframes tab-l{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  @keyframes tab-r{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .screen.on.from-l .wrap{animation:tab-l .3s cubic-bezier(.22,.85,.3,1) both}
  .screen.on.from-r .wrap{animation:tab-r .3s cubic-bezier(.22,.85,.3,1) both}

  /* ---- depth behind a sheet ------------------------------------------- */
  /* The page underneath recedes. Sheets that sit on a flat, unchanged
     background read as overlays; sheets with a receding parent read as a
     stack, which is the whole reason iOS presentation feels physical. */
  /* Scaled on .screen, not .wrap. .screen is fixed and viewport-sized, so it
     scales about the centre of what you are actually looking at; scaling the
     inner .wrap pivots around the top of the document, which throws content
     sideways the moment the page is scrolled at all. */
  .screen{transform-origin:50% 50%;
          transition:opacity .18s ease,transform .36s cubic-bezier(.32,.72,.28,1)}
  body.peeking .screen.on{transform:scale(.984);opacity:.74}
  body.papered .screen.on{transform:scale(.955);opacity:.45}
  body.papered #tabbar{transform:translateY(100%)}
  #tabbar{transition:transform .34s cubic-bezier(.32,.72,.28,1)}

  /* ---- reading progress ------------------------------------------------ */
  #paper-prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;
    background:linear-gradient(90deg,rgba(245,158,11,.45),#fcd34d);
    border-radius:0 2px 2px 0;transition:width .09s linear;pointer-events:none}

  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1}
    .reveal.in{animation:none}
    .skel{animation:none}
    .thumbbox img{opacity:1;transform:none;transition:none}
    .screen.on.from-l .wrap,.screen.on.from-r .wrap{animation:none}
    body.peeking .screen.on,body.papered .screen.on{transform:none;opacity:1}
    #peek-sheet,#peek-scrim,.dcard,.row,.qcard,.pagecard,.peek-btn,.screen{transition:none}
    .dcard:active,.row:active,.qcard:active,.pagecard:active,.peek-btn:active{transform:none}
    .peek-btn.primary.bloom::after,.open-art.bloom::after,.finish.bloom::after{animation:none}
  }

  .today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  #sound-slot:empty{display:none}
  .sound-btn{width:44px;height:44px;border-radius:10px;border:1px solid #27272a;background:rgba(19,19,22,.7);
             color:#a8a29e;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .sound-btn.on{border-color:rgba(245,158,11,.45);color:#fcd34d;background:rgba(245,158,11,.12)}
  .sound-btn:active{opacity:.7}

  .dcard{
    display:block;width:100%;text-align:left;margin-top:16px;padding:0;cursor:pointer;
    background:#131316;border:1px solid #1f1f23;border-radius:14px;overflow:hidden;
  }
  /* transform stays on the shared press rule above — repeating it here with a
     different duration silently overrode the asymmetric timing. */
  .dcard:active{background:#18181b}
  .dcard > span{display:block}
  .cbar{height:2px}
  .cbar-calm{background:rgba(125,211,252,.5)}
  .cbar-confront{background:rgba(251,113,133,.55)}
  .cbar-fuel{background:rgba(245,158,11,.55)}
  .dthumb{aspect-ratio:16/9}
  .dbody{padding:12px 14px 15px}
  .metarow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .mmeta{font-size:11px;font-weight:600;color:#78716c;letter-spacing:.04em;white-space:nowrap}
  .dtitle{display:block;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.3;font-weight:700;color:#e8dfcd;margin-top:8px}
  .dchan{display:block;font-size:12px;color:#a8a29e;margin-top:3px}
  .dwhy{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px;line-height:1.5;color:rgba(214,197,163,.6);margin-top:8px}
  .dcard.finished{opacity:.55}

  .fin{margin:40px 0 6px;text-align:center}
  .fin-orn{font-size:17px;color:#c9a86a;opacity:.6}
  .fin-rule{width:56px;height:1px;background:#27272a;margin:12px auto 0}
  .fin-text{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:#78716c;margin-top:12px;line-height:1.6}
  .fin-build{margin-top:14px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#3f3f46;user-select:all}

  /* ---- Browse ----------------------------------------------------------- */
  .charge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}
  .charge-btn{
    min-height:78px;border-radius:12px;border:1px solid #27272a;background:#131316;cursor:pointer;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;
    padding:10px 11px;color:#a1a1aa;text-align:left;transition:background .12s ease;
  }
  .charge-btn:active{opacity:.75}
  .cdot{width:7px;height:7px;border-radius:9999px;display:inline-block;margin-right:6px;flex:none}
  .cdot-calm{background:#7dd3fc}
  .cdot-confront{background:#fda4af}
  .cdot-fuel{background:#fcd34d}
  .cname{font-size:14px;font-weight:700;color:#d6d3d1;display:flex;align-items:center}
  .chint{font-size:10.5px;color:#71717a;line-height:1.3}
  .ccount{font-size:10px;color:#57534e;font-weight:600;margin-top:2px}
  .charge-btn.on-calm{background:rgba(12,74,110,.26);border-color:rgba(125,211,252,.5)}
  .charge-btn.on-calm .cname,.charge-btn.on-calm .chint,.charge-btn.on-calm .ccount{color:#7dd3fc}
  .charge-btn.on-confront{background:rgba(136,19,55,.26);border-color:rgba(253,164,175,.5)}
  .charge-btn.on-confront .cname,.charge-btn.on-confront .chint,.charge-btn.on-confront .ccount{color:#fda4af}
  .charge-btn.on-fuel{background:rgba(120,53,15,.28);border-color:rgba(252,211,77,.5)}

        color:#e4e4e7;font-size:13px;font-weight:600;cursor:pointer}

  .q-block{margin-top:22px}

  .q-frame .qn{color:#fcd34d;margin-right:7px}

  /* Philosophy's long ladder announces itself, so six questions read as a
     deliberate depth rather than the app having got greedy. */
  .q-deep-note{font-family:Georgia,"Times New Roman",serif;font-style:italic;
               font-size:12.5px;line-height:1.5;color:rgba(214,197,163,.5);
               margin-top:18px;padding-left:11px;
               border-left:2px solid rgba(201,168,106,.34)}

  /* The takeaway is the reason the other five were asked. It gets the brass
     rule and the larger type so it does not read as question six of six. */
  .q-block.keystone{margin-top:30px;padding:15px 15px 3px;border-radius:14px;
    background:linear-gradient(180deg,rgba(245,158,11,.075),rgba(245,158,11,.02));
    border:1px solid rgba(201,168,106,.26)}
  .q-block.keystone .q-frame{color:#c9a86a}
  .q-block.keystone .q-text{font-size:17px;color:#e8dfcd}
  .q-block.keystone .ruled{caret-color:#fcd34d}

  /* Ruled writing surfaces. No borders, no background boxes — the ruling
     is the affordance. Text sits on a 34px rhythm so lines stay true. */
  .ruled{
    min-height:69px;line-height:34px;font-size:16px;color:#e9e2d0;margin-top:4px;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(216,200,166,.14) 33px,rgba(216,200,166,.14) 34px);
    background-attachment:local;
    outline:none;border:none;padding:0 2px;caret-color:#f59e0b;word-break:break-word;white-space:pre-wrap;
  }
  .ruled:empty::before{content:attr(data-ph);color:rgba(214,197,163,.3);font-style:italic}

  /* The journal: ONE sheet of ruled paper. The ruling lives on the sheet,
     headings are pre-printed onto the same lines, and the writing areas are
     transparent so everything shares a single continuous rule. */
  .sheet{
    position:relative;margin-top:10px;padding:0 2px 34px 18px;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(216,200,166,.14) 33px,rgba(216,200,166,.14) 34px);
  }
  .sheet::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:rgba(201,168,106,.22)}
  .sheet-h{
    font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:700;color:#d8c8a6;
    letter-spacing:.03em;line-height:34px;margin:0;
  }
  .sheet-line{
    line-height:34px;font-size:16px;color:#e9e2d0;min-height:68px;
    outline:none;border:none;background:transparent;padding:0;margin:0;
    caret-color:#f59e0b;word-break:break-word;white-space:pre-wrap;
  }
  .sheet-line:empty::before{content:attr(data-ph);color:rgba(214,197,163,.3);font-style:italic}

  .offline{padding:60px 24px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#78716c;line-height:1.8}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation:none !important}
  }

  /* ==================================================================== */
  /* LIQUID GLASS                                                          */
  /* ==================================================================== */
  /* Real glass does three things a flat translucent panel does not: it
     refracts what is behind it, it catches a specular highlight along the
     lit edge, and it drops a shadow that proves it is floating rather than
     painted on. All three, or it just looks like low opacity.

     Warm, not neutral. This app is a lamplit reading room, and glass tinted
     toward brass keeps it that way; a neutral white sheen turned the whole
     thing into a generic system panel the first time round.

     backdrop-filter is expensive, and on a phone it is expensive per element
     per frame. So the full recipe goes on chrome only -- the tab bar, the
     title bar, sheets, the small floating controls -- all of which are
     few, fixed, and already composited. Cards get the cheap half: the sheen
     and the rim, no blur. There can be forty cards on screen and blurring
     each one drops the rail to single figures. */
  :root{
    --glass-tint:rgba(38,32,24,.58);
    --glass-tint-strong:rgba(24,20,16,.76);
    --glass-blur:blur(22px) saturate(165%);
    --glass-rim:rgba(232,223,205,.13);
    --glass-spec:rgba(255,246,224,.16);
    --glass-drop:0 10px 30px rgba(0,0,0,.44);
  }

  /* The sheen: a diagonal band of light across the top-left, the way a pane
     catches a room. Sits under content via z-index, never intercepts taps. */
  .glassy{position:relative;isolation:isolate}
  .glassy::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
    background:
      linear-gradient(135deg,var(--glass-spec) 0%,transparent 42%),
      linear-gradient(0deg,rgba(0,0,0,.16) 0%,transparent 34%);
  }

  /* ---- chrome: the full recipe ---------------------------------------- */
  #tabbar{
    background:var(--glass-tint-strong);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
    border-top:1px solid var(--glass-rim);
    box-shadow:inset 0 1px 0 var(--glass-spec),0 -8px 26px rgba(0,0,0,.34);
  }
  .topbar{
    background:var(--glass-tint-strong);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
    box-shadow:inset 0 1px 0 var(--glass-spec);
  }
  .topbar.on{border-bottom-color:var(--glass-rim)}

  /* Sheets are the one place the blur is the whole point -- the page
     receding behind them is what sells the depth the feel layer added. */
  .peek,#paper,.sound-sheet{
    background:var(--glass-tint-strong);
    -webkit-backdrop-filter:blur(30px) saturate(170%);
    backdrop-filter:blur(30px) saturate(170%);
    border-top:1px solid var(--glass-rim);
    box-shadow:inset 0 1px 0 var(--glass-spec),0 -18px 50px rgba(0,0,0,.55);
  }

  /* ---- small floating controls ---------------------------------------- */
  .sound-btn,.close-btn,.peek-btn,.hbtn,.morebtn,.clearbtn,.fchip,.charge-btn{
    background:var(--glass-tint);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    backdrop-filter:blur(14px) saturate(150%);
    border:1px solid var(--glass-rim);
    box-shadow:inset 0 1px 0 var(--glass-spec),0 2px 10px rgba(0,0,0,.28);
  }
  .badge,.check{
    background:rgba(18,15,12,.62);
    -webkit-backdrop-filter:blur(10px) saturate(150%);
    backdrop-filter:blur(10px) saturate(150%);
    box-shadow:inset 0 1px 0 var(--glass-spec);
  }

  /* ---- cards: sheen and rim, no blur ---------------------------------- */
  .dcard,.qcard,.row,.pagecard{
    position:relative;isolation:isolate;
    border-color:var(--glass-rim);
    box-shadow:inset 0 1px 0 var(--glass-spec),0 6px 18px rgba(0,0,0,.30);
  }
  .dcard::before,.qcard::before,.row::before,.pagecard::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;z-index:-1;
    background:linear-gradient(135deg,var(--glass-spec) 0%,transparent 46%);
  }

  .pill{
    -webkit-backdrop-filter:blur(8px) saturate(160%);
    backdrop-filter:blur(8px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,246,224,.10);
  }

  /* ---- the heart ------------------------------------------------------- */
  /* Top-left, because .check already owns top-right and the two must never
     land on top of each other on a finished item. 34px hit area around a
     15px glyph -- the glyph is the target you see, not the target you get. */
  .heart{
    position:absolute;top:0;left:0;width:36px;height:36px;z-index:3;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .heart svg{
    fill:rgba(9,9,11,.34);stroke:rgba(232,223,205,.78);stroke-width:1.5;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
    transition:fill .22s ease,stroke .22s ease,transform .38s cubic-bezier(.16,1.02,.32,1);
  }
  .heart:active svg{transform:scale(.86);transition-duration:.09s}
  .heart.on svg{fill:#f59e0b;stroke:#fcd34d}
  @keyframes heartpop{
    0%{transform:scale(.86)}42%{transform:scale(1.28)}70%{transform:scale(.96)}100%{transform:scale(1)}
  }
  .heart.pop svg{animation:heartpop .46s cubic-bezier(.22,.85,.3,1)}

  /* ---- the soundtrack sheet -------------------------------------------- */
  #sound{position:fixed;inset:0;z-index:130;visibility:hidden;pointer-events:none}
  #sound.on{visibility:visible;pointer-events:auto}
  #sound-scrim{position:absolute;inset:0;background:rgba(6,6,8,.72);opacity:0;
               transition:opacity .3s ease;-webkit-backdrop-filter:blur(3px);
               backdrop-filter:blur(3px)}
  #sound.on #sound-scrim{opacity:1}
  /* The track list scrolls, the sheet does not. With fifteen sounds and only
     eight shelves the rows outgrew the sheet, and when the whole sheet was the
     scroller the volume slider and the off switch sat below the fold — you had
     to scroll past every track to turn the music down. Head and footer are
     pinned; only .snd-list moves. */
  .sound-sheet{position:absolute;left:0;right:0;bottom:0;
    border-radius:20px 20px 0 0;
    padding:0 0 calc(env(safe-area-inset-bottom,0px) + 18px);
    transform:translateY(100%);
    transition:transform .38s cubic-bezier(.32,.72,.28,1);
    max-height:86dvh;display:flex;flex-direction:column;
    overflow:hidden;overscroll-behavior:contain}
  #sound.on .sound-sheet{transform:translateY(0)}
  #sound-grab{display:block;width:100%;min-height:44px;border:none;flex:0 0 auto;
              background:transparent;padding:11px 0 7px}
  #sound-grab::before{content:"";display:block;width:38px;height:4px;border-radius:2px;
                      background:#3f3f46;margin:0 auto}
  #sound-body{padding:4px 18px 4px;display:flex;flex-direction:column;
              flex:1 1 auto;min-height:0}
  /* min-height:0 on both this and #sound-body, or the flex item refuses to
     shrink below its content and the scroller never engages. */
  .snd-list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
            margin:0 -4px;padding:0 4px}
  .snd-grp{font-family:Georgia,"Times New Roman",serif;font-size:10px;
           letter-spacing:.22em;text-transform:uppercase;color:#57575e;
           padding:12px 12px 6px;position:sticky;top:0;z-index:1;
           background:linear-gradient(180deg,rgba(17,17,19,.97),rgba(17,17,19,.86))}
  .snd-list > .snd-grp:first-child{padding-top:2px}

  /* flex:0 0 auto on all three, or the column shares the squeeze with them and
     the note goes elliptical instead of the list scrolling. */

   rebuilt and re-spliced on every deploy, so anything written onto an item is

    try { localStorage.setItem(KEY, JSON.stringify(ids)); } catch (e) {}

    has: function (id) { return ids.indexOf(id) >= 0; },
    count: function () { return ids.length; },

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0c">
<title>The Library</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ------------------------------------------------------------------ */
  /* The Library, mobile. A lamplit reading room, not a media app.      */
  /* Ink #0b0b0c · panels #131316/#18181b · hairlines #27272a/#3f3f46   */
  /* Amber #f59e0b · bright #fcd34d · brass #c9a86a                     */
  /* Paper #0d0c0a · paper text #e8dfcd/#d8c8a6                         */
  /* ------------------------------------------------------------------ */
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;height:100dvh;overflow:hidden;
    background:#0b0b0c;color:#d6d3d1;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  img{max-width:100%}
  button{font-family:inherit;color:inherit}
  :root{color-scheme:dark}

  /* ---- screens: three stacked scroll containers, one visible -------- */
  .screen{
    position:fixed;top:0;left:0;right:0;
    bottom:calc(60px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    visibility:hidden;
  }
  .screen.on{visibility:visible}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 36px}

  /* ---- bottom nav ---------------------------------------------------- */
  #tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;height:calc(60px + env(safe-area-inset-bottom,0px));
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:rgba(11,11,12,.96);border-top:1px solid #1c1c1f;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  .tab{
    flex:1;min-height:44px;border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:#71717a;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  }
  .tab svg{width:21px;height:21px}
  .tab.on{color:#fcd34d}
  .tab:active{opacity:.65}

  /* ---- shared bits ---------------------------------------------------- */
  .kicker{font-family:Georgia,"Times New Roman",serif;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:#c9a86a}
  .h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;line-height:1.2;font-weight:700;color:#e8dfcd;margin:6px 0 0}
  .sub{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:#78716c;margin-top:5px}
  .axis-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#a8a29e;margin:22px 0 0}
  .axis-label.brass{color:#c9a86a}

  .pill{display:inline-flex;align-items:center;border-radius:9999px;padding:1px 8px;font-size:10px;font-weight:700;letter-spacing:.02em;line-height:1.7;white-space:nowrap}
  .pill-calm{background:rgba(12,74,110,.35);color:#7dd3fc}
  .pill-confront{background:rgba(136,19,55,.35);color:#fda4af}
  .pill-fuel{background:rgba(120,53,15,.35);color:#fcd34d}

  .clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}

  .thumbbox{position:relative;display:block;overflow:hidden;background:linear-gradient(160deg,#161310,#221e17)}
  .thumbbox img{width:100%;height:100%;object-fit:cover;display:block}
  .thumbbox.noimg img{display:none}
  .tglyph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;font-size:26px;color:#c9a86a;opacity:.65}
  .thumbbox.noimg .tglyph,.thumbbox.nothumb .tglyph{display:flex}
  .badge{position:absolute;right:6px;bottom:6px;border-radius:6px;background:rgba(9,9,11,.85);color:#e7e5e4;font-size:11px;font-weight:600;padding:2px 6px;line-height:1.2;z-index:2}
  .check{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:9999px;background:rgba(9,9,11,.8);color:#fbbf24;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2}

  /* ---- Today ----------------------------------------------------------- */
  .glow{position:absolute;top:-130px;left:50%;transform:translateX(-50%);width:430px;height:300px;
        background:radial-gradient(closest-side,rgba(245,158,11,.07),transparent);pointer-events:none}
  #screen-today .wrap{position:relative}
  .today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  #sound-slot:empty{display:none}
  .sound-btn{width:44px;height:44px;border-radius:10px;border:1px solid #27272a;background:rgba(19,19,22,.7);
             color:#a8a29e;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .sound-btn.on{border-color:rgba(245,158,11,.45);color:#fcd34d;background:rgba(245,158,11,.12)}
  .sound-btn:active{opacity:.7}

  .dcard{
    display:block;width:100%;text-align:left;margin-top:16px;padding:0;cursor:pointer;
    background:#131316;border:1px solid #1f1f23;border-radius:14px;overflow:hidden;
    transition:transform .12s ease,background .12s ease;
  }
  .dcard:active{transform:scale(.985);background:#18181b}
  .dcard > span{display:block}
  .cbar{height:2px}
  .cbar-calm{background:rgba(125,211,252,.5)}
  .cbar-confront{background:rgba(251,113,133,.55)}
  .cbar-fuel{background:rgba(245,158,11,.55)}
  .dthumb{aspect-ratio:16/9}
  .dbody{padding:12px 14px 15px}
  .metarow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .mmeta{font-size:11px;font-weight:600;color:#78716c;letter-spacing:.04em;white-space:nowrap}
  .dtitle{display:block;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.3;font-weight:700;color:#e8dfcd;margin-top:8px}
  .dchan{display:block;font-size:12px;color:#a8a29e;margin-top:3px}
  .dwhy{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px;line-height:1.5;color:rgba(214,197,163,.6);margin-top:8px}
  .dcard.finished{opacity:.55}

  .fin{margin:40px 0 6px;text-align:center}
  .fin-orn{font-size:17px;color:#c9a86a;opacity:.6}
  .fin-rule{width:56px;height:1px;background:#27272a;margin:12px auto 0}
  .fin-text{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:#78716c;margin-top:12px;line-height:1.6}

  /* ---- Browse ----------------------------------------------------------- */
  .charge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}
  .charge-btn{
    min-height:78px;border-radius:12px;border:1px solid #27272a;background:#131316;cursor:pointer;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;
    padding:10px 11px;color:#a1a1aa;text-align:left;transition:background .12s ease;
  }
  .charge-btn:active{opacity:.75}
  .cdot{width:7px;height:7px;border-radius:9999px;display:inline-block;margin-right:6px;flex:none}
  .cdot-calm{background:#7dd3fc}
  .cdot-confront{background:#fda4af}
  .cdot-fuel{background:#fcd34d}
  .cname{font-size:14px;font-weight:700;color:#d6d3d1;display:flex;align-items:center}
  .chint{font-size:10.5px;color:#71717a;line-height:1.3}
  .ccount{font-size:10px;color:#57534e;font-weight:600;margin-top:2px}
  .charge-btn.on-calm{background:rgba(12,74,110,.26);border-color:rgba(125,211,252,.5)}
  .charge-btn.on-calm .cname,.charge-btn.on-calm .chint,.charge-btn.on-calm .ccount{color:#7dd3fc}
  .charge-btn.on-confront{background:rgba(136,19,55,.26);border-color:rgba(253,164,175,.5)}
  .charge-btn.on-confront .cname,.charge-btn.on-confront .chint,.charge-btn.on-confront .ccount{color:#fda4af}
  .charge-btn.on-fuel{background:rgba(120,53,15,.28);border-color:rgba(252,211,77,.5)}
  .charge-btn.on-fuel .cname,.charge-btn.on-fuel .chint,.charge-btn.on-fuel .ccount{color:#fcd34d}

  .chip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}
  .fchip{
    min-height:48px;border-radius:10px;border:1px solid #27272a;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    color:#a1a1aa;padding:6px 4px;
  }
  .fchip:active{opacity:.7}
  .fchip .fname{font-size:12.5px;font-weight:700}
  .fchip .fhint{font-size:10px;color:#71717a}
  .fchip.on{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.10)}
  .fchip.on .fname,.fchip.on .fhint{color:#fcd34d}

  .resultline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;min-height:24px}
  .rcount{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:#78716c}
  .clearbtn{border:none;background:none;color:#c9a86a;font-size:12px;font-weight:600;cursor:pointer;min-height:44px;padding:0 4px}
  .clearbtn:active{opacity:.6}

  .shelf{margin-top:10px}
  .shelf-head{display:flex;align-items:baseline;gap:8px;padding:10px 0 2px;min-height:24px}
  .shelf-name{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#d6d3d1}
  .shelf-count{font-size:11px;color:#57534e;font-weight:600}
  .shelf-rule{flex:1;height:1px;background:#1c1c1f;align-self:center}

  .row{
    display:flex;gap:12px;align-items:center;width:100%;min-height:44px;padding:8px 0;
    background:none;border:none;border-bottom:1px solid #131316;text-align:left;cursor:pointer;
  }
  .row:active{background:#131316}
  .row > span{display:block}
  .rthumb{width:100px;aspect-ratio:16/9;border-radius:8px;flex:none}
  .rthumb .badge{font-size:10px;padding:1px 5px;right:4px;bottom:4px}
  .rthumb .tglyph{font-size:18px}
  .rbody{flex:1;min-width:0}
  .rtitle{font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.35;font-weight:700;color:#e7e0d0}
  .rmeta{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
  .rsub{font-size:11px;color:#78716c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14ch}
  .row.finished .rtitle{color:#78716c}

  .morebtn{
    display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:2px;
    border:none;background:none;color:#c9a86a;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;
  }
  .morebtn:active{opacity:.6}
  .noresult{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#78716c;font-size:14px;margin-top:26px;text-align:center;line-height:1.7}

  /* ---- Journal ----------------------------------------------------------- */
  .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
  .stat{background:#131316;border:1px solid #1f1f23;border-radius:12px;padding:12px 8px;text-align:center}
  .stat-n{font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:700;color:#e8dfcd;line-height:1.1}
  .stat-l{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#78716c;margin-top:4px}
  .daystrip{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .day{width:16px;height:16px;border-radius:4px;background:#141416;border:1px solid #1f1f23;flex:none}
  .day.hit{background:rgba(245,158,11,.75);border-color:rgba(245,158,11,.75)}
  .day.today{border-color:#c9a86a}
  .honesty{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:12px;color:#78716c;margin-top:8px}
  .quizline{font-size:12px;color:#a8a29e;margin-top:16px;line-height:1.6}
  .quizline b{color:#fcd34d;font-weight:700}

  .pagecard{
    display:block;width:100%;text-align:left;cursor:pointer;margin-top:10px;
    background:linear-gradient(160deg,#151310,#191612);border:1px solid #2e2a24;border-radius:12px;padding:13px 14px;
  }
  .pagecard:active{opacity:.8}
  .pagecard > span{display:block}
  .pg-title{font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.35;font-weight:700;color:#e8dfcd}
  .pg-snip{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;line-height:1.5;color:rgba(214,197,163,.55);margin-top:6px}
  .pg-meta{font-size:10.5px;color:#78716c;margin-top:8px;font-weight:600}
  .j-empty{text-align:center;margin-top:44px}
  .nudge{font-size:12px;color:#78716c;margin-top:14px;font-style:italic;font-family:Georgia,"Times New Roman",serif}

  /* ---- Paper: the full-screen reading/watching view ---------------------- */
  #paper{
    position:fixed;inset:0;z-index:60;background:#0d0c0a;visibility:hidden;
    transform:translateY(102%);
    transition:transform .3s cubic-bezier(.32,.72,.28,1),visibility 0s .3s;
  }
  #paper.open{visibility:visible;transform:none;transition:transform .3s cubic-bezier(.32,.72,.28,1)}
  #paper-scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .paperbar{
    position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;
    background:rgba(13,12,10,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(216,200,166,.08);
  }
  .paper-label{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:12px;color:rgba(214,197,163,.5);
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #save-ind{opacity:0;transition:opacity .3s;font-size:11px;color:rgba(245,158,11,.75);font-style:italic;
            font-family:Georgia,"Times New Roman",serif;flex:none;margin-left:auto;padding-right:8px}
  .close-btn{
    min-width:64px;min-height:44px;flex:none;border-radius:10px;cursor:pointer;
    border:1px solid rgba(216,200,166,.16);background:rgba(24,22,18,.6);
    color:#d8c8a6;font-size:13px;font-weight:600;
  }
  .close-btn:active{opacity:.7}

  .notebook{max-width:640px;margin:0 auto;padding:16px 18px calc(90px + env(safe-area-inset-bottom,0px));color:#e6dfcd}
  .stage{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:1px solid rgba(216,200,166,.08)}
  .stage iframe{width:100%;height:100%;border:0;display:block}
  .arthero{aspect-ratio:16/9;border-radius:12px}
  .open-art{
    display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;margin-top:12px;
    border:1px solid rgba(245,158,11,.4);border-radius:10px;background:rgba(245,158,11,.10);
    color:#fcd34d;font-weight:600;font-size:14px;text-decoration:none;
  }
  .open-art:active{opacity:.7}

  .nb-title{font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.3;font-weight:700;color:#ece4d2;margin-top:16px}
  .nb-meta{font-size:12px;color:rgba(214,197,163,.55);margin-top:5px}
  .nb-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
  .nb-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#78716c}
  .nb-why{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:rgba(214,197,163,.6);font-size:14px;line-height:1.55;margin-top:11px}

  .finish{
    width:100%;min-height:48px;margin-top:18px;border-radius:10px;cursor:pointer;
    border:1px solid #3f3f46;background:rgba(24,24,27,.5);color:#e4e4e7;font-weight:600;font-size:14px;
  }
  .finish:active{opacity:.7}
  .finish.done{border-color:rgba(245,158,11,.45);color:#fcd34d;background:rgba(245,158,11,.10)}

  .nb-label{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,158,11,.7);margin:34px 0 0}
  .habit{border:1px solid rgba(216,200,166,.14);border-radius:12px;padding:14px;background:rgba(22,19,15,.5);margin-top:10px}
  .habit-title{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:700;color:#e8dfcd}
  .habit-line{font-size:14px;line-height:1.65;color:#e9e2d0;margin-top:8px}
  .habit-line .arrow{color:rgba(245,158,11,.7)}
  .habit-days{font-size:12px;color:rgba(214,197,163,.55);margin-top:6px}
  .habit-why{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:rgba(214,197,163,.55);margin-top:8px;line-height:1.5}
  .habit-btns{display:flex;gap:8px;margin-top:12px}
  .hbtn{flex:1;min-height:44px;border-radius:9px;border:1px solid #3f3f46;background:rgba(24,24,27,.5);
        color:#e4e4e7;font-size:13px;font-weight:600;cursor:pointer}
  .hbtn:active{opacity:.7}
  .hbtn.take.on{border-color:rgba(245,158,11,.45);color:#fcd34d;background:rgba(245,158,11,.12)}
  .habit-mark{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#fcd34d;margin-top:12px}

  .q-block{margin-top:22px}
  .q-frame{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(214,197,163,.45)}
  .q-frame .qn{color:#fcd34d;margin-right:7px}
  .q-text{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.45;font-weight:700;color:#d8c8a6;margin-top:3px}
  .q-progress{font-size:11px;color:rgba(214,197,163,.45);margin-top:14px;font-style:italic;font-family:Georgia,"Times New Roman",serif}

  /* Ruled writing surfaces. No borders, no background boxes — the ruling
     is the affordance. Text sits on a 34px rhythm so lines stay true. */
  .ruled{
    min-height:69px;line-height:34px;font-size:16px;color:#e9e2d0;margin-top:4px;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(216,200,166,.14) 33px,rgba(216,200,166,.14) 34px);
    background-attachment:local;
    outline:none;border:none;padding:0 2px;caret-color:#f59e0b;word-break:break-word;white-space:pre-wrap;
  }
  .ruled:empty::before{content:attr(data-ph);color:rgba(214,197,163,.3);font-style:italic}

  /* The journal: ONE sheet of ruled paper. The ruling lives on the sheet,
     headings are pre-printed onto the same lines, and the writing areas are
     transparent so everything shares a single continuous rule. */
  .sheet{
    position:relative;margin-top:10px;padding:0 2px 34px 18px;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(216,200,166,.14) 33px,rgba(216,200,166,.14) 34px);
  }
  .sheet::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:rgba(201,168,106,.22)}
  .sheet-h{
    font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:700;color:#d8c8a6;
    letter-spacing:.03em;line-height:34px;margin:0;
  }
  .sheet-line{
    line-height:34px;font-size:16px;color:#e9e2d0;min-height:68px;
    outline:none;border:none;background:transparent;padding:0;margin:0;
    caret-color:#f59e0b;word-break:break-word;white-space:pre-wrap;
  }
  .sheet-line:empty::before{content:attr(data-ph);color:rgba(214,197,163,.3);font-style:italic}

  .offline{padding:60px 24px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#78716c;line-height:1.8}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation:none !important}
  }
</style>

          }).catch(function () {});
        }
      } catch (e) {}
    });
    S.state.armed = true;

    /* Unlocking the elements is not the same as playing something. Without
       this, arming left playing=false, and S.onSection returns early on
       !playing, so scrolling never started a track and the whole soundtrack
       was silent no matter how far you scrolled.

       Start here, inside the same user gesture, which is also the only moment
       the browser will reliably allow it. */
    var t = trackForShelf(S._lastShelf) || firstAvailable();
    if (t) start(t);

    /* _lastShelf can be stale — opening the sound panel is a modal and moves
       what owns the middle of the viewport, so arming from the top of the page
       would otherwise start the Articles track. Re-pick now that playing is
       true, which corrects it to the shelf actually on screen. */
    if (S._pick) { try { S._pick(); } catch (e) {} }

    emit();
  };

  function firstAvailable() {
    for (var i = 0; i < TRACKS.length; i++) {
      if (TRACKS[i].available) return TRACKS[i];
    }
    return null;
  }

  S.preview = function (id) {
    var t = byId(id);
    if (!t) return;
    S.state.armed = true;
    start(t);
  };

  S.stop = function () {
    if (ramp) cancelAnimationFrame(ramp);
    ramp = null;
    players.forEach(function (p) { p.pause(); p.volume = 0; });
    S.state.playing = false;
    S.state.current = null;
    emit();
  };

  S.assign = function (id, shelf) {
    var t = byId(id);
    if (!t || SHELVES.indexOf(shelf) < 0) return;
    t.shelf = shelf;
    persist();
    emit();
  };

  S.setVolume = function (v) {
    v = Math.max(0, Math.min(1, Number(v) || 0));
    S.state.volume = v;
    if (S.state.muted && v > 0) S.state.muted = false;
    players[active].volume = target();
    persist();
    emit();
  };

  S.toggleMute = function () {
    S.state.muted = !S.state.muted;
    players[active].volume = target();
    persist();
    emit();
  };

  /* Section following. The design layer marks each section with
     data-shelf; we watch which one owns the middle of the viewport. */
  S.onSection = function (shelf) {
    if (!S.state.follow || !S.state.playing) return;
    /* trackForShelf strips the design layer's "__" prefix on its non-shelf
       sections, so an assignment of "articles" still lands on "__articles". */
    var t = trackForShelf(shelf);
    /* No sound assigned to this section: hold the current one rather than
       dropping into silence, which reads as a bug. */
    if (t && t.id !== S.state.current) start(t);
  };

  S.observe = function (root) {
    if (!("IntersectionObserver" in window)) return;
    if (S._io) { S._io.disconnect(); S._io = null; }

    /* data-shelf may sit on a small header button rather than the section box.
       Watch the enclosing section when there is one, so the crossfade tracks
       the block you are actually reading and not a 30px header. */
    var seen = [];
    var marked = (root || document).querySelectorAll("[data-shelf]");
    for (var i = 0; i < marked.length; i++) {
      var node = marked[i];
      var box = node.closest ? (node.closest("section") || node) : node;
      var shelf = node.getAttribute("data-shelf");
      if (!shelf) continue;
      var dup = false;
      for (var j = 0; j < seen.length; j++) {
        if (seen[j].box === box) { dup = true; break; }
      }
      if (!dup) seen.push({ box: box, shelf: shelf });
    }
    if (!seen.length) return;

    /* A fixed centre band cannot work: the page runs out of scroll before the
       last section reaches the middle, so Articles could never win and would
       never get its own sound. Instead the focus line travels down the
       viewport as you scroll, from near the top at the start to near the
       bottom at the end, which makes both the first and last section
       reachable. */
    function pick() {
      var vh = window.innerHeight;
      var max = Math.max(0, document.documentElement.scrollHeight - vh);
      var y = window.scrollY;

      var boxes = [];
      for (var i = 0; i < seen.length; i++) {
        var r = seen[i].box.getBoundingClientRect();
        if (r.height > 0 && r.bottom > 0 && r.top < vh) {
          boxes.push({ s: seen[i], r: r });
        }
      }
      if (!boxes.length) return;

      var win;
      if (max > 0 && y >= max - 4) {
        /* Bottom of the page. The last sections can never reach the centre,
           so the last visible one is what you are actually looking at. */
        win = boxes[boxes.length - 1].s;
      } else if (y <= 4) {
        win = boxes[0].s;
      } else {
        /* Normal case: whoever owns the middle of the viewport, falling back
           to the largest slice of it. */
        var mid = vh * 0.5, hit = null, bestArea = -1, biggest = null;
        for (var j = 0; j < boxes.length; j++) {
          var b = boxes[j].r;
          if (b.top <= mid && b.bottom >= mid) { hit = boxes[j].s; break; }
          var area = Math.min(b.bottom, vh) - Math.max(b.top, 0);
          if (area > bestArea) { bestArea = area; biggest = boxes[j].s; }
        }
        win = hit || biggest;
      }

      if (win && win.shelf !== S._lastShelf) {
        S._lastShelf = win.shelf;
        S.onSection(win.shelf);
      }
    }

    var queued = false;
    function schedule() {
      if (queued) return;
      queued = true;
      requestAnimationFrame(function () { queued = false; pick(); });
    }

    var io = new IntersectionObserver(schedule, { threshold: [0, 0.5, 1] });
    seen.forEach(function (s) { io.observe(s.box); });

    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", schedule, { passive: true });

    S._io = io;
    S._pick = pick;
    S._watching = seen.length;
    schedule();
  };

  S._players = players;   /* introspection hook for the headless tests */
  window.Sound = S;
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { S.observe(); });
  } else {
    S.observe();
  }
})();
</script>
<!-- library:sound:end -->
</head>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ */
  /* state                                                                */
  /* ------------------------------------------------------------------ */
  var UI = {
    tab: "today",
    charge: null, weight: null, medium: null,
    openShelves: {},
    paperId: null,
    journalAll: false
  };

  var SHELF_ORDER = ["mind", "momentum", "philosophy", "craft", "culture", "world", "money", "unsorted"];
  var SHELF_CAP = 4;
  var PAGE_CAP = 8;

  var CHARGES = {
    calm:     { name: "Calm",     hint: "settle the mind" },
    confront: { name: "Confront", hint: "face something" },
    fuel:     { name: "Fuel",     hint: "get moving" }
  };
  var WEIGHTS = {
    quick:    { name: "Quick",    hint: "under 15m" },
    standard: { name: "Standard", hint: "15–40m" },
    deep:     { name: "Deep",     hint: "40m and up" }
  };
  var MEDIUMS = {
    "":        { name: "Everything", hint: "both kinds" },
    "video":   { name: "Video",      hint: "watch" },
    "article": { name: "Article",    hint: "read" }
  };

  /* ------------------------------------------------------------------ */
  /* helpers                                                              */
  /* ------------------------------------------------------------------ */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function items() { return window.ITEMS || []; }
  function byId(id) {
    var a = items();
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function toHtml(s) { return esc(s).replace(/\n/g, "<br>"); }

  function fmtDur(sec) {
    sec = sec || 0;
    var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    if (h > 0) return h + "h" + (m ? " " + m + "m" : "");
    return Math.max(1, m) + " min";
  }
  function fmtDurShort(sec) {
    sec = sec || 0;
    var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    if (h > 0) return h + "h " + (m ? m + "m" : "");
    return Math.max(1, m) + "m";
  }
  function fmtTotal(sec) {
    var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    if (h > 0) return h + "h " + m + "m";
    return m + "m";
  }
  function fmtViews(n) {
    if (!n) return "";
    if (n >= 1e6) return (Math.round(n / 1e5) / 10) + "M views";
    if (n >= 1e3) return Math.round(n / 1e3) + "K views";
    return n + " views";
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function hasJournal(v) {
    var j = v.journal || {};
    return !!((j.learned || "").trim() || (j.matters || "").trim() || (j.use || "").trim());
  }

  function thumbHtml(v, cls, glyphOnly) {
    var glyph = v.medium === "article" ? "¶" : "▸";
    var inner = "";
    var box = "thumbbox " + (cls || "");
    if (v.thumb && !glyphOnly) {
      inner = '<img src="' + esc(v.thumb) + '" alt="" loading="lazy" ' +
              'onerror="this.parentNode.classList.add(\'noimg\')">';
    } else {
      box += " nothumb";
    }
    var badge = v.medium === "article"
      ? '<span class="badge">' + esc(fmtDurShort(v.duration)) + " read</span>"
      : '<span class="badge">' + esc(fmtDurShort(v.duration)) + "</span>";
    var check = v.watched ? '<span class="check">✓</span>' : "";
    return '<span class="' + box + '">' + inner +
           '<span class="tglyph">' + glyph + "</span>" + badge + check + "</span>";
  }

  /* ------------------------------------------------------------------ */
  /* daily picks: deterministic per calendar day. No reroll anywhere.     */
  /* ------------------------------------------------------------------ */
  function fnv(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function dailyPicks() {
    var all = items();
    /* If the splice layer provided the picks, they are the picks. */
    if (window.DAILY && window.DAILY.length) {
      var out = [];
      for (var i = 0; i < window.DAILY.length; i++) {
        var d = window.DAILY[i];
        var id = typeof d === "string" ? d : (d && d.id);
        var it = byId(id);
        if (it) out.push(it);
      }
      if (out.length) return out.slice(0, 3);
    }
    /* Fallback: hash each id against today's date, take the lowest three
       with distinct shelves and charges, relaxing if the pool is thin. */
    var key = todayKey();
    var pool = all.filter(function (v) { return !v.watched; });
    if (!pool.length) pool = all.slice();
    var scored = pool.map(function (v) { return { v: v, s: fnv(key + "|" + v.id) }; });
    scored.sort(function (a, b) { return a.s - b.s || (a.v.id < b.v.id ? -1 : 1); });

    var picks = [], shelves = {}, charges = {};
    [1, 2, 3].forEach(function (pass) {
      scored.forEach(function (e) {
        if (picks.length >= 3 || picks.indexOf(e.v) >= 0) return;
        if (pass === 1 && (shelves[e.v.shelf] || charges[e.v.charge])) return;
        if (pass === 2 && shelves[e.v.shelf]) return;
        picks.push(e.v);
        shelves[e.v.shelf] = 1;
        charges[e.v.charge] = 1;
      });
    });
    return picks;
  }

  /* ------------------------------------------------------------------ */
  /* server writes                                                        */
  /* ------------------------------------------------------------------ */
  /* Static build: no server. Persist to the device instead.
     Kept API-shaped (a promise resolving to a boolean) so callers are
     unchanged. Entries written here live only on this phone. */
  var LOCAL_KEY = "library.entries.v1";
  function localAll() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function postEntry(id, extra) {
    var all = localAll();
    var cur = all[id] || {};
    Object.keys(extra || {}).forEach(function (k) {
      if (k === "journal") {
        cur.journal = Object.assign({}, cur.journal, extra.journal);
      } else {
        cur[k] = extra[k];
      }
    });
    cur.updated = new Date().toISOString().slice(0, 19);
    all[id] = cur;
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(all)); }
    catch (e) { return Promise.resolve(false); }
    var v = byId(id);
    if (v) Object.assign(v, cur);
    return Promise.resolve(true);
  }
  /* Replay saved entries over the baked catalog on every load, or the phone
     would show blank journals for things already written on it. */
  (function () {
    var all = localAll();
    (window.ITEMS || []).forEach(function (v) {
      if (all[v.id]) Object.assign(v, all[v.id]);
    });
  })();
  /* ---- encrypted journal from the Mac ------------------------------- */
  /* journal.enc.json is AES-256-CBC with encrypt-then-HMAC, keyed by a
     passphrase (see journal_crypt.py). Parameters must match that file. */
  var JKEY = "library.journal.unlocked.v1";

  function b64(s) {
    var raw = atob(s), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  async function openJournal(bundle, pass) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pass),
      "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: b64(bundle.salt), iterations: bundle.iter,
        hash: "SHA-256" }, base, 512);
    var encKey = new Uint8Array(bits, 0, 32);
    var macKey = new Uint8Array(bits, 32, 32);

    var iv = b64(bundle.iv), ct = b64(bundle.ct);
    /* Verify before decrypting. A wrong passphrase must fail here rather than
       produce plausible-looking garbage. */
    var hk = await crypto.subtle.importKey("raw", macKey,
      { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    var signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv, 0); signed.set(ct, iv.length);
    var okMac = await crypto.subtle.verify("HMAC", hk, b64(bundle.tag), signed);
    if (!okMac) throw new Error("wrong passphrase");

    var ak = await crypto.subtle.importKey("raw", encKey,
      { name: "AES-CBC" }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, ak, ct);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function mergeJournal(entries) {
    var all = localAll();
    Object.keys(entries).forEach(function (id) {
      var incoming = entries[id], cur = all[id] || {};
      cur.journal = cur.journal || {};
      /* Only fill blanks. Anything already written on this phone is newer than
         the deploy and must not be overwritten by it. */
      ["learned", "matters", "use"].forEach(function (f) {
        if (!(cur.journal[f] || "").trim()) cur.journal[f] = incoming[f] || "";
      });
      all[id] = cur;
    });
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(all)); } catch (e) {}
    (window.ITEMS || []).forEach(function (v) {
      if (all[v.id]) Object.assign(v, all[v.id]);
    });
  }

  function unlockPrompt(bundle) {
    var wrap = document.createElement("div");
    wrap.setAttribute("style",
      "position:fixed;inset:0;z-index:200;background:rgba(8,8,10,.95);" +
      "display:flex;align-items:center;justify-content:center;padding:26px");
    wrap.innerHTML =
      '<div style="max-width:340px;width:100%">' +
      '<div style="font:700 11px/1 ui-sans-serif;letter-spacing:.18em;' +
      'text-transform:uppercase;color:#c9a86a;margin-bottom:9px">From the Mac</div>' +
      '<div style="font-family:Georgia,serif;font-size:23px;font-weight:700;' +
      'color:#e8dfcd;line-height:1.2">Unlock your journal</div>' +
      '<p style="font-size:13.5px;color:#8b8b93;margin:10px 0 18px;line-height:1.5">' +
      'Your entries are encrypted. Enter the passphrase once and this phone ' +
      'remembers it.</p>' +
      '<input id="jpass" type="password" autocomplete="current-password" ' +
      'placeholder="Passphrase" style="width:100%;min-height:46px;padding:0 13px;' +
      'border-radius:10px;border:1px solid #3f3f46;background:#131316;color:#e4e4e7;' +
      'font-size:16px;outline:none">' +
      '<div id="jerr" style="color:#fda4af;font-size:12.5px;min-height:17px;' +
      'margin-top:7px"></div>' +
      '<button id="jgo" style="width:100%;min-height:46px;margin-top:4px;' +
      'border-radius:10px;border:1px solid rgba(245,158,11,.45);' +
      'background:rgba(245,158,11,.14);color:#fcd34d;font-size:15px;' +
      'font-weight:700">Unlock</button>' +
      '<button id="jskip" style="width:100%;min-height:44px;margin-top:9px;' +
      'border:none;background:transparent;color:#6b6b73;font-size:13px">' +
      'Skip for now</button></div>';
    document.body.appendChild(wrap);

    var go = wrap.querySelector("#jgo"), inp = wrap.querySelector("#jpass"),
        err = wrap.querySelector("#jerr");
    function attempt() {
      err.textContent = "";
      go.textContent = "Unlocking\u2026";
      openJournal(bundle, inp.value).then(function (data) {
        mergeJournal(data.entries || {});
        try { localStorage.setItem(JKEY, "1"); } catch (e) {}
        wrap.remove();
        /* Redraw whichever screen is showing, so the entries appear without a
           reload. renderToday/renderJournal are the two that show journal text. */
        try { renderToday(); } catch (e) {}
        try { renderJournal(); } catch (e) {}
      }).catch(function () {
        err.textContent = "That passphrase did not open it.";
        go.textContent = "Unlock";
      });
    }
    go.addEventListener("click", attempt);
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") attempt();
    });
    wrap.querySelector("#jskip").addEventListener("click", function () {
      wrap.remove();
    });
  }

  /* Ask once per device, and never when there is nothing sealed to open. */
  if (!localStorage.getItem(JKEY)) {
    fetch("journal.enc.json")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (bundle) {
        if (bundle && bundle.ct) setTimeout(function () { unlockPrompt(bundle); }, 700);
      })
      .catch(function () {});
  }


  var saveTimer = null, saveHideTimer = null;
  function queueJournal() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushJournal, 800);
  }
  function flushJournal() {
    clearTimeout(saveTimer);
    saveTimer = null;
    var id = UI.paperId;
    if (!id) return;
    var j = {};
    ["learned", "matters", "use"].forEach(function (f) {
      var el = $('.sheet-line[data-field="' + f + '"]');
      if (el) j[f] = el.innerText.replace(/\u00a0/g, " ").replace(/\n+$/, "");
    });
    var v = byId(id);
    if (v) v.journal = Object.assign({}, v.journal, j);
    postEntry(id, { journal: j }).then(function (ok) { if (ok) showSaved(); });
  }
  function showSaved() {
    var el = $("#save-ind");
    if (!el) return;
    el.style.opacity = "1";
    clearTimeout(saveHideTimer);
    saveHideTimer = setTimeout(function () { el.style.opacity = "0"; }, 1600);
  }

  /* ------------------------------------------------------------------ */
  /* Today                                                                */
  /* ------------------------------------------------------------------ */
  function renderToday() {
    var h = new Date().getHours();
    $("#today-greeting").textContent =
      h < 12 ? "This morning’s three" : h < 18 ? "Today’s three" : "Tonight’s three";
    $("#today-date").textContent = new Date().toLocaleDateString(undefined,
      { weekday: "long", month: "long", day: "numeric" });

    var picks = dailyPicks();
    var html = picks.map(function (v) {
      return '' +
      '<button class="dcard' + (v.watched ? " finished" : "") + '" data-action="open" data-id="' + esc(v.id) + '">' +
        '<span class="cbar cbar-' + esc(v.charge) + '"></span>' +
        thumbHtml(v, "dthumb") +
        '<span class="dbody">' +
          '<span class="metarow">' +
            '<span class="pill pill-' + esc(v.charge) + '">' + esc(v.charge) + "</span>" +
            '<span class="mmeta">' + esc(v.shelf) + "</span>" +
            '<span class="mmeta">' + esc(fmtDur(v.duration)) +
              (v.medium === "article" ? " read" : "") + "</span>" +
          "</span>" +
          '<span class="dtitle">' + esc(v.title) + "</span>" +
          '<span class="dchan">' + esc(v.channel || "") + "</span>" +
          (v.why ? '<span class="dwhy">' + esc(v.why) + "</span>" : "") +
        "</span>" +
      "</button>";
    }).join("");
    $("#today-cards").innerHTML = html;

    var done = picks.filter(function (v) { return v.watched; }).length;
    $("#today-fin").innerHTML =
      '<div class="fin">' +
        '<div class="fin-orn">❦</div>' +
        '<div class="fin-rule"></div>' +
        '<div class="fin-text">' +
          (done >= picks.length && picks.length
            ? "All three finished. Close the app — the shelf restocks at midnight."
            : "That’s the whole shelf for today.<br>No more after these. It restocks at midnight.") +
        "</div>" +
      "</div>";
  }

  /* ------------------------------------------------------------------ */
  /* Browse                                                               */
  /* ------------------------------------------------------------------ */
  function matchesAxes(v, skip) {
    if (skip !== "charge" && UI.charge && v.charge !== UI.charge) return false;
    if (skip !== "weight" && UI.weight && v.weight !== UI.weight) return false;
    if (skip !== "medium" && UI.medium && v.medium !== UI.medium) return false;
    return true;
  }

  function renderBrowse() {
    var all = items();
    $("#browse-sub").textContent = all.length + " items, chosen by hand. Nothing endless here.";

    /* charge selector: the featured axis */
    $("#charge-grid").innerHTML = Object.keys(CHARGES).map(function (c) {
      var n = all.filter(function (v) { return v.charge === c && matchesAxes(v, "charge"); }).length;
      var on = UI.charge === c;
      return '<button class="charge-btn' + (on ? " on-" + c : "") + '" data-action="filter-charge" data-value="' + c + '">' +
        '<span class="cname"><span class="cdot cdot-' + c + '"></span>' + CHARGES[c].name + "</span>" +
        '<span class="chint">' + CHARGES[c].hint + "</span>" +
        '<span class="ccount">' + n + "</span>" +
      "</button>";
    }).join("");

    $("#weight-grid").innerHTML = Object.keys(WEIGHTS).map(function (w) {
      var on = UI.weight === w;
      return '<button class="fchip' + (on ? " on" : "") + '" data-action="filter-weight" data-value="' + w + '">' +
        '<span class="fname">' + WEIGHTS[w].name + "</span>" +
        '<span class="fhint">' + WEIGHTS[w].hint + "</span>" +
      "</button>";
    }).join("");

    $("#medium-grid").innerHTML = Object.keys(MEDIUMS).map(function (m) {
      var on = (UI.medium || "") === m;
      return '<button class="fchip' + (on ? " on" : "") + '" data-action="filter-medium" data-value="' + m + '">' +
        '<span class="fname">' + MEDIUMS[m].name + "</span>" +
        '<span class="fhint">' + MEDIUMS[m].hint + "</span>" +
      "</button>";
    }).join("");

    var filtered = all.filter(function (v) { return matchesAxes(v); });
    var total = filtered.reduce(function (s, v) { return s + (v.duration || 0); }, 0);
    var parts = [];
    if (UI.charge) parts.push(CHARGES[UI.charge].name.toLowerCase());
    if (UI.weight) parts.push(WEIGHTS[UI.weight].name.toLowerCase());
    if (UI.medium) parts.push(UI.medium + (UI.medium === "article" ? "s" : "s"));
    $("#result-count").textContent = filtered.length + " item" + (filtered.length === 1 ? "" : "s") +
      " · " + fmtTotal(total) + (parts.length ? " · " + parts.join(", ") : "");
    $("#clear-filters").hidden = !(UI.charge || UI.weight || UI.medium);

    if (!filtered.length) {
      $("#browse-results").innerHTML =
        '<div class="noresult">Nothing on the shelves hits that way.<br>Loosen a filter.</div>';
      return;
    }

    var html = "";
    SHELF_ORDER.forEach(function (shelf) {
      var group = filtered.filter(function (v) { return (v.shelf || "unsorted") === shelf; });
      if (!group.length) return;
      var open = !!UI.openShelves[shelf];
      var shown = open ? group : group.slice(0, SHELF_CAP);
      html += '<div class="shelf" data-shelf="' + esc(shelf) + '">' +
        '<div class="shelf-head">' +
          '<span class="shelf-name">' + esc(shelf) + "</span>" +
          '<span class="shelf-count">' + group.length + "</span>" +
          '<span class="shelf-rule"></span>' +
        "</div>" +
        shown.map(rowHtml).join("") +
        (group.length > SHELF_CAP
          ? '<button class="morebtn" data-action="shelf-more" data-shelf="' + esc(shelf) + '">' +
              (open ? "Show fewer" : "All " + group.length + " on this shelf") +
            "</button>"
          : "") +
      "</div>";
    });
    $("#browse-results").innerHTML = html;

    /* soundtrack follows the shelf in view, when the engine is spliced in */
    if (window.Sound && typeof window.Sound.observe === "function") {
      try { window.Sound.observe(document.getElementById("screen-browse")); } catch (e) {}
    }
  }

  function rowHtml(v) {
    return '<button class="row' + (v.watched ? " finished" : "") + '" data-action="open" data-id="' + esc(v.id) + '">' +
      thumbHtml(v, "rthumb") +
      '<span class="rbody">' +
        '<span class="rtitle clamp2">' + esc(v.title) + "</span>" +
        '<span class="rmeta">' +
          '<span class="pill pill-' + esc(v.charge) + '">' + esc(v.charge) + "</span>" +
          '<span class="rsub">' + esc(fmtDurShort(v.duration)) +
            (v.medium === "article" ? " read" : "") + "</span>" +
          '<span class="rsub">' + esc(v.channel || "") + "</span>" +
        "</span>" +
      "</span>" +
    "</button>";
  }

  /* ------------------------------------------------------------------ */
  /* Journal / progress                                                   */
  /* ------------------------------------------------------------------ */
  function renderJournal() {
    var all = items();
    var watched = all.filter(function (v) { return v.watched; });
    var pages = all.filter(hasJournal);
    var minutes = Math.round(watched.reduce(function (s, v) { return s + (v.duration || 0); }, 0) / 60);

    var html =
      '<div class="stat-grid">' +
        '<div class="stat"><div class="stat-n">' + watched.length + '</div><div class="stat-l">Finished</div></div>' +
        '<div class="stat"><div class="stat-n">' + pages.length + '</div><div class="stat-l">Pages written</div></div>' +
        '<div class="stat"><div class="stat-n">' + minutes + '</div><div class="stat-l">Minutes taken in</div></div>' +
      "</div>";

    /* last two weeks, honestly: a filled square is a day something got finished */
    var hits = {};
    watched.forEach(function (v) {
      if (v.watched_at) hits[String(v.watched_at).slice(0, 10)] = true;
    });
    var strip = "", today = new Date();
    for (var i = 13; i >= 0; i--) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
                String(d.getDate()).padStart(2, "0");
      strip += '<span class="day' + (hits[key] ? " hit" : "") + (i === 0 ? " today" : "") + '"></span>';
    }
    html += '<div class="axis-label">The last two weeks</div>' +
            '<div class="daystrip">' + strip + "</div>" +
            '<div class="honesty">A filled square is a day something actually got finished. No grace given.</div>';

    /* the check engine's read on you, when it is spliced in */
    if (window.Quiz && typeof window.Quiz.stats === "function") {
      try {
        var st = window.Quiz.stats();
        if (st && st.watched > 0) {
          html += '<div class="quizline">' + st.answered + " answers across " + st.watched +
            " check" + (st.watched === 1 ? "" : "s") +
            (st.weakestFrame ? " · you skip <b>" + esc(st.weakestFrame) + "</b> the most" : "") +
            (st.habitsAccepted ? " · " + st.habitsAccepted + " habit" +
              (st.habitsAccepted === 1 ? "" : "s") + " taken" : "") +
            "</div>";
        }
      } catch (e) {}
    }

    var unwritten = watched.filter(function (v) { return !hasJournal(v); }).length;
    if (unwritten > 0) {
      html += '<div class="nudge">' + unwritten + " finished without a page. The page is the point.</div>";
    }

    if (!watched.length && !pages.length) {
      html += '<div class="j-empty">' +
        '<div class="fin-orn">❦</div>' +
        '<div class="fin-text">Nothing in the record yet.<br>Finish one of today’s three and leave a page behind.</div>' +
      "</div>";
      $("#journal-body").innerHTML = html;
      return;
    }

    if (pages.length) {
      html += '<div class="axis-label brass" style="margin-top:28px">Pages</div>';
      var sorted = pages.slice().sort(function (a, b) {
        return String(b.updated || b.watched_at || "").localeCompare(String(a.updated || a.watched_at || ""));
      });
      var shown = UI.journalAll ? sorted : sorted.slice(0, PAGE_CAP);
      html += shown.map(function (v) {
        var j = v.journal || {};
        var snip = (j.learned || j.matters || j.use || "").trim().slice(0, 110);
        return '<button class="pagecard" data-action="open" data-id="' + esc(v.id) + '">' +
          '<span class="pg-title">' + esc(v.title) + "</span>" +
          (snip ? '<span class="pg-snip">“' + esc(snip) + '”</span>' : "") +
          '<span class="pg-meta">' + esc(v.shelf) + " · " + esc(v.charge) +
            (v.watched_at ? " · finished " + esc(fmtDate(v.watched_at)) : "") + "</span>" +
        "</button>";
      }).join("");
      if (sorted.length > PAGE_CAP) {
        html += '<button class="morebtn" data-action="journal-all">' +
          (UI.journalAll ? "Show fewer" : "All " + sorted.length + " pages") + "</button>";
      }
    }

    $("#journal-body").innerHTML = html;
  }

  /* ------------------------------------------------------------------ */
  /* Paper: full-screen reading / watching view                           */
  /* ------------------------------------------------------------------ */
  function openPaper(id) {
    var v = byId(id);
    if (!v) return;
    UI.paperId = id;

    $("#paper-kind").textContent =
      (v.medium === "article" ? "Article" : "Video") + " · " + fmtDur(v.duration) +
      " · " + (v.shelf || "");

    var html = "";
    if (v.medium === "video" && v.id) {
      html += '<div class="stage"><iframe src="https://www.youtube-nocookie.com/embed/' +
        encodeURIComponent(v.id) + '?rel=0&modestbranding=1&playsinline=1" ' +
        'title="' + esc(v.title) + '" ' +
        'allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
    } else {
      if (v.thumb) html += thumbHtml(v, "arthero", false);
      html += '<a class="open-art" href="' + esc(v.url) + '" target="_blank" rel="noopener">Open the article ↗</a>';
    }

    html += '<div class="nb-title">' + esc(v.title) + "</div>";
    var meta = [];
    if (v.channel) meta.push(esc(v.channel));
    var vw = fmtViews(v.views);
    if (vw) meta.push(esc(vw));
    if (meta.length) html += '<div class="nb-meta">' + meta.join(" · ") + "</div>";
    html += '<div class="nb-tags">' +
      '<span class="pill pill-' + esc(v.charge) + '">' + esc(v.charge) + "</span>" +
      '<span class="nb-tag">' + esc(v.shelf || "") + "</span>" +
      '<span class="nb-tag">' + esc(v.weight || "") + "</span>" +
    "</div>";
    if (v.why) html += '<div class="nb-why">' + esc(v.why) + "</div>";

    html += '<button class="finish' + (v.watched ? " done" : "") + '" data-action="finish">' +
      finishLabel(v) + "</button>";

    html += quizHtml(v);

    /* the page: one sheet of ruled paper, headings pre-printed */
    var j = v.journal || {};
    html += '<div class="nb-label">The page</div>' +
      '<div class="sheet">' +
        '<h2 class="sheet-h">What I learned</h2>' +
        '<div class="sheet-line" contenteditable="true" data-field="learned" ' +
          'data-ph="Write it in your own words.">' + toHtml(j.learned || "") + "</div>" +
        '<h2 class="sheet-h">Why it matters</h2>' +
        '<div class="sheet-line" contenteditable="true" data-field="matters" ' +
          'data-ph="Tie it to something you are building.">' + toHtml(j.matters || "") + "</div>" +
        '<h2 class="sheet-h">How I’ll use it</h2>' +
        '<div class="sheet-line" contenteditable="true" data-field="use" ' +
          'data-ph="One concrete action, with a date.">' + toHtml(j.use || "") + "</div>" +
      "</div>";

    $("#paper-body").innerHTML = html;
    $("#paper-scroll").scrollTop = 0;
    $("#paper").classList.add("open");
  }

  function finishLabel(v) {
    if (!v.watched) return v.medium === "article" ? "Mark it read" : "Mark it finished";
    return "✓ Finished" + (v.watched_at ? " · " + esc(fmtDate(v.watched_at)) : "");
  }

  function quizHtml(v) {
    if (!window.Quiz || typeof window.Quiz.forItem !== "function") return "";
    var q, state;
    try {
      q = window.Quiz.forItem(v.id);
      state = window.Quiz.get(v.id);
    } catch (e) { return ""; }
    if (!q) return "";

    var html = '<div class="nb-label">The check</div>';
    html += '<div class="habit">' +
      '<div class="q-frame">A habit to walk out with</div>' +
      '<div class="habit-title">' + esc(q.habit.title) + "</div>" +
      '<div class="habit-line">' + esc(q.habit.trigger) + " <span class=\"arrow\">→</span> " +
        esc(q.habit.action) + "</div>" +
      '<div class="habit-days">for ' + esc(String(q.habit.days)) + " days</div>" +
      '<div class="habit-why">' + esc(q.habit.why) + "</div>" +
      '<div id="habit-foot">' + habitFootHtml(state) + "</div>" +
    "</div>";

    var answers = (state && state.answers) || {};
    html += q.questions.map(function (question) {
      return '<div class="q-block">' +
        '<div class="q-frame"><span class="qn">' + question.n + "</span>" + esc(question.frame) + "</div>" +
        '<div class="q-text">' + esc(question.text) + "</div>" +
        '<div class="ruled" contenteditable="true" data-quiz-n="' + question.n + '" ' +
          'data-ph="Think on the page.">' + toHtml(answers[question.n] || "") + "</div>" +
      "</div>";
    }).join("");
    html += '<div class="q-progress" id="quiz-progress">' + quizProgressText(state) + "</div>";
    return html;
  }

  function habitFootHtml(state) {
    if (state && state.habitAccepted === true) {
      return '<span class="habit-mark">✓ Taken</span>';
    }
    if (state && state.habitAccepted === false) {
      return '<div class="habit-btns">' +
        '<button class="hbtn take" data-action="habit-take">Take it after all</button>' +
      "</div>";
    }
    return '<div class="habit-btns">' +
      '<button class="hbtn take" data-action="habit-take">Take it</button>' +
      '<button class="hbtn" data-action="habit-skip">Not this one</button>' +
    "</div>";
  }

  function quizProgressText(state) {
    var n = (state && state.answered) || 0;
    if (n === 0) return "Five questions. The ones you skip are the signal.";
    if (n >= 5) return "All five answered.";
    return n + " of 5 answered.";
  }

  function refreshQuizChrome() {
    if (!window.Quiz || !UI.paperId) return;
    var state;
    try { state = window.Quiz.get(UI.paperId); } catch (e) { return; }
    var foot = $("#habit-foot");
    if (foot) foot.innerHTML = habitFootHtml(state);
    var prog = $("#quiz-progress");
    if (prog) prog.textContent = quizProgressText(state);
  }

  function closePaper() {
    if (saveTimer) flushJournal();          /* never lose ink on the way out */
    UI.paperId = null;
    var p = $("#paper");
    p.classList.remove("open");
    setTimeout(function () {
      if (!p.classList.contains("open")) $("#paper-body").innerHTML = "";
    }, 350);                                 /* clearing kills the embed audio */
    renderToday();
    renderJournal();
    if (UI.tab === "browse") renderBrowse();
  }

  /* ------------------------------------------------------------------ */
  /* soundtrack toggle, only when the engine is spliced in                */
  /* ------------------------------------------------------------------ */
  function soundHook() {
    if (!window.Sound) return;
    var slot = $("#sound-slot");
    if (!slot) return;
    slot.innerHTML = '<button class="sound-btn" data-action="sound-toggle" aria-label="Ambient sound">' +
      '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>';
    function paint() {
      var b = $(".sound-btn");
      if (b) b.classList.toggle("on", !!(window.Sound.state && window.Sound.state.playing));
    }
    if (typeof window.Sound.onChange === "function") window.Sound.onChange(paint);
    paint();
  }

  /* ------------------------------------------------------------------ */
  /* events: one delegated handler                                        */
  /* ------------------------------------------------------------------ */
  function showTab(tab) {
    UI.tab = tab;
    ["today", "browse", "journal"].forEach(function (t) {
      var scr = $("#screen-" + t);
      if (scr) scr.classList.toggle("on", t === tab);
    });
    document.querySelectorAll("#tabbar .tab").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-tab") === tab);
    });
    if (tab === "journal") renderJournal();  /* stats stay honest */
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el) return;
    var action = el.getAttribute("data-action");

    if (action === "tab") { showTab(el.getAttribute("data-tab")); return; }
    if (action === "open") { openPaper(el.getAttribute("data-id")); return; }
    if (action === "close-paper") { closePaper(); return; }

    if (action === "finish") {
      var v = byId(UI.paperId);
      if (!v) return;
      v.watched = !v.watched;
      v.watched_at = v.watched ? new Date().toISOString().slice(0, 19) : null;
      el.classList.toggle("done", v.watched);
      el.innerHTML = finishLabel(v);
      postEntry(v.id, { watched: v.watched }).then(function (ok) {
        if (ok) {
          var fresh = byId(UI.paperId);
          if (fresh && el.isConnected) {
            el.classList.toggle("done", fresh.watched);
            el.innerHTML = finishLabel(fresh);
          }
          showSaved();
        }
      });
      return;
    }

    if (action === "filter-charge") {
      var c = el.getAttribute("data-value");
      UI.charge = UI.charge === c ? null : c;
      renderBrowse();
      return;
    }
    if (action === "filter-weight") {
      var w = el.getAttribute("data-value");
      UI.weight = UI.weight === w ? null : w;
      renderBrowse();
      return;
    }
    if (action === "filter-medium") {
      UI.medium = el.getAttribute("data-value") || null;
      renderBrowse();
      return;
    }
    if (action === "clear-filters") {
      UI.charge = UI.weight = UI.medium = null;
      renderBrowse();
      return;
    }
    if (action === "shelf-more") {
      var shelf = el.getAttribute("data-shelf");
      UI.openShelves[shelf] = !UI.openShelves[shelf];
      renderBrowse();
      return;
    }
    if (action === "journal-all") {
      UI.journalAll = !UI.journalAll;
      renderJournal();
      return;
    }

    if (action === "habit-take" && window.Quiz && UI.paperId) {
      try { window.Quiz.acceptHabit(UI.paperId); } catch (err) {}
      refreshQuizChrome();
      return;
    }
    if (action === "habit-skip" && window.Quiz && UI.paperId) {
      try { window.Quiz.skipHabit(UI.paperId); } catch (err) {}
      refreshQuizChrome();
      return;
    }

    if (action === "sound-toggle" && window.Sound) {
      try {
        if (window.Sound.state && window.Sound.state.playing) window.Sound.stop();
        else window.Sound.arm();
      } catch (err) {}
      return;
    }
  });

  /* writing surfaces */
  var quizTimers = {};
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest(".sheet-line")) { queueJournal(); return; }
    var q = t.closest("[data-quiz-n]");
    if (q && window.Quiz && UI.paperId) {
      var n = q.getAttribute("data-quiz-n");
      var id = UI.paperId;
      clearTimeout(quizTimers[n]);
      quizTimers[n] = setTimeout(function () {
        try { window.Quiz.answer(id, n, q.innerText.trim()); } catch (err) {}
        refreshQuizChrome();
      }, 500);
    }
  });

  /* paste as plain text so the sheet never inherits foreign markup */
  document.addEventListener("paste", function (e) {
    var t = e.target && e.target.closest ? e.target.closest("[contenteditable]") : null;
    if (!t) return;
    e.preventDefault();
    var txt = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, txt);
  });

  /* ------------------------------------------------------------------ */
  /* boot                                                                 */
  /* ------------------------------------------------------------------ */
  function init() {
    renderToday();
    renderBrowse();
    renderJournal();
    soundHook();
    if (window.Quiz && typeof window.Quiz.onChange === "function") {
      window.Quiz.onChange(function () {
        if (UI.tab === "journal" && !UI.paperId) renderJournal();
      });
    }
  }

  function boot() {
    fetch("/api/library")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        window.ITEMS = (d && d.videos) || [];
        init();
      })
      .catch(function () {
        /* offline: run on whatever the splice layer left behind */
        if (window.ITEMS && window.ITEMS.length) { init(); return; }
        $("#today-cards").innerHTML =
          '<div class="offline">The library is closed — no server and no cached shelf.<br>' +
          "Start it with <b>python3 server.py</b> and reopen.</div>";
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  /* offline shell, when a worker exists to install one */
  if ("serviceWorker" in navigator) {
    fetch("sw.js", { method: "HEAD" })
      .then(function (r) {
        if (r.ok) navigator.serviceWorker.register("sw.js").catch(function () {});
      })
      .catch(function () {});
  }
})();
</script>
</body>
</html>

    <!-- Only appears once something is hearted. An empty "Saved" filter is a
         permanent reminder of a list you have not started. -->
    <div class="axis-label" id="saved-label" hidden>Yours</div>
    <div class="chip-grid" id="saved-grid"></div>
    <div class="resultline">
      <span class="rcount" id="result-count"></span>
      <button class="clearbtn" id="clear-filters" data-action="clear-filters" hidden>Clear filters</button>
    </div>
    <div id="browse-results"></div>
  </div>
</section>

<section class="screen" id="screen-journal" aria-label="Journal">
  <div class="wrap">
    <div class="kicker">The Library</div>
    <h1 class="h1">The record</h1>
    <div class="sub">What you finished, and what you left on the page.</div>
    <div id="journal-body"></div>
  </div>
</section>

<nav id="tabbar" aria-label="Sections">
  <button class="tab on" data-action="tab" data-tab="today" aria-label="Today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16H6.5A2.5 2.5 0 0 0 4 21z"/>
      <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5a2.5 2.5 0 0 1 2.5 2z"/>
    </svg>
    <span>Today</span>
  </button>
  <button class="tab" data-action="tab" data-tab="browse" aria-label="Browse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 4v16M9 4v16M14 4v16"/><path d="M17.5 5l3.2 14.6"/><path d="M3 20.5h18"/>
    </svg>
    <span>Browse</span>
  </button>
  <button class="tab" data-action="tab" data-tab="journal" aria-label="Journal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M16.5 3.5l4 4L8.5 19.5 3 21l1.5-5.5z"/><path d="M14 6l4 4"/>
    </svg>
    <span>Journal</span>
  </button>
</nav>

<div id="paper" role="dialog" aria-modal="true" aria-label="Reading view">
  <div id="paper-scroll">
    <div class="paperbar">
      <span class="paper-label" id="paper-kind"></span>
      <span id="save-ind">Saved.</span>
      <button class="close-btn" data-action="close-paper">Done</button>
      <div id="paper-prog"></div>
    </div>
    <div class="notebook" id="paper-body"></div>
  </div>
</div>

<!-- Peek sheet: watch first, commit second. Tapping a card raises this instead
     of dropping straight into the full reading view, so glancing at something
     costs nothing. The iframe is built on open and destroyed on close — leaving
     it in the DOM keeps the audio playing behind a dismissed sheet. -->
<div id="peek" role="dialog" aria-modal="true" aria-label="Preview" aria-hidden="true">
  <div id="peek-scrim" data-action="close-peek"></div>
  <div id="peek-sheet">
    <button id="peek-grab" data-action="close-peek" aria-label="Dismiss"></button>
    <div id="peek-stage"></div>
    <div id="peek-body"></div>
  </div>
</div>

<!-- Soundtrack picker. The desktop view has had one since day one; the phone
     only ever had an on/off speaker, so there was literally no way to change
     the music on the device the app is actually used on. -->
<div id="sound" role="dialog" aria-modal="true" aria-label="Soundtrack" aria-hidden="true">
  <div id="sound-scrim" data-action="sound-close"></div>
  <div class="sound-sheet glassy" id="sound-sheet">
    <button id="sound-grab" data-action="sound-close" aria-label="Dismiss"></button>
    <div id="sound-body"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ */
  /* state                                                                */
  /* ------------------------------------------------------------------ */
  var UI = {
    tab: "today",
    charge: null, weight: null, medium: null,
    savedOnly: false,
    openShelves: {},
    paperId: null,
    journalAll: false,
    waitingAll: false
  };

  var SHELF_ORDER = ["mind", "momentum", "philosophy", "craft", "culture", "world", "money", "unsorted"];
  var SHELF_CAP = 4;
  var PAGE_CAP = 8;

  var CHARGES = {
    calm:     { name: "Calm",     hint: "settle the mind" },
    confront: { name: "Confront", hint: "face something" },
    fuel:     { name: "Fuel",     hint: "get moving" }
  };
  var WEIGHTS = {
    quick:    { name: "Quick",    hint: "under 15m" },
    standard: { name: "Standard", hint: "15–40m" },
    deep:     { name: "Deep",     hint: "40m and up" }
  };
  var MEDIUMS = {
    "":        { name: "Everything", hint: "both kinds" },
    "video":   { name: "Video",      hint: "watch" },
    "article": { name: "Article",    hint: "read" }
  };

  /* ------------------------------------------------------------------ */
  /* helpers                                                              */
  /* ------------------------------------------------------------------ */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function items() { return window.ITEMS || []; }
  function byId(id) {
    var a = items();
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function toHtml(s) { return esc(s).replace(/\n/g, "<br>"); }

  function fmtDur(sec) {
    sec = sec || 0;
    var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    if (h > 0) return h + "h" + (m ? " " + m + "m" : "");
    return Math.max(1, m) + " min";
  }
  function fmtDurShort(sec) {
    sec = sec || 0;
    var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    if (h > 0) return h + "h " + (m ? m + "m" : "");
    return Math.max(1, m) + "m";
  }
  function fmtTotal(sec) {
    var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    if (h > 0) return h + "h " + m + "m";
    return m + "m";
  }
  function fmtViews(n) {
    if (!n) return "";
    if (n >= 1e6) return (Math.round(n / 1e5) / 10) + "M views";
    if (n >= 1e3) return Math.round(n / 1e3) + "K views";
    return n + " views";
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function hasJournal(v) {
    var j = v.journal || {};
    return !!((j.learned || "").trim() || (j.matters || "").trim() || (j.use || "").trim());
  }

  function thumbHtml(v, cls, glyphOnly) {
    var glyph = v.medium === "article" ? "¶" : "▸";
    var inner = "";
    var box = "thumbbox " + (cls || "");
    if (v.thumb && !glyphOnly) {
      inner = '<img src="' + esc(v.thumb) + '" alt="" loading="lazy" ' +
              'onerror="this.parentNode.classList.add(\'noimg\')">';
    } else {
      box += " nothumb";
    }
    var badge = v.medium === "article"
      ? '<span class="badge">' + esc(fmtDurShort(v.duration)) + " read</span>"
      : '<span class="badge">' + esc(fmtDurShort(v.duration)) + "</span>";
    var check = v.watched ? '<span class="check">✓</span>' : "";
    /* The heart rides on the thumbnail, so every card type that already calls
       thumbHtml -- the daily three, the rails, the list rows, the peek stage --
       gets it without any of them knowing it exists.

       A <span> and not a <button>: these thumbs sit inside <button class="dcard">
       and a nested button is invalid markup that Safari resolves by dropping
       one of them. role/tabindex give it the semantics anyway. */
    var on = window.Saved && window.Saved.has(v.id);
    var heart = '<span class="heart' + (on ? " on" : "") + '" data-action="save" ' +
      'data-id="' + esc(v.id) + '" role="button" tabindex="0" ' +
      'aria-pressed="' + (on ? "true" : "false") + '" ' +
      'aria-label="' + (on ? "Saved. Tap to unsave" : "Save for later") + '">' +
      '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">' +
      '<path d="M12 20.5 4.2 13a4.6 4.6 0 1 1 6.5-6.5l1.3 1.3 1.3-1.3A4.6 4.6 0 1 1 19.8 13z"/>' +
      "</svg></span>";
    return '<span class="' + box + '">' + inner +
           '<span class="tglyph">' + glyph + "</span>" + badge + check + heart + "</span>";
  }

  /* ------------------------------------------------------------------ */
  /* daily picks: deterministic per calendar day. No reroll anywhere.     */
  /* ------------------------------------------------------------------ */
  function fnv(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  /* How many times he has asked for a different three today. Kept per-day so
     the count resets at midnight rather than drifting forever, and persisted so
     a reroll survives closing the app -- otherwise every relaunch would yank
     back the three he just rejected. */
  var RKEY = "library.reroll.v1";
  function rerollN() {
    try {
      var r = JSON.parse(localStorage.getItem(RKEY) || "null");
      if (r && r.date === todayKey()) return r.n | 0;
    } catch (e) {}
    return 0;
  }
  function bumpReroll() {
    var n = rerollN() + 1;
    try { localStorage.setItem(RKEY, JSON.stringify({ date: todayKey(), n: n })); }
    catch (e) {}
    return n;
  }
  /* The seed for today's picks. Rerolling changes the seed, which is the only
     thing the picker reads -- so a reroll is a real reshuffle of the whole
     catalog, not a shift by one. */
  function pickSeed() {
    var n = rerollN();
    return todayKey() + (n ? "#" + n : "");
  }

  function dailyPicks() {
    var all = items();
    /* Picks baked in by the splice layer, but only on the day they were baked
       and only before the first reroll. A static build gets opened for weeks
       off one deploy; honouring a stale DAILY is what pinned the home screen to
       the same three videos out of nearly two hundred. */
    if (window.DAILY && window.DAILY.length &&
        window.DAILY_DATE === todayKey() && !rerollN()) {
      var out = [];
      for (var i = 0; i < window.DAILY.length; i++) {
        var d = window.DAILY[i];
        var id = typeof d === "string" ? d : (d && d.id);
        var it = byId(id);
        if (it) out.push(it);
      }
      if (out.length) return out.slice(0, 3);
    }
    /* Hash each id against today's seed, take the lowest three with distinct
       shelves and charges, relaxing if the pool is thin. */
    var key = pickSeed();
    var pool = all.filter(function (v) { return !v.watched; });
    if (!pool.length) pool = all.slice();
    var scored = pool.map(function (v) { return { v: v, s: fnv(key + "|" + v.id) }; });
    scored.sort(function (a, b) { return a.s - b.s || (a.v.id < b.v.id ? -1 : 1); });

    var picks = [], shelves = {}, charges = {};

    /* Hearted things lead. Capped at two of three on purpose: filling all
       three from saved turns the daily pick into a to-do list you already
       wrote, and nothing new ever surfaces again. Two yours, one the app's.

       Which saved items lead rotates with the date, so a long saved list
       cycles instead of showing the same two every morning until watched. */
    if (window.Saved && window.Saved.count()) {
      var mine = savedItems().filter(function (v) { return !v.watched; });
      if (mine.length) {
        var offset = fnv(key) % mine.length;
        for (var s = 0; s < mine.length && picks.length < 2; s++) {
          var cand = mine[(offset + s) % mine.length];
          if (picks.indexOf(cand) >= 0) continue;
          picks.push(cand);
          shelves[cand.shelf] = 1;
          charges[cand.charge] = 1;
        }
      }
    }
    [1, 2, 3].forEach(function (pass) {
      scored.forEach(function (e) {
        if (picks.length >= 3 || picks.indexOf(e.v) >= 0) return;
        if (pass === 1 && (shelves[e.v.shelf] || charges[e.v.charge])) return;
        if (pass === 2 && shelves[e.v.shelf]) return;
        picks.push(e.v);
        shelves[e.v.shelf] = 1;
        charges[e.v.charge] = 1;
      });
    });
    return picks;
  }

  /* ------------------------------------------------------------------ */
  /* server writes                                                        */
  /* ------------------------------------------------------------------ */
  /* Static build: no server. Persist to the device instead.
     Kept API-shaped (a promise resolving to a boolean) so callers are
     unchanged. Entries written here live only on this phone. */
  var LOCAL_KEY = "library.entries.v1";
  function localAll() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function postEntry(id, extra) {
    var all = localAll();
    var cur = all[id] || {};
    Object.keys(extra || {}).forEach(function (k) {
      if (k === "journal") {
        cur.journal = Object.assign({}, cur.journal, extra.journal);
      } else {
        cur[k] = extra[k];
      }
    });
    cur.updated = new Date().toISOString().slice(0, 19);
    all[id] = cur;
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(all)); }
    catch (e) { return Promise.resolve(false); }
    var v = byId(id);
    if (v) Object.assign(v, cur);
    return Promise.resolve(true);
  }
  /* Replay saved entries over the baked catalog on every load, or the phone
     would show blank journals for things already written on it. */
  (function () {
    var all = localAll();
    (window.ITEMS || []).forEach(function (v) {
      if (all[v.id]) Object.assign(v, all[v.id]);
    });
  })();
  /* ---- build identity ------------------------------------------------ */
  window.BUILD = "dd55426f52";
  (function () {
    if (!("serviceWorker" in navigator)) return;
    /* A new worker taking control means newer files are now being served, but
       this document is still the old one. Reload once — guarded, because
       clients.claim() on first install also fires this and a loop here would
       be worse than the staleness it fixes. */
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloaded) return;
      var sw = navigator.serviceWorker.controller;
      if (!sw) return;
      var chan = new MessageChannel();
      chan.port1.onmessage = function (ev) {
        if (ev.data && ev.data.stamp && ev.data.stamp !== window.BUILD) {
          reloaded = true;
          location.reload();
        }
      };
      try { sw.postMessage("version", [chan.port2]); } catch (e) {}
    });
    /* Ask on every launch. Without this an installed PWA can go weeks without
       checking, which is how a shipped fix stays invisible. */
    navigator.serviceWorker.ready.then(function (reg) {
      try { reg.update(); } catch (e) {}
    });
  })();


  var saveTimer = null, saveHideTimer = null;
  function queueJournal() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushJournal, 800);
  }
  function flushJournal() {
    clearTimeout(saveTimer);
    saveTimer = null;
    var id = UI.paperId;
    if (!id) return;
    var j = {};
    ["learned", "matters", "use"].forEach(function (f) {
      var el = $('.sheet-line[data-field="' + f + '"]');
      if (el) j[f] = el.innerText.replace(/\u00a0/g, " ").replace(/\n+$/, "");
    });
    var v = byId(id);
    if (v) v.journal = Object.assign({}, v.journal, j);
    postEntry(id, { journal: j }).then(function (ok) { if (ok) showSaved(); });
  }
  function showSaved() {
    var el = $("#save-ind");
    if (!el) return;
    el.style.opacity = "1";
    clearTimeout(saveHideTimer);
    saveHideTimer = setTimeout(function () { el.style.opacity = "0"; }, 1600);
  }

  /* ------------------------------------------------------------------ */
  /* Today                                                                */
  /* ------------------------------------------------------------------ */
  function renderToday() {
    var h = new Date().getHours();
    $("#today-greeting").textContent =
      h < 12 ? "This morning’s three" : h < 18 ? "Today’s three" : "Tonight’s three";
    $("#today-date").textContent = new Date().toLocaleDateString(undefined,
      { weekday: "long", month: "long", day: "numeric" });

    var picks = dailyPicks();
    var html = picks.map(function (v) {
      return '' +
      '<button class="dcard' + (v.watched ? " finished" : "") + '" data-action="peek" data-id="' + esc(v.id) + '">' +
        '<span class="cbar cbar-' + esc(v.charge) + '"></span>' +
        thumbHtml(v, "dthumb") +
        '<span class="dbody">' +
          '<span class="metarow">' +
            '<span class="pill pill-' + esc(v.charge) + '">' + esc(v.charge) + "</span>" +
            '<span class="mmeta">' + esc(v.shelf) + "</span>" +
            '<span class="mmeta">' + esc(fmtDur(v.duration)) +
              (v.medium === "article" ? " read" : "") + "</span>" +
          "</span>" +
          '<span class="dtitle">' + esc(v.title) + "</span>" +
          '<span class="dchan">' + esc(v.channel || "") + "</span>" +
          (v.why ? '<span class="dwhy">' + esc(v.why) + "</span>" : "") +
        "</span>" +
      "</button>";
    }).join("");

    /* "Not these" rather than a refresh glyph. A refresh icon promises a feed
       and invites tapping it until something shiny appears; naming the act as a
       rejection keeps the cost visible. The count is shown for the same reason
       -- five rerolls in one morning is information he should have. */
    var rn = rerollN();
    html += '<button class="reroll" data-action="reroll">' +
      '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M20 11A8 8 0 0 0 6.3 5.7L4 8"/><path d="M4 4v4h4"/>' +
      '<path d="M4 13a8 8 0 0 0 13.7 5.3L20 16"/><path d="M20 20v-4h-4"/></svg>' +
      "<span>Not these — show me three more</span>" +
      (rn ? '<span class="reroll-n">' + rn + "</span>" : "") +
      "</button>";

    $("#today-cards").innerHTML = html;

    renderTodayDepth(picks);

    var done = picks.filter(function (v) { return v.watched; }).length;
    $("#today-fin").innerHTML =
      '<div class="fin">' +
        '<div class="fin-orn">❦</div>' +
        '<div class="fin-rule"></div>' +
        '<div class="fin-text">' +
          (done >= picks.length && picks.length
            ? "All three finished. Close the app — the shelf restocks at midnight."
            : "That’s the shelf for today.<br>Three at a time, on purpose. It restocks at midnight.") +
        "</div>" +
        /* Which build this is. Set only by deploy_phone.py, so it is absent on
           the served app and present on the phone -- which is the one place the
           question "did the fix actually reach me" was unanswerable. */
        (window.BUILD ? '<div class="fin-build">build ' + esc(window.BUILD) + "</div>" : "") +
      "</div>";
  }

  /* ---- Today, below the three ---------------------------------------- */
  /* Depth, not endlessness. Each section is capped and terminates; none of
     them loads more on scroll. An infinite home screen would rebuild exactly
     the habit this app exists to replace. */

  function sect(title, count, note, inner) {
    return '<div class="sect"><div class="sect-head"><h2 class="sect-h">' + esc(title) +
      "</h2>" + (count != null ? '<span class="sect-n">' + count + "</span>" : "") +
      "</div>" + (note ? '<p class="sect-note">' + esc(note) + "</p>" : "") + inner + "</div>";
  }

  function qcardHtml(v) {
    return '<button class="qcard" data-action="peek" data-id="' + esc(v.id) + '">' +
      thumbHtml(v, "qthumb") +
      '<span class="qbody"><span class="qtitle">' + esc(v.title) + "</span>" +
      '<span class="qmeta"><span class="pill pill-' + esc(v.charge) + '">' +
      esc(v.charge) + "</span>" +
      '<span class="rsub">' + esc(fmtDurShort(v.duration)) + "</span></span></span></button>";
  }

  /* Anything opened but not finished. This is the highest-intent thing on the
     screen: he already chose it once. */
  function renderContinue() {
    var open = items().filter(function (v) {
      return !v.watched && (v.progress > 0 || hasJournal(v));
    }).slice(0, 3);
    $("#today-continue").innerHTML = open.length
      ? sect("Still open", open.length, null,
             open.map(function (v) { return rowHtml(v, "open"); }).join(""))
      : "";
  }

  function hasJournal(v) {
    var j = v.journal || {};
    return !!((j.learned || "").trim() || (j.matters || "").trim() || (j.use || "").trim());
  }

  /* Everything hearted, save order, newest first. Finished items stay in the
     list rather than vanishing -- a save is a deliberate act, and having it
     disappear the moment you watch it reads as the app losing your work. */
  function savedItems() {
    if (!window.Saved) return [];
    var out = [];
    window.Saved.list().forEach(function (id) {
      var v = byId(id);
      if (v) out.push(v);
    });
    return out;
  }

  function renderSaved() {
    var slot = $("#today-saved");
    if (!slot) return;
    var all = savedItems();
    if (!all.length) { slot.innerHTML = ""; return; }
    var shown = all.slice(0, 8);
    var note = all.some(function (v) { return !v.watched; })
      ? "Yours. These lead tomorrow’s three."
      : "Yours. All finished — the heart stays until you take it off.";
    slot.innerHTML = sect("Saved", all.length, note,
      '<div class="rail">' + shown.map(qcardHtml).join("") + "</div>" +
      (all.length > shown.length
        ? '<p class="sect-note" style="margin-top:10px">' +
          (all.length - shown.length) + " more saved.</p>"
        : ""));
    if (window.Feel && typeof window.Feel.scan === "function") window.Feel.scan();
  }

  /* "I have ten minutes." Quick, unwatched, deterministic for the day so the
     row does not reshuffle every time he opens the app. */
  function renderQuick() {
    var pickIds = dailyPicks().map(function (v) { return v.id; });
    var quick = items().filter(function (v) {
      return v.weight === "quick" && !v.watched && pickIds.indexOf(v.id) < 0;
    });
    quick = seededOrder(quick, "quick").slice(0, 8);
    $("#today-quick").innerHTML = quick.length
      ? sect("Ten minutes", null, "When that is honestly all you have.",
             '<div class="rail">' + quick.map(qcardHtml).join("") + "</div>")
      : "";
  }

  /* One shelf a day, in rotation. Gives the catalog a way to surface without
     turning into a recommendation engine. */
  function renderShelfOfDay() {
    var shelves = ["mind", "momentum", "philosophy", "craft", "culture", "world", "money"];
    var day = Math.floor(Date.parse(todayKey() + "T00:00:00") / 86400000);
    var shelf = shelves[((day % shelves.length) + shelves.length) % shelves.length];
    var pool = items().filter(function (v) { return v.shelf === shelf && !v.watched; });
    var few = seededOrder(pool, "shelf").slice(0, 4);
    $("#today-shelf").innerHTML = few.length
      ? '<div data-shelf="' + esc(shelf) + '">' +
        sect("Tonight’s shelf · " + shelf, pool.length, null,
             few.map(rowHtml).join("")) + "</div>"
      : "";
  }

  /* His own words, quoted back. Nothing else on this screen earns a return
     visit the way this does. */
  function renderLastPage() {
    var written = items().filter(hasJournal).sort(function (a, b) {
      return String(b.updated || "").localeCompare(String(a.updated || ""));
    });
    if (!written.length) { $("#today-page").innerHTML = ""; return; }
    var v = written[0], j = v.journal || {};
    var line = (j.use || j.matters || j.learned || "").trim();
    if (line.length > 190) line = line.slice(0, 190).replace(/\s+\S*$/, "") + "…";
    $("#today-page").innerHTML = sect("You wrote", null, null,
      '<button class="pagecard" data-action="open" data-id="' + esc(v.id) + '" ' +
      'style="display:block;width:100%;text-align:left;background:transparent;' +
      'border:none;padding:0;color:inherit">' +
      '<span class="quote">' + esc(line) +
      '<span class="quote-src">on ' + esc(v.title) + "</span></span></button>");
  }

  /* Seven days, counted plainly. No streaks and no praise for a blank week. */
  function renderWeek() {
    var since = Date.now() - 7 * 86400000;
    var all = items();
    var fin = all.filter(function (v) {
      return v.watched && v.watched_at && Date.parse(v.watched_at) >= since;
    });
    var mins = Math.round(fin.reduce(function (s, v) { return s + (v.duration || 0); }, 0) / 60);
    var pages = all.filter(hasJournal).length;
    $("#today-week").innerHTML = sect("Last seven days", null, null,
      '<div class="week">' +
        '<div class="wcell"><div class="wnum">' + fin.length + '</div>' +
          '<div class="wlab">Finished</div></div>' +
        '<div class="wcell"><div class="wnum">' + mins + '</div>' +
          '<div class="wlab">Minutes</div></div>' +
        '<div class="wcell"><div class="wnum">' + pages + '</div>' +
          '<div class="wlab">Pages</div></div>' +
      "</div>");
  }

  /* Stable per-day ordering. Same seed idea as dailyPicks: the home screen
     must not reshuffle between opens, or it becomes a slot machine. */
  function seededOrder(list, salt) {
    /* pickSeed(), not todayKey(): a reroll has to move these rails too, or
       "show me different ones" changes the top three and leaves the eight
       underneath exactly where they were. */
    var key = pickSeed() + salt;
    var h = 2166136261;
    for (var i = 0; i < key.length; i++) {
      h ^= key.charCodeAt(i); h = (h * 16777619) >>> 0;
    }
    return list.map(function (v, i) {
      var x = (h ^ (i * 2654435761)) >>> 0;
      return { v: v, k: x };
    }).sort(function (a, b) { return a.k - b.k; })
      .map(function (o) { return o.v; });
  }

  /* There used to be a second todayKey() here returning
     toISOString().slice(0,10) -- UTC. Function declarations hoist, so the later
     one silently won everywhere, and the whole app rolled over to "tomorrow" at
     8pm Eastern. The local-date version above at fnv() is the only one now. */

  function renderTodayDepth(picks) {
    renderContinue();
    renderSaved();
    renderQuick();
    renderShelfOfDay();
    renderLastPage();
    renderWeek();
    /* Re-arm section following so the soundtrack tracks the new shelf block. */
    if (window.Sound && window.Sound.observe) {
      try { window.Sound.observe(document.getElementById("screen-today")); } catch (e) {}
    }
  }

  /* ---- peek sheet ----------------------------------------------------- */
  /* Watch first, commit second. The full reading view is a bigger promise
     than "is this worth my time", and that question deserves one tap. */
  function openPeek(id) {
    var v = byId(id);
    if (!v) return;
    UI.peekId = id;

    var stage = $("#peek-stage");
    stage.innerHTML = v.medium === "video" && v.id
      ? '<iframe src="https://www.youtube-nocookie.com/embed/' +
        encodeURIComponent(v.id) + '?rel=0&modestbranding=1&playsinline=1&autoplay=1" ' +
        'title="' + esc(v.title) + '" allow="autoplay; encrypted-media; ' +
        'picture-in-picture; fullscreen" allowfullscreen></iframe>'
      : (v.thumb ? '<img src="' + esc(v.thumb) + '" alt="" referrerpolicy="no-referrer">' : "");

    $("#peek-body").innerHTML =
      '<div class="peek-title">' + esc(v.title) + "</div>" +
      '<div class="peek-chan">' + esc(v.channel || "") + " · " +
        esc(fmtDur(v.duration)) + (v.medium === "article" ? " read" : "") + "</div>" +
      (v.why ? '<div class="peek-why">' + esc(v.why) + "</div>" : "") +
      '<div class="peek-acts">' +
        (v.medium === "article"
          ? '<a class="peek-btn" href="' + esc(v.url) + '" target="_blank" ' +
            'rel="noopener">Read it ↗</a>'
          : "") +
        '<button class="peek-btn primary" data-action="peek-full" data-id="' +
          esc(v.id) + '">Open the page</button>' +
      "</div>";

    $("#peek").classList.add("on");
    $("#peek").setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function closePeek() {
    var p = $("#peek");
    if (!p.classList.contains("on")) return;
    p.classList.remove("on");
    p.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    /* Destroy the iframe or the audio keeps playing behind a dismissed sheet.
       Wait for the slide-out so it does not visibly blank mid-animation. */
    setTimeout(function () {
      if (!$("#peek").classList.contains("on")) $("#peek-stage").innerHTML = "";
    }, 400);
  }

  /* ------------------------------------------------------------------ */
  /* Browse                                                               */
  /* ------------------------------------------------------------------ */
  function matchesAxes(v, skip) {
    if (skip !== "charge" && UI.charge && v.charge !== UI.charge) return false;
    if (skip !== "weight" && UI.weight && v.weight !== UI.weight) return false;
    if (skip !== "medium" && UI.medium && v.medium !== UI.medium) return false;
    /* Saved is not one of the three axes and never gets skipped for a count:
       the axis counts answer "how many more if I loosen this", and the answer
       has to stay inside whatever set he is looking at. */
    if (UI.savedOnly && !(window.Saved && window.Saved.has(v.id))) return false;
    return true;
  }

  function renderBrowse() {
    var all = items();
    $("#browse-sub").textContent = all.length + " items, chosen by hand. Nothing endless here.";

    /* charge selector: the featured axis */
    $("#charge-grid").innerHTML = Object.keys(CHARGES).map(function (c) {
      var n = all.filter(function (v) { return v.charge === c && matchesAxes(v, "charge"); }).length;
      var on = UI.charge === c;
      return '<button class="charge-btn' + (on ? " on-" + c : "") + '" data-action="filter-charge" data-value="' + c + '">' +
        '<span class="cname"><span class="cdot cdot-' + c + '"></span>' + CHARGES[c].name + "</span>" +
        '<span class="chint">' + CHARGES[c].hint + "</span>" +
        '<span class="ccount">' + n + "</span>" +
      "</button>";
    }).join("");

    $("#weight-grid").innerHTML = Object.keys(WEIGHTS).map(function (w) {
      var on = UI.weight === w;
      return '<button class="fchip' + (on ? " on" : "") + '" data-action="filter-weight" data-value="' + w + '">' +
        '<span class="fname">' + WEIGHTS[w].name + "</span>" +
        '<span class="fhint">' + WEIGHTS[w].hint + "</span>" +
      "</button>";
    }).join("");

    $("#medium-grid").innerHTML = Object.keys(MEDIUMS).map(function (m) {
      var on = (UI.medium || "") === m;
      return '<button class="fchip' + (on ? " on" : "") + '" data-action="filter-medium" data-value="' + m + '">' +
        '<span class="fname">' + MEDIUMS[m].name + "</span>" +
        '<span class="fhint">' + MEDIUMS[m].hint + "</span>" +
      "</button>";
    }).join("");

    /* The hearted list, reachable in full. The rail on Today caps at eight and
       is ordered by save date; this is the same set under the same three axes
       as everything else, which is the only way a long saved list stays usable
       instead of becoming a second inbox. */
    var savedN = window.Saved ? window.Saved.count() : 0;
    $("#saved-grid").innerHTML = savedN
      ? '<button class="fchip wide' + (UI.savedOnly ? " on" : "") + '" ' +
        'data-action="filter-saved" aria-pressed="' + (UI.savedOnly ? "true" : "false") + '">' +
        '<span class="fname">' +
          '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" ' +
          'style="vertical-align:-1px;margin-right:6px;fill:currentColor">' +
          '<path d="M12 20.5 4.2 13a4.6 4.6 0 1 1 6.5-6.5l1.3 1.3 1.3-1.3A4.6 4.6 0 1 1 19.8 13z"/>' +
          "</svg>Saved</span>" +
        '<span class="fhint">' + savedN + " hearted</span></button>"
      : "";
    var savedLabel = $("#saved-label");
    if (savedLabel) savedLabel.hidden = !savedN;

    var filtered = all.filter(function (v) { return matchesAxes(v); });
    var total = filtered.reduce(function (s, v) { return s + (v.duration || 0); }, 0);
    var parts = [];
    if (UI.charge) parts.push(CHARGES[UI.charge].name.toLowerCase());
    if (UI.weight) parts.push(WEIGHTS[UI.weight].name.toLowerCase());
    if (UI.medium) parts.push(UI.medium + (UI.medium === "article" ? "s" : "s"));
    if (UI.savedOnly) parts.push("saved");
    $("#result-count").textContent = filtered.length + " item" + (filtered.length === 1 ? "" : "s") +
      " · " + fmtTotal(total) + (parts.length ? " · " + parts.join(", ") : "");
    $("#clear-filters").hidden = !(UI.charge || UI.weight || UI.medium || UI.savedOnly);

    if (!filtered.length) {
      $("#browse-results").innerHTML = UI.savedOnly
        ? '<div class="noresult">Nothing hearted hits that way.<br>Loosen a filter, or turn Saved off.</div>'
        : '<div class="noresult">Nothing on the shelves hits that way.<br>Loosen a filter.</div>';
      return;
    }

    var html = "";
    SHELF_ORDER.forEach(function (shelf) {
      var group = filtered.filter(function (v) { return (v.shelf || "unsorted") === shelf; });
      if (!group.length) return;
      var open = !!UI.openShelves[shelf];
      var shown = open ? group : group.slice(0, SHELF_CAP);
      html += '<div class="shelf" data-shelf="' + esc(shelf) + '">' +
        '<div class="shelf-head">' +
          '<span class="shelf-name">' + esc(shelf) + "</span>" +
          '<span class="shelf-count">' + group.length + "</span>" +
          '<span class="shelf-rule"></span>' +
        "</div>" +
        shown.map(rowHtml).join("") +
        (group.length > SHELF_CAP
          ? '<button class="morebtn" data-action="shelf-more" data-shelf="' + esc(shelf) + '">' +
              (open ? "Show fewer" : "All " + group.length + " on this shelf") +
            "</button>"
          : "") +
      "</div>";
    });
    $("#browse-results").innerHTML = html;

    /* soundtrack follows the shelf in view, when the engine is spliced in */
    if (window.Sound && typeof window.Sound.observe === "function") {
      try { window.Sound.observe(document.getElementById("screen-browse")); } catch (e) {}
    }
  }

  /* Default is peek: "is this worth my time" is the common question, and it
     deserves one tap. Continuation lists pass "open" to skip straight to the
     page, because that choice was already made. */
  function rowHtml(v, action) {
    return '<button class="row' + (v.watched ? " finished" : "") + '" data-action="' +
      (action || "peek") + '" data-id="' + esc(v.id) + '">' +
      thumbHtml(v, "rthumb") +
      '<span class="rbody">' +
        '<span class="rtitle clamp2">' + esc(v.title) + "</span>" +
        '<span class="rmeta">' +
          '<span class="pill pill-' + esc(v.charge) + '">' + esc(v.charge) + "</span>" +
          '<span class="rsub">' + esc(fmtDurShort(v.duration)) +
            (v.medium === "article" ? " read" : "") + "</span>" +
          '<span class="rsub">' + esc(v.channel || "") + "</span>" +
        "</span>" +
      "</span>" +
    "</button>";
  }

  /* ------------------------------------------------------------------ */
  /* Journal / progress                                                   */
  /* ------------------------------------------------------------------ */
  function renderJournal() {
    var all = items();
    var watched = all.filter(function (v) { return v.watched; });
    var pages = all.filter(hasJournal);
    var minutes = Math.round(watched.reduce(function (s, v) { return s + (v.duration || 0); }, 0) / 60);

    var html =
      '<div class="stat-grid">' +
        '<div class="stat"><div class="stat-n">' + watched.length + '</div><div class="stat-l">Finished</div></div>' +
        '<div class="stat"><div class="stat-n">' + pages.length + '</div><div class="stat-l">Pages written</div></div>' +
        '<div class="stat"><div class="stat-n">' + minutes + '</div><div class="stat-l">Minutes taken in</div></div>' +
      "</div>";

    /* last two weeks, honestly: a filled square is a day something got finished */
    var hits = {};
    watched.forEach(function (v) {
      if (v.watched_at) hits[String(v.watched_at).slice(0, 10)] = true;
    });
    var strip = "", today = new Date();
    for (var i = 13; i >= 0; i--) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
                String(d.getDate()).padStart(2, "0");
      strip += '<span class="day' + (hits[key] ? " hit" : "") + (i === 0 ? " today" : "") + '"></span>';
    }
    html += '<div class="axis-label">The last two weeks</div>' +
            '<div class="daystrip">' + strip + "</div>" +
            '<div class="honesty">A filled square is a day something actually got finished. No grace given.</div>';

    /* the check engine's read on you, when it is spliced in */
    if (window.Quiz && typeof window.Quiz.stats === "function") {
      try {
        var st = window.Quiz.stats();
        if (st && st.watched > 0) {
          html += '<div class="quizline">' + st.answered + " answers across " + st.watched +
            " check" + (st.watched === 1 ? "" : "s") +
            (st.weakestFrame ? " · you skip <b>" + esc(st.weakestFrame) + "</b> the most" : "") +
            (st.habitsAccepted ? " · " + st.habitsAccepted + " habit" +
              (st.habitsAccepted === 1 ? "" : "s") + " taken" : "") +
            "</div>";
        }
      } catch (e) {}
    }

    /* Finished, not yet written up.
       This used to be a count and nothing else. The screen said "7 finished
       without a page. The page is the point." and then offered no way to reach
       any of the seven — so The record, the one screen that exists for
       journalling, was the one screen a finished video could not be opened
       from. The nudge named the problem and dead-ended on it.
       They open straight to the paper rather than the peek: whether it was
       worth watching is a settled question by the time it is in here. */
    var unwritten = watched.filter(function (v) { return !hasJournal(v); });
    if (unwritten.length) {
      var waiting = unwritten.slice().sort(function (a, b) {
        return String(b.watched_at || "").localeCompare(String(a.watched_at || ""));
      });
      html += '<div class="axis-label brass" style="margin-top:28px">Waiting for a page</div>' +
              '<div class="nudge">' + waiting.length +
              " finished without a page. The page is the point.</div>";
      html += (UI.waitingAll ? waiting : waiting.slice(0, PAGE_CAP))
        .map(function (v) { return rowHtml(v, "open"); }).join("");
      if (waiting.length > PAGE_CAP) {
        html += '<button class="morebtn" data-action="waiting-all">' +
          (UI.waitingAll ? "Show fewer" : "All " + waiting.length + " waiting") + "</button>";
      }
    }

    if (!watched.length && !pages.length) {
      html += '<div class="j-empty">' +
        '<div class="fin-orn">❦</div>' +
        '<div class="fin-text">Nothing in the record yet.<br>Finish one of today’s three and leave a page behind.</div>' +
      "</div>";
      $("#journal-body").innerHTML = html;
      return;
    }

    if (pages.length) {
      html += '<div class="axis-label brass" style="margin-top:28px">Pages</div>';
      var sorted = pages.slice().sort(function (a, b) {
        return String(b.updated || b.watched_at || "").localeCompare(String(a.updated || a.watched_at || ""));
      });
      var shown = UI.journalAll ? sorted : sorted.slice(0, PAGE_CAP);
      html += shown.map(function (v) {
        var j = v.journal || {};
        var snip = (j.learned || j.matters || j.use || "").trim().slice(0, 110);
        return '<button class="pagecard" data-action="open" data-id="' + esc(v.id) + '">' +
          '<span class="pg-title">' + esc(v.title) + "</span>" +
          (snip ? '<span class="pg-snip">“' + esc(snip) + '”</span>' : "") +
          '<span class="pg-meta">' + esc(v.shelf) + " · " + esc(v.charge) +
            (v.watched_at ? " · finished " + esc(fmtDate(v.watched_at)) : "") + "</span>" +
        "</button>";
      }).join("");
      if (sorted.length > PAGE_CAP) {
        html += '<button class="morebtn" data-action="journal-all">' +
          (UI.journalAll ? "Show fewer" : "All " + sorted.length + " pages") + "</button>";
      }
    }

    $("#journal-body").innerHTML = html;
  }

  /* ------------------------------------------------------------------ */
  /* Paper: full-screen reading / watching view                           */
  /* ------------------------------------------------------------------ */
  function openPaper(id) {
    var v = byId(id);
    if (!v) return;
    UI.paperId = id;

    $("#paper-kind").textContent =
      (v.medium === "article" ? "Article" : "Video") + " · " + fmtDur(v.duration) +
      " · " + (v.shelf || "");

    var html = "";
    if (v.medium === "video" && v.id) {
      html += '<div class="stage"><iframe src="https://www.youtube-nocookie.com/embed/' +
        encodeURIComponent(v.id) + '?rel=0&modestbranding=1&playsinline=1" ' +
        'title="' + esc(v.title) + '" ' +
        'allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
    } else {
      if (v.thumb) html += thumbHtml(v, "arthero", false);
      html += '<a class="open-art" href="' + esc(v.url) + '" target="_blank" rel="noopener">Open the article ↗</a>';
    }

    html += '<div class="nb-title">' + esc(v.title) + "</div>";
    var meta = [];
    if (v.channel) meta.push(esc(v.channel));
    var vw = fmtViews(v.views);
    if (vw) meta.push(esc(vw));
    if (meta.length) html += '<div class="nb-meta">' + meta.join(" · ") + "</div>";
    html += '<div class="nb-tags">' +
      '<span class="pill pill-' + esc(v.charge) + '">' + esc(v.charge) + "</span>" +
      '<span class="nb-tag">' + esc(v.shelf || "") + "</span>" +
      '<span class="nb-tag">' + esc(v.weight || "") + "</span>" +
    "</div>";
    if (v.why) html += '<div class="nb-why">' + esc(v.why) + "</div>";

    html += '<button class="finish' + (v.watched ? " done" : "") + '" data-action="finish">' +
      finishLabel(v) + "</button>";

    html += quizHtml(v);

    /* the page: one sheet of ruled paper, headings pre-printed */
    var j = v.journal || {};
    html += '<div class="nb-label">The page</div>' +
      '<div class="sheet">' +
        '<h2 class="sheet-h">What I learned</h2>' +
        '<div class="sheet-line" contenteditable="true" data-field="learned" ' +
          'data-ph="Write it in your own words.">' + toHtml(j.learned || "") + "</div>" +
        '<h2 class="sheet-h">Why it matters</h2>' +
        '<div class="sheet-line" contenteditable="true" data-field="matters" ' +
          'data-ph="Tie it to something you are building.">' + toHtml(j.matters || "") + "</div>" +
        '<h2 class="sheet-h">How I’ll use it</h2>' +
        '<div class="sheet-line" contenteditable="true" data-field="use" ' +
          'data-ph="One concrete action, with a date.">' + toHtml(j.use || "") + "</div>" +
      "</div>";

    $("#paper-body").innerHTML = html;
    $("#paper-scroll").scrollTop = 0;
    $("#paper").classList.add("open");
  }

  function finishLabel(v) {
    if (!v.watched) return v.medium === "article" ? "Mark it read" : "Mark it finished";
    return "✓ Finished" + (v.watched_at ? " · " + esc(fmtDate(v.watched_at)) : "");
  }

  function quizHtml(v) {
    if (!window.Quiz || typeof window.Quiz.forItem !== "function") return "";
    var q, state;
    try {
      q = window.Quiz.forItem(v.id);
      state = window.Quiz.get(v.id);
    } catch (e) { return ""; }
    if (!q) return "";

    var html = '<div class="nb-label">The check</div>';
    html += '<div class="habit">' +
      '<div class="q-frame">A habit to walk out with</div>' +
      '<div class="habit-title">' + esc(q.habit.title) + "</div>" +
      '<div class="habit-line">' + esc(q.habit.trigger) + " <span class=\"arrow\">→</span> " +
        esc(q.habit.action) + "</div>" +
      '<div class="habit-days">for ' + esc(String(q.habit.days)) + " days</div>" +
      '<div class="habit-why">' + esc(q.habit.why) + "</div>" +
      '<div id="habit-foot">' + habitFootHtml(state) + "</div>" +
    "</div>";

    var answers = (state && state.answers) || {};
    if (q.deep) {
      html += '<div class="q-deep-note">Philosophy runs the long ladder. ' +
        "Six questions, and the last one is the point of the other five.</div>";
    }
    html += q.questions.map(function (question) {
      return '<div class="q-block' + (question.keystone ? " keystone" : "") + '">' +
        '<div class="q-frame"><span class="qn">' + question.n + "</span>" +
          esc(question.frame) + "</div>" +
        '<div class="q-text">' + esc(question.text) + "</div>" +
        '<div class="ruled" contenteditable="true" data-quiz-frame="' +
          esc(question.frame) + '" ' +
          'data-ph="' + (question.keystone ? "One sentence. Say it plainly."
                                           : "Think on the page.") + '">' +
          toHtml(answers[question.frame] || "") + "</div>" +
      "</div>";
    }).join("");
    html += '<div class="q-progress" id="quiz-progress">' + quizProgressText(state) + "</div>";
    return html;
  }

  function habitFootHtml(state) {
    if (state && state.habitAccepted === true) {
      return '<span class="habit-mark">✓ Taken</span>';
    }
    if (state && state.habitAccepted === false) {
      return '<div class="habit-btns">' +
        '<button class="hbtn take" data-action="habit-take">Take it after all</button>' +
      "</div>";
    }
    return '<div class="habit-btns">' +
      '<button class="hbtn take" data-action="habit-take">Take it</button>' +
      '<button class="hbtn" data-action="habit-skip">Not this one</button>' +
    "</div>";
  }

  function quizProgressText(state) {
    var n = (state && state.answered) || 0;
    var total = (state && state.total) || 3;
    var word = ["zero", "one", "two", "three", "four", "five", "six"][total] ||
               String(total);
    if (n === 0) {
      return word.charAt(0).toUpperCase() + word.slice(1) +
        " questions. The ones you skip are the signal.";
    }
    if (n >= total) {
      return state && state.takeaway
        ? "All " + word + " answered, takeaway written."
        : "All " + word + " answered.";
    }
    return n + " of " + total + " answered.";
  }

  function refreshQuizChrome() {
    if (!window.Quiz || !UI.paperId) return;
    var state;
    try { state = window.Quiz.get(UI.paperId); } catch (e) { return; }
    var foot = $("#habit-foot");
    if (foot) foot.innerHTML = habitFootHtml(state);
    var prog = $("#quiz-progress");
    if (prog) prog.textContent = quizProgressText(state);
  }

  function closePaper() {
    if (saveTimer) flushJournal();          /* never lose ink on the way out */
    UI.paperId = null;
    var p = $("#paper");
    p.classList.remove("open");
    setTimeout(function () {
      if (!p.classList.contains("open")) $("#paper-body").innerHTML = "";
    }, 350);                                 /* clearing kills the embed audio */
    renderToday();
    renderJournal();
    if (UI.tab === "browse") renderBrowse();
  }

  /* ------------------------------------------------------------------ */
  /* soundtrack toggle, only when the engine is spliced in                */
  /* ------------------------------------------------------------------ */
  function soundHook() {
    if (!window.Sound) return;
    var slot = $("#sound-slot");
    if (!slot) return;
    slot.innerHTML = '<button class="sound-btn" data-action="sound-open" ' +
      'aria-haspopup="dialog" aria-label="Soundtrack">' +
      '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>';
    function paint() {
      var b = $(".sound-btn");
      if (b) b.classList.toggle("on", !!(window.Sound.state && window.Sound.state.playing));
      if (UI.soundOpen) renderSound();
    }
    if (typeof window.Sound.onChange === "function") window.Sound.onChange(paint);
    paint();
  }

  /* ------------------------------------------------------------------ */
  /* the soundtrack sheet                                                 */
  /* ------------------------------------------------------------------ */
  function renderSound() {
    var body = $("#sound-body");
    if (!body || !window.Sound) return;
    var S = window.Sound, st = S.state || {};
    var tracks = S.tracks || [];
    var live = typeof S.isAudible === "function" ? S.isAudible() : !!st.playing;

    var head = '<div class="snd-head"><span class="snd-kick">Soundtrack</span>' +
      '<span class="snd-state">' +
        (st.playing ? (live ? "playing" : "starting…") : "off") +
      "</span></div>";

    /* Say the thing the button could never say. The ringer switch mutes this
       with no signal any code can read, so the only honest move is to name it
       up front rather than let a silent phone read as a broken app. */
    var note = st.playing
      ? '<p class="snd-note">Tap a track to move the room to it. Hearing nothing? ' +
        "Check the side switch — iPhone mutes web audio there with no way for the " +
        "page to know.</p>"
      : '<p class="snd-note">Sound stays off until you ask for it once. ' +
        "Tap any track to start.</p>";

    function row(t) {
      var cur = st.current === t.id;
      var cls = "trk" + (cur ? " on" : "") + (cur && live ? " live" : "") +
                (t.available ? "" : " trk-missing");
      return '<button class="' + cls + '" data-action="sound-play" data-track="' +
        esc(t.id) + '"' + (t.available ? "" : " disabled") +
        ' aria-pressed="' + (cur ? "true" : "false") + '">' +
        '<span class="trk-eq"><i></i><i></i><i></i></span>' +
        '<span class="trk-txt">' +
          '<span class="trk-t">' + esc(t.title) +
            (t.available ? "" : " · missing") + "</span>" +
          '<span class="trk-a">' + esc(t.artist || "") + "</span>" +
        "</span>" +
        '<span class="trk-shelf">' + esc(t.shelf || "") + "</span>" +
      "</button>";
    }

    /* There are more sounds than shelves, so one flat list would put a shelf
       badge on some rows and a blank on the rest with nothing saying why.
       Split them.
       Unshelved first, and not because they are the new ones. Fifteen rows do
       not fit the sheet, so whichever group is second is behind a scroll — and
       these are the only tracks a tap is the *sole* way to reach. The shelved
       eight get chosen for you by scrolling the page; burying the ones that
       cannot would be exactly backwards. */
    var onShelf = tracks.filter(function (t) { return !!t.shelf; });
    var loose = tracks.filter(function (t) { return !t.shelf; });

    var rows = '<div class="snd-list">' +
      (loose.length ? '<div class="snd-grp">Tap to play</div>' +
                      loose.map(row).join("") : "") +
      (onShelf.length ? '<div class="snd-grp">Follows the page</div>' +
                        onShelf.map(row).join("") : "") +
    "</div>";

    var pct = Math.round((st.muted ? 0 : (st.volume == null ? 0.35 : st.volume)) * 100);
    var foot = '<div class="snd-foot">' +
      '<button class="hbtn' + (st.playing ? " take on" : "") + '" data-action="sound-toggle">' +
        (st.playing ? "Turn off" : "Turn on") + "</button>" +
      '<input id="snd-vol" type="range" min="0" max="100" value="' + pct +
        '" style="--pct:' + pct + '%" aria-label="Volume">' +
    "</div>";

    body.innerHTML = head + note + rows + foot;
  }

  function openSound() {
    if (!window.Sound) return;
    UI.soundOpen = true;
    renderSound();
    $("#sound").classList.add("on");
    $("#sound").setAttribute("aria-hidden", "false");
    document.body.classList.add("peeking");
  }

  function closeSound() {
    if (!UI.soundOpen) return;
    UI.soundOpen = false;
    $("#sound").classList.remove("on");
    $("#sound").setAttribute("aria-hidden", "true");
    document.body.classList.remove("peeking");
    var b = $(".sound-btn");
    if (b) b.focus({ preventScroll: true });
  }

  /* ------------------------------------------------------------------ */
  /* events: one delegated handler                                        */
  /* ------------------------------------------------------------------ */
  function showTab(tab) {
    UI.tab = tab;
    ["today", "browse", "journal"].forEach(function (t) {
      var scr = $("#screen-" + t);
      if (scr) scr.classList.toggle("on", t === tab);
    });
    document.querySelectorAll("#tabbar .tab").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-tab") === tab);
    });
    if (tab === "journal") renderJournal();  /* stats stay honest */
  }

  /* Swipe the sheet down to dismiss. Tracked on the sheet itself and only
     when it is already scrolled to the top, so the gesture never fights the
     sheet's own scrolling.

     Distance alone is the wrong dismissal test. A real sheet also honours a
     fast flick: 30px thrown quickly should close, 80px dragged slowly should
     not. So we track velocity over the last frame and dismiss on either. Drag
     past the resting position gets rubber-banded, and the scrim fades with
     the drag so the page behind is visibly coming back. */
  (function () {
    var sheet = document.getElementById("peek-sheet");
    var scrim = document.getElementById("peek-scrim");
    if (!sheet) return;
    var y0 = null, dy = 0, lastY = 0, lastT = 0, vel = 0;

    sheet.addEventListener("touchstart", function (e) {
      y0 = sheet.scrollTop <= 0 ? e.touches[0].clientY : null;
      dy = 0; vel = 0;
      lastY = e.touches[0].clientY; lastT = Date.now();
      if (y0 !== null) {
        sheet.style.transition = "none";
        if (scrim) scrim.style.transition = "none";
      }
    }, { passive: true });

    sheet.addEventListener("touchmove", function (e) {
      if (y0 === null) return;
      var y = e.touches[0].clientY, now = Date.now();
      var dt = now - lastT;
      if (dt > 0) vel = (y - lastY) / dt;      /* px per ms, + is downward */
      lastY = y; lastT = now;

      var raw = y - y0;
      /* Upward drag is resisted to a third — the sheet is already home, so it
         should feel anchored rather than loose. */
      dy = raw >= 0 ? raw : raw / 3;
      sheet.style.transform = "translateY(" + dy + "px)";
      if (scrim && dy > 0) {
        scrim.style.opacity = String(Math.max(0, 1 - (dy / (sheet.offsetHeight || 400)) * 1.3));
      }
    }, { passive: true });

    sheet.addEventListener("touchend", function () {
      if (y0 === null) return;
      sheet.style.transition = "";
      sheet.style.transform = "";
      if (scrim) { scrim.style.transition = ""; scrim.style.opacity = ""; }
      /* Either a committed drag or a decisive flick. */
      if (dy > 90 || (vel > 0.55 && dy > 18)) closePeek();
      y0 = null;
    });
  })();

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (document.getElementById("peek").classList.contains("on")) closePeek();
  });

  /* One item can be on screen several times at once -- in the daily three, in
     a rail, and in the Saved section. Repaint every copy, or hearting one
     leaves the others showing the old state. */
  function paintSaved(id) {
    if (!window.Saved) return;
    var on = window.Saved.has(id);
    document.querySelectorAll('.heart[data-id="' + id.replace(/"/g, '\\"') + '"]')
      .forEach(function (h) {
        h.classList.toggle("on", on);
        h.setAttribute("aria-pressed", on ? "true" : "false");
        h.setAttribute("aria-label", on ? "Saved. Tap to unsave" : "Save for later");
      });
  }

  function toggleSaved(el) {
    if (!window.Saved) return;
    var id = el.getAttribute("data-id");
    if (!id) return;
    var on = window.Saved.toggle(id);
    paintSaved(id);
    if (on) {
      /* The pop is the whole confirmation. Re-adding the class on the next
         frame is what makes it replay on a second save. */
      el.classList.remove("pop");
      requestAnimationFrame(function () { el.classList.add("pop"); });
    }
    renderSaved();
    /* Browse carries the Saved filter and its count. Repainting it only when
       that screen is showing keeps a heart tap on Today from rebuilding a list
       of two hundred rows nobody is looking at. */
    if (UI.tab === "browse") renderBrowse();
    var v = byId(id);
    toast(on ? "Saved" + (v ? " · " + (window.Saved.count()) + " waiting" : "")
             : "Removed from saved");
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var h = e.target && e.target.closest ? e.target.closest('.heart[data-action="save"]') : null;
    if (!h) return;
    e.preventDefault();
    toggleSaved(h);
  });

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el) return;
    var action = el.getAttribute("data-action");

    /* Save is checked before anything else because the heart sits inside a
       card that is itself a [data-action="peek"] button. Without the stop, one
       tap both saves the item and opens it. */
    if (action === "save") {
      e.preventDefault();
      e.stopPropagation();
      toggleSaved(el);
      return;
    }

    if (action === "sound-open") { openSound(); return; }
    if (action === "sound-close") { closeSound(); return; }
    if (action === "sound-play" && window.Sound) {
      var tid = el.getAttribute("data-track");
      var ok = false;
      try { ok = window.Sound.play(tid); } catch (err) {}
      renderSound();
      if (!ok) { toast("That track has no file on this build."); return; }
      /* Same honesty as the on/off button: give play() a beat to settle, then
         report what the media elements are actually doing rather than what the
         state flag claims. */
      setTimeout(function () {
        var audible = typeof window.Sound.isAudible === "function"
          ? window.Sound.isAudible() : false;
        var t = (window.Sound.tracks || []).filter(function (x) { return x.id === tid; })[0];
        renderSound();
        if (audible) toast((t ? t.title : "Track") + " · check the side switch if silent");
        else toast("Started but nothing is advancing — tap it once more.");
      }, 900);
      return;
    }

    if (action === "reroll") {
      var n = bumpReroll();
      renderToday();
      /* Scroll back to the top of the three. Without this the new cards land
         above the fold he is looking at and the tap reads as doing nothing. */
      var scr = $("#screen-today");
      if (scr) scr.scrollTo({ top: 0, behavior: "smooth" });
      toast(n === 1 ? "Three different ones."
                    : "Reshuffled · " + n + " times today");
      return;
    }

    if (action === "filter-saved") {
      UI.savedOnly = !UI.savedOnly;
      renderBrowse();
      return;
    }

    if (action === "tab") { showTab(el.getAttribute("data-tab")); return; }
    if (action === "open") { openPaper(el.getAttribute("data-id")); return; }
    if (action === "close-paper") { closePaper(); return; }
    if (action === "peek") { openPeek(el.getAttribute("data-id")); return; }
    if (action === "close-peek") { closePeek(); return; }
    if (action === "peek-full") {
      var pid = el.getAttribute("data-id");
      closePeek();
      /* Let the sheet finish leaving before the reading view arrives, or the
         two transforms fight and both look cheap. */
      setTimeout(function () { openPaper(pid); }, 220);
      return;
    }

    if (action === "finish") {
      var v = byId(UI.paperId);
      if (!v) return;
      v.watched = !v.watched;
      v.watched_at = v.watched ? new Date().toISOString().slice(0, 19) : null;
      el.classList.toggle("done", v.watched);
      el.innerHTML = finishLabel(v);
      postEntry(v.id, { watched: v.watched }).then(function (ok) {
        if (ok) {
          var fresh = byId(UI.paperId);
          if (fresh && el.isConnected) {
            el.classList.toggle("done", fresh.watched);
            el.innerHTML = finishLabel(fresh);
          }
          showSaved();
        }
      });
      return;
    }

    if (action === "filter-charge") {
      var c = el.getAttribute("data-value");
      UI.charge = UI.charge === c ? null : c;
      renderBrowse();
      return;
    }
    if (action === "filter-weight") {
      var w = el.getAttribute("data-value");
      UI.weight = UI.weight === w ? null : w;
      renderBrowse();
      return;
    }
    if (action === "filter-medium") {
      UI.medium = el.getAttribute("data-value") || null;
      renderBrowse();
      return;
    }
    if (action === "clear-filters") {
      UI.charge = UI.weight = UI.medium = null;
      UI.savedOnly = false;
      renderBrowse();
      return;
    }
    if (action === "shelf-more") {
      var shelf = el.getAttribute("data-shelf");
      UI.openShelves[shelf] = !UI.openShelves[shelf];
      renderBrowse();
      return;
    }
    if (action === "journal-all") {
      UI.journalAll = !UI.journalAll;
      renderJournal();
      return;
    }

    if (action === "waiting-all") {
      UI.waitingAll = !UI.waitingAll;
      renderJournal();
      return;
    }

    if (action === "habit-take" && window.Quiz && UI.paperId) {
      try { window.Quiz.acceptHabit(UI.paperId); } catch (err) {}
      refreshQuizChrome();
      return;
    }
    if (action === "habit-skip" && window.Quiz && UI.paperId) {
      try { window.Quiz.skipHabit(UI.paperId); } catch (err) {}
      refreshQuizChrome();
      return;
    }

    if (action === "sound-toggle" && window.Sound) {
      try {
        if (window.Sound.state && window.Sound.state.playing) window.Sound.stop();
        else {
          window.Sound.arm();
          /* Report what happened. This failed invisibly for two rounds: the
             button looked identical whether the track was playing, blocked,
             or 404ing. Give it a beat for play() to settle, then say so. */
          setTimeout(function () {
            var st = window.Sound.state || {};
            var d = typeof window.Sound.diag === "function" ? window.Sound.diag() : null;
            var audible = typeof window.Sound.isAudible === "function"
              ? window.Sound.isAudible() : !!st.playing;

            if (st.error && String(st.error).indexOf("missing:") === 0) {
              toast("Sound file missing — " + String(st.error).slice(8));
            } else if (d && d.players.length && d.players.some(function (p) { return p.err; })) {
              var e = d.players.filter(function (p) { return p.err; })[0];
              toast("Audio failed to decode (" + e.src + ", code " + e.err + ").");
            } else if (!st.playing) {
              toast("Sound was blocked by the browser. Try again.");
            } else if (!audible) {
              /* state says playing but no element is advancing: the track is
                 stalled, not muted. A different problem with a different fix,
                 and worth saying out loud rather than blaming the switch. */
              toast("Sound started but stalled — tap once more.");
            } else {
              /* Genuinely advancing. If it is still silent, the cause is
                 outside anything JS can see: on iPhone the ringer switch
                 mutes HTML5 audio with no detectable signal at all. */
              toast("Sound on. If you hear nothing, check the side switch.");
            }
          }, 1400);
        }
      } catch (err) { toast("Sound failed to start."); }
      return;
    }
  });

  /* Small transient message. Deliberately not an alert: this reports state,
     it does not need a decision. */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("on"); }, 4200);
  }

  /* writing surfaces */
  var quizTimers = {};
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.id === "snd-vol" && window.Sound) {
      var pct = Number(t.value) || 0;
      /* Repaint the track fill from the same value the engine is given, so the
         slider cannot drift from what is actually playing. */
      t.style.setProperty("--pct", pct + "%");
      try { window.Sound.setVolume(pct / 100); } catch (err) {}
      return;
    }
    if (t.closest(".sheet-line")) { queueJournal(); return; }
    var q = t.closest("[data-quiz-frame]");
    if (q && window.Quiz && UI.paperId) {
      var n = q.getAttribute("data-quiz-frame");
      var id = UI.paperId;
      clearTimeout(quizTimers[n]);
      quizTimers[n] = setTimeout(function () {
        try { window.Quiz.answer(id, n, q.innerText.trim()); } catch (err) {}
        refreshQuizChrome();
      }, 500);
    }
  });

  /* paste as plain text so the sheet never inherits foreign markup */
  document.addEventListener("paste", function (e) {
    var t = e.target && e.target.closest ? e.target.closest("[contenteditable]") : null;
    if (!t) return;
    e.preventDefault();
    var txt = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, txt);
  });

  /* ------------------------------------------------------------------ */
  /* boot                                                                 */
  /* ------------------------------------------------------------------ */
  function init() {
    renderToday();
    renderBrowse();
    renderJournal();
    soundHook();
    if (window.Quiz && typeof window.Quiz.onChange === "function") {
      window.Quiz.onChange(function () {
        if (UI.tab === "journal" && !UI.paperId) renderJournal();
      });
    }
  }

  /* Static build: the catalog is spliced into this page at build time, so
     there is nothing to fetch and nothing that can fail. The dev server's
     version of boot() asked /api/library first; here that is a guaranteed
     404 before the first paint on every launch. */
  function boot() {
    if (window.ITEMS && window.ITEMS.length) { init(); return; }
    document.getElementById("today-cards").innerHTML =
      '<div class="offline">This build shipped without a catalog.<br>' +
      "Rebuild with <b>python3 deploy_phone.py</b>.</div>";
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  /* offline shell, when a worker exists to install one */
  if ("serviceWorker" in navigator) {
    fetch("sw.js", { method: "HEAD" })
      .then(function (r) {
        if (r.ok) navigator.serviceWorker.register("sw.js").catch(function () {});
      })
      .catch(function () {});
  }
})();
</script>

<!-- library:feel:start -->
<script>
/* ====================================================================== */
/* Feel — the layer that decides whether this reads as an app or a page.   */
/*                                                                        */
/* Deliberately self-contained: it hooks the DOM through observers and     */
/* delegated events rather than the renderers, so it keeps working after   */
/* every re-render without any renderer knowing it exists.                 */
/* ====================================================================== */
(function () {
  "use strict";

  var RM = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function reduced() { return !!(RM && RM.matches); }

  /* iOS only evaluates :active on elements in a document that has a touch
     listener. One empty listener is the whole fix, and without it every
     press state below silently does nothing on an iPhone. */
  document.addEventListener("touchstart", function () {}, { passive: true });

  /* Vibration is a no-op on iOS Safari — the API does not exist there and no
     amount of guarding changes that. It is here for Android and for a future
     iOS that ships it; it must never be the only feedback for an action. */
  function haptic(ms) {
    try { if (navigator.vibrate && !reduced()) navigator.vibrate(ms || 8); } catch (e) {}
  }

  /* ---------------------------------------------------------------- */
  /* reveal on entry — doubles as the load sequence                     */
  /* ---------------------------------------------------------------- */
  /* Parents only. Marking a section and its rows both would run two nested
     animations on the same pixels. */
  var REVEAL_SEL = ".sect,#today-cards .dcard,.shelf,.stat-grid,.charge-grid," +
                   ".chip-grid,.fin,.j-empty,.quizline";
  var io = null;

  if ("IntersectionObserver" in window) {
    io = new IntersectionObserver(function (entries) {
      var n = 0;
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        /* Stagger within a batch, capped so a long list never becomes a slow
           wave the user has to sit through. */
        e.target.style.setProperty("--d", Math.min(n * 55, 220) + "ms");
        e.target.classList.add("in");
        io.unobserve(e.target);
        n++;
      });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0.01 });
  }

  function markReveals() {
    if (!io || reduced()) return;
    var list = document.querySelectorAll(REVEAL_SEL);
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.getAttribute("data-rev")) continue;
      if (el.closest(".reveal")) continue;          /* never nest reveals */
      el.setAttribute("data-rev", "1");
      el.classList.add("reveal");
      io.observe(el);
    }
  }

  /* Hard safety net. .reveal starts at opacity:0, so any path where the
     observer never fires would leave the app blank. Nothing about a motion
     nicety is worth that risk. */
  function unhideAll() {
    var list = document.querySelectorAll(".reveal:not(.in)");
    for (var i = 0; i < list.length; i++) list[i].classList.add("in");
  }
  setInterval(function () {
    /* Anything still hidden well after it was marked gets shown. */
    var list = document.querySelectorAll(".reveal:not(.in)");
    for (var i = 0; i < list.length; i++) {
      var el = list[i], t = +(el.getAttribute("data-revt") || 0);
      if (!t) { el.setAttribute("data-revt", String(Date.now())); continue; }
      if (Date.now() - t > 2500) el.classList.add("in");
    }
  }, 1200);
  window.addEventListener("pagehide", unhideAll);

  /* ---------------------------------------------------------------- */
  /* images settle rather than pop                                      */
  /* ---------------------------------------------------------------- */
  /* `load` does not bubble, so this listens in the capture phase. */
  document.addEventListener("load", function (e) {
    var t = e.target;
    if (t && t.tagName === "IMG" && t.closest && t.closest(".thumbbox")) t.classList.add("ld");
  }, true);

  function markLoaded() {
    var list = document.querySelectorAll(".thumbbox img:not(.ld)");
    for (var i = 0; i < list.length; i++) {
      /* Cached images finish before the listener is ever attached. */
      if (list[i].complete && list[i].naturalWidth) list[i].classList.add("ld");
    }
  }

  /* ---------------------------------------------------------------- */
  /* rails fade only on the side that still has content                 */
  /* ---------------------------------------------------------------- */
  function railEdges(r) {
    var max = r.scrollWidth - r.clientWidth;
    r.classList.toggle("more-left", r.scrollLeft > 4);
    r.classList.toggle("more-right", r.scrollLeft < max - 4);
  }
  function wireRails() {
    var list = document.querySelectorAll(".rail");
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (!r.getAttribute("data-rail")) {
        r.setAttribute("data-rail", "1");
        (function (rail) {
          rail.addEventListener("scroll", function () { railEdges(rail); }, { passive: true });
        })(r);
      }
      railEdges(r);
    }
  }

  /* ---------------------------------------------------------------- */
  /* collapsing title bar                                               */
  /* ---------------------------------------------------------------- */
  var TITLES = { today: "Today’s three", browse: "The shelves", journal: "The record" };
  var bar = document.getElementById("topbar");
  var barT = document.getElementById("topbar-t");

  function syncBar() {
    var s = document.querySelector(".screen.on");
    if (!s || !bar) return;
    var key = s.id.replace("screen-", "");
    var title = TITLES[key] || "";
    if (barT && barT.textContent !== title) barT.textContent = title;
    bar.classList.toggle("on", s.scrollTop > 64);
  }

  var barTick = false;
  function wireScreens() {
    var list = document.querySelectorAll(".screen");
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (s.getAttribute("data-sc")) continue;
      s.setAttribute("data-sc", "1");
      s.addEventListener("scroll", function () {
        if (barTick) return;
        barTick = true;
        requestAnimationFrame(function () { barTick = false; syncBar(); });
      }, { passive: true });
    }
  }

  /* ---------------------------------------------------------------- */
  /* tab travel has a direction                                         */
  /* ---------------------------------------------------------------- */
  var ORDER = ["today", "browse", "journal"];
  var lastTab = "today";

  /* Capture phase, so the direction class is in place before the app adds
     .on — the animation is keyed off the two together. */
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest('[data-action="tab"]') : null;
    if (!el) return;
    var next = el.getAttribute("data-tab");
    haptic(6);
    if (next === lastTab) {
      /* Second tap on the tab you are already on scrolls to top, the way a
         native tab bar does. */
      var cur = document.querySelector(".screen.on");
      if (cur) cur.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
      return;
    }
    var scr = document.getElementById("screen-" + next);
    if (scr && !reduced()) {
      var dir = ORDER.indexOf(next) > ORDER.indexOf(lastTab) ? "from-r" : "from-l";
      scr.classList.remove("from-l", "from-r");
      void scr.offsetWidth;                          /* restart the animation */
      scr.classList.add(dir);
    }
    lastTab = next;
    requestAnimationFrame(syncBar);
  }, true);

  /* ---------------------------------------------------------------- */
  /* depth behind sheets                                                */
  /* ---------------------------------------------------------------- */
  /* Watching the class rather than patching openPeek/closePaper keeps this
     module independent of the app's internals. */
  function watchOverlay(id, bodyClass) {
    var el = document.getElementById(id);
    if (!el || !window.MutationObserver) return;
    new MutationObserver(function () {
      var open = el.classList.contains("on") || el.classList.contains("open");
      document.body.classList.toggle(bodyClass, open);
      if (open) haptic(10);
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  watchOverlay("peek", "peeking");
  watchOverlay("paper", "papered");

  /* ---------------------------------------------------------------- */
  /* reading progress                                                   */
  /* ---------------------------------------------------------------- */
  var ps = document.getElementById("paper-scroll");
  var prog = document.getElementById("paper-prog");
  if (ps && prog) {
    var pTick = false;
    ps.addEventListener("scroll", function () {
      if (pTick) return;
      pTick = true;
      requestAnimationFrame(function () {
        pTick = false;
        var max = ps.scrollHeight - ps.clientHeight;
        var pct = max > 40 ? Math.min(100, (ps.scrollTop / max) * 100) : 0;
        prog.style.width = pct + "%";
      });
    }, { passive: true });
  }

  /* ---------------------------------------------------------------- */
  /* primary actions bloom from where the thumb landed                  */
  /* ---------------------------------------------------------------- */
  var BLOOM_SEL = ".peek-btn.primary,.open-art,.finish";

  document.addEventListener("touchstart", function (e) {
    var el = e.target.closest ? e.target.closest(BLOOM_SEL) : null;
    if (!el || !e.touches[0]) return;
    var r = el.getBoundingClientRect();
    el.style.setProperty("--px", (e.touches[0].clientX - r.left) + "px");
    el.style.setProperty("--py", (e.touches[0].clientY - r.top) + "px");
  }, { passive: true });

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest(BLOOM_SEL) : null;
    if (!el) return;
    haptic(11);
    if (reduced()) return;
    el.classList.remove("bloom");
    void el.offsetWidth;
    el.classList.add("bloom");
  }, true);

  /* A shorter tick for anything that just changes a filter or opens a card. */
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el) return;
    var a = el.getAttribute("data-action");
    if (a === "peek" || a === "open" || a === "filter-charge" ||
        a === "filter-weight" || a === "filter-medium") haptic(7);
  }, true);

  /* ---------------------------------------------------------------- */
  /* rescan whenever the app renders                                    */
  /* ---------------------------------------------------------------- */
  function scan() { markReveals(); markLoaded(); wireRails(); wireScreens(); syncBar(); }

  if (window.MutationObserver) {
    var pending = false;
    var mo = new MutationObserver(function () {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () { pending = false; scan(); });
    });
    /* childList only. The scan itself sets classes and attributes, so
       observing those would make it retrigger itself forever. */
    ORDER.forEach(function (t) {
      var el = document.getElementById("screen-" + t);
      if (el) mo.observe(el, { childList: true, subtree: true });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scan);
  } else {
    scan();
  }
  window.addEventListener("load", scan);
})();
</script>
<!-- library:feel:end -->
</body>
</html>

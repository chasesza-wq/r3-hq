<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RecoverRevenue — Sales HQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2311141a'/%3E%3Cpath d='M20 45V19h9.6a6.7 6.7 0 0 1 0 13.4H20m8.4 0L35 45' stroke='%234fc2b4' stroke-width='5.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M38 19h6.6a5.8 5.8 0 0 1 0 11.6h-2.4 2.4a6.4 6.4 0 0 1 0 12.8H38' stroke='%234fc2b4' stroke-width='5.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sales HQ">
<meta name="theme-color" content="#11141a">
<style>
  :root{
    --bg:#ffffff; --bg2:#f4f5f7; --bg3:#eceef1; --ink:#11141a; --dim:#767c88;
    --line:rgba(17,20,26,.09); --green:#12a065; --amber:#c77800; --blue:#15427d;
    --red:#c8321f; --teal:#0f8d84; --sheet:#ffffff; --pill:#11141a; --pill-ink:#ffffff;
    --shadow:0 1px 2px rgba(17,20,26,.05),0 8px 24px rgba(17,20,26,.07);
  }
  [data-theme="dark"]{
    --bg:#0e1013; --bg2:#181b20; --bg3:#22262c; --ink:#f2f4f6; --dim:#8b919c;
    --line:rgba(242,244,246,.10); --sheet:#181b20; --pill:#f2f4f6; --pill-ink:#0e1013;
    --blue:#6a9de0; --red:#f0705c; --green:#31c184; --amber:#e0a03a; --teal:#4fc2b4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
    background:#dfe2e6; display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; -webkit-font-smoothing:antialiased; color:var(--ink);
  }
  [data-theme="dark"] body{background:#000}
  button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
  a{color:inherit;text-decoration:none}
  input,select{font-family:inherit;color:inherit}

  .device{
    width:100%; max-width:420px; height:860px; max-height:calc(100vh - 48px);
    background:var(--bg); border-radius:46px; overflow:hidden; position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.30), 0 0 0 10px #16181c, 0 0 0 12px #3c3e42;
    display:flex; flex-direction:column;
  }
  @media (max-width:560px){
    body{padding:0;background:var(--bg)}
    .device{max-width:none;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
  }

  /* ── header ───────────────────────────────────────────── */
  header{padding:20px 20px 10px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .mark{width:30px;height:30px;border-radius:9px;flex-shrink:0;color:var(--ink)}
  .qbtn{
    flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:9px 12px;
    border-radius:13px;background:var(--bg2);border:1px solid var(--line);text-align:left;
  }
  .qbtn:active{background:var(--bg3)}
  .qbtn .qi{width:15px;height:15px;flex-shrink:0;stroke:var(--teal);stroke-width:2;fill:none}
  .qbtn .qt{flex:1;min-width:0;display:flex;flex-direction:column}
  .qbtn .q1{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .qbtn .q2{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .qbtn .qn{font-size:12px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;flex-shrink:0}
  .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);
    font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  main{flex:1;overflow-y:auto;padding:0 20px 108px;scrollbar-width:none;position:relative}
  main::-webkit-scrollbar{display:none}
  .screen{display:none}
  .screen.active{display:block}
  h1{font-size:25px;font-weight:700;letter-spacing:-.025em;margin:10px 0 3px}
  .sub{font-size:13px;color:var(--dim);margin-bottom:16px;line-height:1.45}
  .empty{padding:44px 20px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.6;
    background:var(--bg2);border-radius:16px;margin-top:12px}

  /* ── the deck ─────────────────────────────────────────── */
  .deckwrap{position:relative;padding-top:6px;touch-action:pan-y}
  .deckbar{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .deckbar .prog{flex:1;height:3px;border-radius:2px;background:var(--bg3);overflow:hidden}
  .deckbar .prog i{display:block;height:100%;background:var(--teal);border-radius:2px;transition:width .3s}
  .card{
    background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:16px 17px 17px;
    box-shadow:var(--shadow);will-change:transform;position:relative;
  }
  .card.snap{transition:transform .26s cubic-bezier(.22,1,.36,1)}
  .hint{
    position:absolute;top:16px;padding:5px 11px;border-radius:9px;font-size:11px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .1s;
  }
  .hint.l{left:14px;background:var(--bg3);color:var(--dim)}
  .hint.r{right:14px;background:var(--teal);color:#fff}

  .vbadge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;
    font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .vbadge.ok{background:rgba(18,160,101,.12);color:var(--green)}
  .vbadge.check{background:rgba(199,120,0,.13);color:var(--amber)}
  .vbadge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  .warn{margin-top:12px;background:rgba(199,120,0,.09);border-left:3px solid var(--amber);
    border-radius:0 10px 10px 0;padding:10px 12px;font-size:12.5px;line-height:1.5;color:var(--ink)}
  .warn b{color:var(--amber)}
  .cardtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .intake{display:flex;flex-direction:column;align-items:flex-end;font-size:15px;font-weight:750;
    letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
  .intake i{font-style:normal;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--dim);font-weight:700;margin-top:2px}
  .asks{margin-top:13px;padding:13px 14px;background:var(--bg2);border-radius:13px}
  .asks .ol{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--teal);
    font-weight:750;margin-bottom:8px}
  .asks ol{margin:0;padding-left:17px}
  .asks li{font-size:13.5px;line-height:1.42;font-weight:500;margin-bottom:7px}
  .asks li:last-child{margin-bottom:0}
  .asks li::marker{color:var(--dim);font-weight:700;font-size:11px}
  /* The numbers do the arguing. Three sourced figures, nothing estimated. */
  .numstrip{display:flex;gap:7px;margin-top:12px}
  .numstrip div{flex:1;background:var(--bg2);border-radius:12px;padding:10px 9px;text-align:center}
  .numstrip b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .numstrip i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--dim);font-weight:750;margin-top:4px}
  .numstrip .good b{color:var(--green)}
  /* One question. Not a discovery script — the thing you say after they say hello. */
  .theask{margin-top:12px;padding:15px 15px 13px;background:var(--bg2);border-radius:13px;
    border-left:3px solid var(--teal)}
  .theask .ol{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--teal);
    font-weight:750;margin-bottom:9px}
  .theask q{display:block;font-size:16.5px;line-height:1.38;font-weight:650;quotes:'"' '"'}
  .theask .then{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    font-size:13px;line-height:1.4;color:var(--dim);font-weight:550}
  .theask .then b{color:var(--fg);font-weight:700}
  /* ── LIST MODE. Every number on one screen. Chase asked for the sheet of numbers
     back: scan it, tap one, see who they are and the two ways to open. */
  .found{margin-top:10px;padding:10px 12px;background:var(--bg2);border-radius:11px;
    font-size:12.5px;line-height:1.45;color:var(--dim)}
  .found b{color:var(--fg);font-weight:750}
  .found a{color:var(--teal);font-weight:700}
  .linkbox{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--bg2);
    border:1px solid var(--line);border-radius:12px}
  .linkbox span{flex:1;font-size:15px;font-weight:750;letter-spacing:-.01em;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .modesw{display:flex;gap:4px;background:var(--bg3);border-radius:9px;padding:3px}
  .modesw button{border:0;background:none;color:var(--dim);font:inherit;font-size:10px;
    font-weight:750;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;
    border-radius:7px;cursor:pointer}
  .modesw button.on{background:var(--bg);color:var(--fg);box-shadow:var(--shadow)}
  .lrow{background:var(--bg);border:1px solid var(--line);border-radius:15px;margin-bottom:7px;
    overflow:hidden}
  .lrow.done{opacity:.45}
  .lhead{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer}
  .lhead .lnum{font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .lhead .lbiz{flex:1;min-width:0}
  .lhead .lbiz b{display:block;font-size:13px;font-weight:700;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .lhead .lbiz span{display:block;font-size:11px;color:var(--dim);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lpay{font-size:11px;font-weight:800;color:var(--green);white-space:nowrap}
  .lbody{padding:0 13px 13px;border-top:1px solid var(--line)}
  .lfact{font-size:12.5px;line-height:1.5;margin-top:10px}
  .lfact b{color:var(--dim);font-weight:700;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;display:block;margin-bottom:2px}
  .lopen{display:block;width:100%;text-align:left;margin-top:9px;padding:11px 12px;
    background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--teal);
    border-radius:11px;color:inherit;font:inherit;cursor:pointer}
  .lopen i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--teal);font-weight:750;margin-bottom:5px}
  .lopen q{display:block;font-size:14px;line-height:1.4;font-weight:600;quotes:'"' '"'}
  .lacts{display:flex;gap:7px;margin-top:11px}
  .lacts a,.lacts button{flex:1;text-align:center;padding:12px;border-radius:12px;border:0;
    font:inherit;font-size:12.5px;font-weight:750;cursor:pointer}
  .lacts .lcall{background:var(--teal);color:#fff}
  .lacts .lcard{background:var(--bg2);color:var(--dim)}
  .altcall{display:block;text-align:center;margin-top:7px;padding:10px;border-radius:12px;
    background:var(--bg2);font-size:12.5px;font-weight:650;color:var(--dim)}
  details.meta{margin-top:11px}
  details.meta summary{list-style:none;font-size:11px;font-weight:700;color:var(--dim);
    letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;gap:6px}
  details.meta summary::-webkit-details-marker{display:none}
  details.meta summary::before{content:"›";font-size:14px;transition:transform .2s;display:inline-block}
  details.meta[open] summary::before{transform:rotate(90deg)}
  details.meta p{font-size:13.5px;line-height:1.5;margin-top:9px;padding:11px 13px;
    background:var(--bg2);border-radius:11px}
  .cname{font-size:26px;font-weight:750;letter-spacing:-.03em;line-height:1.1;margin:10px 0 3px}
  .cbiz{font-size:14.5px;font-weight:600;line-height:1.35}
  .cmeta{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
  .cmeta b{color:var(--ink);font-weight:650}
  .opener{margin-top:14px;padding:13px 14px;background:var(--bg2);border-radius:13px}
  .opener .ol{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:5px}
  .opener p{font-size:14px;line-height:1.5;font-weight:500}
  .srcline{margin-top:8px;font-size:11px;color:var(--dim);line-height:1.5}
  .srcline a{color:var(--teal);font-weight:600;border-bottom:1px solid rgba(15,141,132,.3)}

  .callbtn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;
    padding:15px;border-radius:16px;background:var(--green);color:#fff;font-size:17px;font-weight:700;
    letter-spacing:-.01em;box-shadow:0 5px 16px rgba(18,160,101,.28);
  }
  .callbtn:active{transform:scale(.985)}
  .callbtn svg{width:19px;height:19px;stroke:#fff;stroke-width:2.1;fill:none}
  .callbtn small{display:block;font-size:11.5px;opacity:.82;font-weight:600;letter-spacing:.02em;margin-top:1px}

  .theask .why{display:block;margin-top:7px;font-size:11.5px;color:var(--dim);font-weight:500}
  /* Smaller cards (Chase, 2026-09-24): the card was a poster. Same content, tighter. */
  .card{padding:12px 13px 13px;border-radius:17px}
  .cname{font-size:19px;margin:7px 0 2px}
  .cbiz{font-size:13px}
  .cmeta{font-size:11.5px;margin-top:3px}
  .found{margin-top:8px;padding:8px 10px;font-size:11.5px}
  .theask{margin-top:9px;padding:10px 11px 9px}
  .theask .ol{margin-bottom:5px}
  .theask q{font-size:14px}
  .theask .then{margin-top:7px;padding-top:7px;font-size:12px}
  .callbtn{margin-top:10px;padding:10px;border-radius:13px;font-size:15px}
  .sec{margin-top:13px}
  .seclab{margin-bottom:6px}
  .dbtn{padding:9px 2px;border-radius:10px}
  .lhead{padding:8px 11px;gap:9px}
  .lhead .lnum{font-size:14px}
  .lrow{border-radius:11px;margin-bottom:5px}

  /* ── DESKTOP. Every lead on the left, the clicked one on the right: who, the opening
     line, call, text. Nothing else competes for the eye while the phone is ringing. */
  .split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
  .split .llist{max-height:calc(100vh - 210px);overflow-y:auto;padding-right:4px}
  .split .lrow.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
  .pane{position:sticky;top:0;background:var(--bg);border:1px solid var(--line);border-radius:17px;
    padding:18px 20px;max-height:calc(100vh - 210px);overflow-y:auto}
  .pane .cname{font-size:22px;margin-top:0}
  .pane .theask q{font-size:17px}
  .pane .row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
  .pane .row2 a,.pane .row2 button{padding:10px 6px;border-radius:11px;background:var(--bg2);
    border:1px solid var(--line);font-size:12.5px;font-weight:700;text-align:center;cursor:pointer}
  .pane .txt{margin-top:6px;font-size:12px;line-height:1.45;color:var(--dim);background:var(--bg2);
    border-radius:10px;padding:8px 10px}
  @media (min-width:1000px){
    body{padding:16px}
    .device{max-width:1280px;height:calc(100vh - 32px);max-height:none;border-radius:22px;
      box-shadow:0 20px 60px rgba(0,0,0,.18)}
    main{padding:0 24px 96px}
  }

  /* ── outcome ──────────────────────────────────────────── */
  .sec{margin-top:20px}
  .seclab{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);font-weight:750;margin-bottom:9px}
  .grid5{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .dbtn{padding:13px 2px;border-radius:13px;border:1px solid var(--line);background:var(--bg);
    color:var(--dim);font-size:10.5px;font-weight:750;line-height:1.25}
  .dbtn:active{transform:scale(.95)}
  .dbtn.on{border-color:transparent;color:#fff}
  .dbtn.na.on,.dbtn.vm.on{background:var(--dim)}
  .dbtn.ni.on{background:var(--red)} .dbtn.int.on{background:var(--amber)} .dbtn.bk.on{background:var(--green)}
  .glbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;border-radius:14px;border:1.5px solid var(--green);background:rgba(18,160,101,.08);color:var(--green);font-size:12.5px;font-weight:800;letter-spacing:.3px;margin-bottom:10px;cursor:pointer;transition:all .15s ease}
  .glbtn:active{transform:scale(.98)}
  .glbtn.on{background:var(--green);color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(18,160,101,.4)}
  .glbtn .gldot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
  .killrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .kbtn{padding:11px 2px;border-radius:12px;border:1px dashed var(--line);background:none;
    color:var(--dim);font-size:10.5px;font-weight:700;line-height:1.25}
  .kbtn.on{background:var(--red);color:#fff;border-color:transparent;border-style:solid}
  .cbrow{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .cbbtn{padding:8px 13px;border-radius:16px;border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--dim)}
  .cbbtn.on{background:var(--blue);color:#fff;border-color:transparent}
  .note-in,.url-in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    font-size:13.5px;padding:11px 13px;outline:none;margin-top:9px}
  .note-in:focus,.url-in:focus{border-color:var(--teal)}

  /* ── send strip ───────────────────────────────────────── */
  .sendgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .sbtn{display:flex;flex-direction:column;gap:2px;padding:12px 13px;border-radius:14px;
    background:var(--bg2);border:1px solid var(--line);text-align:left}
  .sbtn:active{background:var(--bg3)}
  .sbtn .t{font-size:13px;font-weight:700}
  .sbtn .d{font-size:11px;color:var(--dim);line-height:1.3}
  .sbtn.hot{background:var(--pill);border-color:transparent}
  .sbtn.hot .t{color:var(--pill-ink)} .sbtn.hot .d{color:rgba(255,255,255,.6)}
  [data-theme="dark"] .sbtn.hot .d{color:rgba(0,0,0,.55)}
  .sbtn.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
  .sbtn[disabled]{opacity:.42;pointer-events:none}

  .demobox{margin-top:9px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--bg2)}
  .demobox .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .demobox .dt{font-size:12.5px;font-weight:700}
  .demobox .ds{font-size:11px;color:var(--dim);line-height:1.45}
  .demolink{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    margin-top:8px;font-size:11.5px;color:var(--teal);font-weight:600;word-break:break-all;line-height:1.4}
  .mini{padding:7px 12px;border-radius:10px;background:var(--pill);color:var(--pill-ink);
    font-size:11.5px;font-weight:700;flex-shrink:0}
  .mini.ghost{background:none;border:1px solid var(--line);color:var(--ink)}

  details.script{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  details.script summary{list-style:none;font-size:12.5px;font-weight:700;color:var(--dim);
    display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  details.script summary::-webkit-details-marker{display:none}
  details.script summary::after{content:"＋";font-size:15px}
  details.script[open] summary::after{content:"−"}
  .prose h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:14px 0 4px;font-weight:750}
  .prose p{font-size:13.5px;line-height:1.55;color:var(--ink)}

  /* ── working ──────────────────────────────────────────── */
  .wcard{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;

// ════════════════ HELPERS ════════════════
const $ = id => document.getElementById(id);
function key(l){ return (l.business_name||"") + "|" + (l.phone||""); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function jsq(s){ return String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function fmtPhone(p){ const d=String(p||"").replace(/\D/g,""); return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:p; }
function telHref(p){ return "tel:"+String(p||"").replace(/[^\d+]/g,""); }
function smsHref(p, body){
  const n=String(p||"").replace(/[^\d+]/g,"");
  const sep=/iPhone|iPad|Mac/i.test(navigator.userAgent)?"&":"?";
  return `sms:${n}${sep}body=${encodeURIComponent(body)}`;
}
function nlabel(c){ return (NICHE[c]||{}).label || c || ""; }
function inWindow(c){
  const w=(NICHE[c]||{}).win||DEFAULT_WIN, n=new Date(), h=n.getHours()+n.getMinutes()/60;
  return w.some(([a,b])=>h>=a&&h<b);
}
function closedToday(l){
  const days=l.closed_days||[]; if(!days.length) return false;
  return days.includes(["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()]);
}
function ago(iso){
  const m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(m<60) return m+"m"; const h=Math.floor(m/60);
  return h<24 ? h+"h" : Math.floor(h/24)+"d";
}
function firstName(l){
  const n=(l.owner_name||"").trim();
  return n ? n.split(" ")[0] : null;
}
// The opener only asserts a name the verify pass actually sourced. A name that
// was lifted off the sign gets asked, not assumed — "is this Mike?" is right
// whether or not Mike picks up. Assuming it is what "wrong name" felt like.
function greet(l){
  const v=l.verify||{};
  return (v.opener==="named" && firstName(l)) ? firstName(l) : null;
}
function askName(l){
  const v=l.verify||{};
  return (v.opener==="ask" && firstName(l)) ? firstName(l) : null;
}
function openLine(l, who){
  if(isAeo(l)){
    const a=l.aeo||{}, comp=(a.competitors||[]).slice(0,2);
    const q=`best ${AEO_NOUN[l.category]||nlabel(l.category)} in ${a.query||l.city}`;
    return `"Hey — is the owner around? … ${who}, I'll be quick. I'm a student, I do AI search visibility for ${esc(nlabel(l.category).replace(" (AI)","").toLowerCase())} companies. Honestly I don't Google anymore — I asked Claude '${esc(q)}' this morning and you weren't in the answer. ${comp.length?esc(comp.join(" and "))+" were.":""} Got twenty seconds?"`;
  }
  // Google Maps roofers (2026-09-28): Noah Haupt's honest pattern interrupt, the same line the
  // dash dialer uses. The owner name is a Sunbiz officer record, so it is asked, never assumed.
  if(l.pool==="maps"){
    const f=firstName(l);
    return f ? `"Hey, is this ${esc(f)}? … ${esc(f)}, my name's ${who}. I'll be completely honest, this is a cold call. Do you have 15 seconds?"`
             : `"Hey, is this the owner at ${esc(l.business_name||"")}? … My name's ${who}. I'll be completely honest, this is a cold call. Do you have 15 seconds?"`;
  }
  // The opener asks about the phone, not a website. We stopped selling websites 2026-09-23.
  const n=greet(l), a=askName(l), q=questions(l).ask;
  if(n) return `"Hey ${esc(n)}, this is ${who} — I'll be quick. ${esc(q)}"`;
  if(isHiring(l)&&isMedical(l)) return `"Hi, is this the office manager? This is ${who}, I'll be quick. ${esc(q)}"`;
  if(a) return `"Hey — is this ${esc(a)}? This is ${who}, I'll be quick. ${esc(q)}"`;
  return `"Hey, is this the owner of ${esc(l.business_name||"")}? This is ${who}, I'll be quick. ${esc(q)}"`;
}

// Rough yearly intake, recomputed from the one number that has a source.
// The old corpus stored est_revenue_annual as a flat field with no visible
// derivation, which made an assumption look like a fact. This shows its work.
function intake(l){
  const rc=l.review_count||0; if(!rc) return null;
  const t=TICKET[l.category]||TICKET.default;
  const yr=rc*JOBS_PER_REVIEW*t;
  return { yr, t, jobs:rc*JOBS_PER_REVIEW,
    pretty: yr>=1e6 ? "$"+(yr/1e6).toFixed(1)+"M" : "$"+Math.round(yr/1000)+"k" };
}

// The opener is a question, not a pitch. Every one of these has exactly one
// honest answer — "a website" — and the owner says it out loud instead of
// hearing it from a stranger. That is the whole play.
const URGENT = { towing:"a tow", mobile_mechanic:"a mechanic at the roadside",
  appliance_repair:"a fridge fixed tonight", tree_service:"a limb off their roof",
  junk_removal:"a cleanout booked", pressure_washing:"a quote before a closing",
  lawn_care:"a yard cut before Saturday", handyman:"something fixed today",
  car_detailing:"a car detailed before the weekend" };

// Two ways to start, because one script for every pickup is how you sound like a script.
// A is the evidence they published. B is the question that makes them say the problem
// out loud — it works on a lead that published nothing, which is most of them.
function openers(l){
  if(isAeo(l)){
    const a=l.aeo||{}, comp=(a.competitors||[]).slice(0,2);
    return [
      {tag:"The AI check", line:`I asked Claude "best ${AEO_NOUN[l.category]||nlabel(l.category)} in ${a.query||l.city}" this morning and you weren't in the answer.${comp.length?" "+comp.join(" and ")+" were.":""} Got twenty seconds?`},
      {tag:"The Google gap", line:`You're paying Google to sit at the top — and the customer who asks AI instead never sees Google at all. Can I send you what I found?`},
    ];
  }
  if(isHiring(l)){
    if(isMedical(l)) return [
      {tag:"Busy front desk", line:`When the front desk is checking someone in and the phone rings — where does that call go?`},
      {tag:"After hours", line:`What time does the office close? … And a new patient who calls after that — what happens?`},
    ];
    return [
      {tag:"Busy phones", line:`When everyone's tied up and the phone rings — where does that call go?`},
      {tag:"After hours", line:`What time do you guys close? … And where do those calls go after that?`},
    ];
  }
  return [
    {tag:"After hours", line:`What time do you guys close? … And where do those calls go after that?`},
    {tag:"Their own number", line:`How many calls a week do you figure you're missing? … That's the part I fix.`},
  ];
}

function questions(l){
  if(isAeo(l)){
    const a=l.aeo||{}, comp=(a.competitors||[]);
    return {
      ask: `When somebody asks ChatGPT "who's the best ${AEO_NOUN[l.category]||nlabel(l.category)} in ${a.query||l.city}" — do you know who it names?`,
      then: comp.length?`It's <b>${comp.slice(0,2).join(" and ")}</b>. Not you. Checked ${a.of||3} ways this morning.`
                       :`It isn't you — checked ${a.of||3} ways this morning.`,
    };
  }
  if(isHiring(l)){
    if(isMedical(l)) return {
      ask: `When the front desk is checking someone in and the phone rings, where does that call go?`,
      then: `Then: <b>"How many go to voicemail on a busy morning?"</b> → <b>"A new patient who hits voicemail — do they leave a message, or call the next office?"</b> Let them say it.
        <br><span class="why">If they ask how you found them: "Saw you're hiring for the front desk — figured the phones are stretched."</span>`,
    };
    return {
      ask: `When everyone's tied up and the phone rings, where does that call go?`,
      then: `Then: <b>"How many a week go to voicemail?"</b> → <b>"Does that caller leave a message, or call the next place?"</b> Let them say it.
        <br><span class="why">If they ask how you found them: "Saw you're hiring someone for the phones."</span>`,
    };
  }
  return {
    ask: `What time do you guys close? … And where do those calls go after that?`,
    then: `Then: <b>"How many calls a week do you figure you're missing?"</b> Make them say the number. It is always higher than they expect, and it is their number, not yours.`,
  };
}

  if(d && d.demoUrl) return d.demoUrl;              // one built + pasted back in
  const path=DEMO_PATHS[l.category]; if(!path) return null;
  const q=new URLSearchParams({name:l.business_name||"",phone:l.phone||"",city:l.city||"",
    rating:l.rating??"",reviews:l.review_count??""});
  return DEMO_BASE+path+"/?"+q.toString();
}
function buildCmd(l){
  const tpl=DEMO_BUILDABLE[l.category]||"detailing";
  const slug=(l.business_name||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  return `cd ~/claude/agency/clients && printf '%s\\n' `+
    `"BUSINESS_NAME=${(l.business_name||"").replace(/"/g,"")}" "CITY=${l.city||""}" `+
    `"PHONE=${fmtPhone(l.phone)}" "RATING=${l.rating??""}" "REVIEW_COUNT=${l.review_count??""}" `+
    `> /tmp/${slug}.env && ./build_site.sh ${tpl} ~/claude/r3-deploy/${slug}/index.html /tmp/${slug}.env`;
}

// ── telemetry ────────────────────────────────────────────────────────────
// A dial that is not logged did not happen. This page only ever wrote to
// localStorage, so "how many did you make yesterday" has never been an
// answerable question. Loopback only, fire-and-forget, silent when the
// display server is not running. Never let it break a call.
const DIAL_SINK="http://127.0.0.1:5090/dial";
function dialStats(){
  const now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const w0=new Date(d0); w0.setDate(d0.getDate()-((d0.getDay()+6)%7));
  let today=0,week=0,contacts=0,booked=0,bad=0,last=null;
  for(const k in results){
    const d=results[k]; if(!d||!d.ts) continue;
    const t=new Date(d.ts);
    if(!last||t>last) last=t;
    if(t>=w0) week++;
    if(t>=d0){
      today++;
      if(d.kill) bad++;
      else if(d.dispo && d.dispo!=="No Answer" && d.dispo!=="Voicemail") contacts++;
      if(d.dispo==="BOOKED") booked++;
    }
  }
  return {today,week,contacts,booked,bad,last:last?last.toISOString():null,rep};
}
function pushDial(){
  try{
    // The aggregate says how many. `results` says which lead and what happened —
    // without it a booking can never be traced back to the demo that earned it,
    // and clearing site data erases the only copy that exists.
    const body=JSON.stringify(Object.assign(dialStats(),{results}));
    fetch(DIAL_SINK,{method:"POST",headers:{"Content-Type":"application/json"},
      body,keepalive:true}).catch(()=>{});
  }catch(_){}
}
function saveQueue(){ localStorage.setItem("rr_queue",JSON.stringify(queue)); }

let dialMode = localStorage.getItem("rr_dialmode")==="list" ? "list"
             : localStorage.getItem("rr_dialmode")==="cards" ? "cards"
             : (window.matchMedia("(min-width:1000px)").matches ? "list" : "cards");
let listOpen = null;
function setDialMode(m){ dialMode=m; listOpen=null; localStorage.setItem("rr_dialmode",m); renderDial(); }
function toggleRow(k){ listOpen = (listOpen===k?null:k); renderDial(); }
function saveMeetings(){ localStorage.setItem("rr_meetings",JSON.stringify(meetings)); }
function rec(l, peek){ const k=key(l); return peek ? results[k] : (results[k]||(results[k]={})); }
function stageOf(d){ return (d&&d.stage) || (d&&d.dispo?"contacted":"new"); }
function advance(d,s){ if(STAGES.indexOf(s)>=STAGES.indexOf(stageOf(d))) d.stage=s; }
function armFollowup(d){
  if(STAGES.indexOf(stageOf(d))<STAGES.indexOf("pricing_sent") && !d.fuDue)
    d.fuDue=new Date(Date.now()+FOLLOWUP_HOURS*3600e3).toISOString();
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2100);
}

// ════════════════ THE QUEUE ════════════════
// Not a wall of filters. A playlist: pick the niches, in order, and dial.
// Only leads the verify gate cleared are ever in it.
function diallable(l){ const s=(l.verify||{}).status; return s==="ok"||s==="check"; }
function killed(l){ const d=rec(l,true); return !!(d&&d.kill); }

function niches(){
  const m={};
  leads.forEach(l=>{
    const o=m[l.category]||(m[l.category]={total:0,ready:0,warn:0,dead:0,left:0});
    o.total++;
    const s=(l.verify||{}).status;
    if(s==="ok") o.ready++;
    else if(s==="check") o.warn++;
    else o.dead++;
    if(diallable(l) && !killed(l) && !(rec(l,true)||{}).dispo) o.left++;
  });
  return m;
}
// The deck order is fixed the moment you start, and does NOT re-sort as you
// work. Sorting live meant logging an outcome silently swapped the card under
// you mid-call — you'd hit Interested and be looking at somebody else.
// Killed leads still drop out; nothing else moves until the queue changes.
let deckOrder = null;
function buildDeck(){
  // With no queue picked, hiring leads go first. They are the only records where the
  // business published the problem itself — burying them behind 1,000 licence-roll
  // numbers is how a found lead becomes a lead that was never called.
  const src = queue.length ? queue
    : Object.keys(niches()).sort((a,b)=>(a.indexOf("hiring:")===0?0:1)-(b.indexOf("hiring:")===0?0:1));
  const out = [];
  src.forEach(c=>{
    leads.filter(l=>l.category===c && diallable(l))
      .sort((a,b)=>{
        const da=rec(a,true)||{}, db=rec(b,true)||{};
        if(!!da.dispo !== !!db.dispo) return da.dispo?1:-1;          // uncalled first
        const oa=firstName(a)?0:1, ob=firstName(b)?0:1;
        if(oa!==ob) return oa-ob;                                     // a name to ask for first (2026-09-28)
        const sa=(a.verify||{}).status==="ok"?0:1, sb=(b.verify||{}).status==="ok"?0:1;
        if(sa!==sb) return sa-sb;                                     // clean before caveated
        return (b.review_count||0)-(a.review_count||0);
      }).forEach(l=>out.push(key(l)));
  });
  deckOrder = out;
  return out;
}
function queueLeads(){
  const order = deckOrder || buildDeck();
  const byKey = {};
  leads.forEach(l=>{ byKey[key(l)]=l; });
  return order.map(k=>byKey[k]).filter(l=>l && diallable(l) && !killed(l));
}
function queueName(){
  if(!queue.length) return "Everything verified";
  return queue.map(nlabel).join(" → ");
}
function renderQueueBtn(){
  $("qName").textContent = queueName();
  const left = queueLeads().filter(l=>!(rec(l,true)||{}).dispo).length;
  $("qLeft").textContent = left ? left+" left" : "";
}
function openQueue(){
  const m=niches();
  const order=Object.keys(NICHE).filter(c=>m[c]);
  $("queueRows").innerHTML = order.map(c=>{
    const o=m[c], pos=queue.indexOf(c);
    const bits=[];
    if(o.ready) bits.push(`<b>${o.ready} ready</b>`);
    if(o.warn)  bits.push(`<span class="warnn">${o.warn} with a caveat</span>`);
    if(o.dead)  bits.push(`<span class="deadn">${o.dead} held back</span>`);
    return `<button class="qrow ${pos>=0?"on":""} ${o.ready+o.warn?"":"zero"}" onclick="toggleQ('${c}')">
      <span class="qord">${pos>=0?pos+1:"+"}</span>
      <span class="b"><span class="t">${NICHE[c].label}</span>
      <span class="d">${bits.join(" · ")||"nothing verified yet"}</span></span>
      <span class="qn">${o.left||""}</span></button>`;
  }).join("");
  const picked=queue.reduce((n,c)=>n+((m[c]||{}).ready||0)+((m[c]||{}).warn||0),0);
  const total=Object.values(m).reduce((n,o)=>n+o.ready+o.warn,0);
  $("queueSub").textContent = queue.length
    ? `${picked} verified ${picked===1?"lead":"leads"} in this playlist.`
    : `Tap niches in the order you want to work them. ${total} verified across all of them.`;
  const held=Object.values(m).reduce((n,o)=>n+o.dead,0);
  $("queueNote").innerHTML = `<b>${total} of ${leads.length}</b> leads cleared the verify gate. `+
    `${held} are held back — no source URL, wrong market, or reported closed. `+
    `They never enter the deck. Run <b>verify.py</b> after every scrape.`;
  $("queueGo").textContent = queue.length ? `Start dialing — ${picked} leads` : "Dial everything verified";
  openSheet("queueSheet");
}
function toggleQ(c){
  const i=queue.indexOf(c);
  if(i>=0) queue.splice(i,1); else queue.push(c);
  deckOrder=null; saveQueue(); openQueue();
}
function clearQueue(){ queue=[]; deckOrder=null; saveQueue(); openQueue(); }
function startQueue(){
  idx=0; deckOrder=null; buildDeck(); saveQueue(); closeSheet(); go("dial"); renderQueueBtn();
  toast(queue.length ? "Queue set — "+queueName() : "Dialing everything verified");
}

// ════════════════ THE DECK ════════════════
// Getting the link to them. Three routes on purpose: Chase's carrier SMS is unreliable
// as of 2026-09-24 (iMessage deregistered, two failed sends), so a card that offers only
// "Text it" offers nothing on a bad day. Email goes out through Mail and does not touch
// the carrier at all, and the link is printed in full because the fastest route on a live
// call is reading twenty-one characters out loud while they are still on the phone.
// Where this number came from, in one line. A lead that published a job ad is a
// different call from one pulled off a licence roll, and that is the only thing about
// the lead Chase needs before the phone rings.
function foundLine(l){
  if(isAeo(l)) return `<div class="found"><b>Running Google Ads</b> · invisible in AI answers</div>`;
  if(isHiring(l)){
    const m=(l.source||"").match(/(\d{4})-(\d{2})-(\d{2})/);
    const url=(l.source||"").split(" — ")[1] || "";
    let age="";
    if(m){
      const n=Math.round((Date.now()-new Date(+m[1],+m[2]-1,+m[3]).getTime())/864e5);
      age = n<=0?"today":n===1?"1 day ago":n+" days ago";
    }
    const pay=payOf(l);
    return `<div class="found"><b>Found on Indeed</b> — they posted a
      ${esc(l.posted_role||"front desk")} job${age?" "+age:""}${pay?`, about $${pay.toLocaleString()}/yr`:""}.
      ${url?`<a href="${esc(url)}" target="_blank" rel="noopener">read the post</a>`:""}</div>`;
  }
  if(l.pool==="maps"){
    const st=l.review_count?`${l.rating||"?"}★ from ${l.review_count} reviews`:"no reviews yet";
    return `<div class="found"><b>Google Maps</b> · ${esc(st)}${l.owner_name?` · owner on Sunbiz: <b>${esc(l.owner_name)}</b>`:" · no owner on record, ask for the owner"}</div>`;
  }
  return `<div class="found"><b>Florida licence roll</b> — they have published nothing.
    Lead with the after-hours question.</div>`;
}

function sendLink(l, live){
  const who = greet(l) || askName(l) || "there";
  const biz = l.business_name || "your business";
  const sms = `Hey ${who}, it's Garrett — here's the link, grab any time that works: ${BOOK_LINK}`;
  const subj = `That link — ${biz}`;
  const body = `Hey ${who},\n\nGreat talking. Grab whatever time works:\n${BOOK_LINK}\n\n`
             + `Quick recap: every call ${biz} misses gets a text back in 60 seconds and books `
             + `itself in. You see each one logged.\n\nGarrett`;
  return `<div class="sec">
    <div class="seclab">Send them the link${live?" — don't let it cool off":""}</div>
    <div class="linkbox">
      <span>${esc(BOOK_LINK.replace("https://",""))}</span>
      <button class="mini ghost" onclick="copyText('${jsq(BOOK_LINK)}');toast('Link copied')">Copy</button>
    </div>
    <div class="grid3" style="margin-top:8px">
      <a class="dbtn" href="${smsHref(l.phone, sms)}" onclick="sent('book')">Text it</a>
      <a class="dbtn" href="mailto:?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}"
         onclick="sent('book')">Email it</a>
      <button class="dbtn" onclick="copyText('${jsq(BOOK_LINK)}');toast('Read it to them')">Say it</button>
    </div>
    ${live?`<button class="sbtn hot wide" style="margin-top:8px" onclick="bookIt()">
      <span class="t">They picked a time — put it in my calendar</span></button>`:""}
  </div>`;
}

function modeSwitch(){
  return `<span class="modesw">
    <button class="${dialMode==="cards"?"on":""}" onclick="setDialMode('cards')">Cards</button>
    <button class="${dialMode==="list"?"on":""}" onclick="setDialMode('list')">List</button>
  </span>`;
}

// The sheet of numbers. Scan it, tap one, and the row tells you who picks up, what they
// published, and the two ways to open. Everything here is sourced — no estimate, no
// invented owner name. A lead with a dispo logged is dimmed, not hidden: the deck is a
// record of the day, and hiding worked rows makes a short list look shorter than it is.
function isWide(){ return window.matchMedia("(min-width:1000px)").matches; }
function renderList(v, list){
  if(isWide()) return renderSplit(v, list);
  const rows = list.map((l,i)=>{
    const k=key(l), d=rec(l,true)||{}, vf=l.verify||{}, pay=payOf(l);
    const open = listOpen===k;
    const who = greet(l) || (askName(l)?askName(l)+" (off the sign — ask, don't assume)":null);
    const m=(l.source||"").match(/(\d{4})-(\d{2})-(\d{2})/);
    let age="";
    if(m && isHiring(l)){
      const n=Math.round((Date.now()-new Date(+m[1],+m[2]-1,+m[3]).getTime())/864e5);
      age = n<=0?"posted today":n===1?"posted 1 day ago":"posted "+n+" days ago";
    }
    const src=(l.source||"").split(" — ")[1] || (vf.sources||[])[0] || "";
    const warns=(vf.flags||[]).filter(f=>f.status==="check");
    return `<div class="lrow ${d.dispo?"done":""}">
      <div class="lhead" onclick="toggleRow('${jsq(k)}')">
        <span class="lnum">${String(i+1).padStart(2,"0")}</span>
        <span class="lbiz"><b>${esc(l.business_name||"?")}</b>
          <span>${esc(fmtPhone(l.phone))} · ${esc(l.city||"")}${
            isHiring(l)&&l.posted_role?" · "+esc(l.posted_role):""}</span></span>
        ${pay?`<span class="lpay">$${Math.round(pay/1000)}k</span>`:""}
        ${d.dispo?`<span class="lpay" style="color:var(--dim)">${esc(d.dispo)}</span>`:""}
      </div>
      ${open?`<div class="lbody">
        <div class="lfact"><b>Who picks up</b>${who?esc(who):"No name published — \u201cis this the owner?\u201d"}</div>
        ${isHiring(l)?`<div class="lfact"><b>What they published</b>
          Hiring a ${esc(l.posted_role||"front desk")}${pay?` at about $${pay.toLocaleString()}/yr`:""}${age?` · ${age}`:""}.
          ${esc(l.why_on_list||"")}</div>`:""}
        ${warns.map(f=>`<div class="warn" style="margin-top:9px"><b>Before you dial:</b> ${esc(f.why)}</div>`).join("")}
        ${src?`<div class="lfact"><b>Source</b><a href="${esc(src)}" target="_blank" rel="noopener">${esc(src.slice(0,60))}</a></div>`:""}
        ${openers(l).map(o=>`<div class="lopen"><i>${esc(o.tag)}</i><q>${esc(o.line)}</q></div>`).join("")}
        <div class="lacts">
          <a class="lcall" href="${telHref(l.phone)}" onclick="jumpTo(${i});markCalled()">Call ${esc(fmtPhone(l.phone))}</a>
          <button class="lcard" onclick="jumpTo(${i});setDialMode('cards')">Full card</button>
        </div>
      </div>`:""}
    </div>`;
  }).join("");
  v.innerHTML = `<div class="deckwrap">
    <div class="deckbar"><span>${list.length} numbers</span>
      <span class="prog"><i style="width:${list.filter(l=>(rec(l,true)||{}).dispo).length/list.length*100}%"></i></span>
      ${modeSwitch()}</div>
    ${rows}
  </div>`;
}
function jumpTo(i){ idx=i; }

// Desktop: the whole list, and one lead in focus. Picks the first unworked lead
// so the pane is never empty on load.
function renderSplit(v, list){
  let sel = list.find(l=>key(l)===listOpen);
  if(!sel){ sel = list.find(l=>!(rec(l,true)||{}).dispo) || list[0]; listOpen = key(sel); }
  const si = list.indexOf(sel); idx = si;
  const rows = list.map((l,i)=>{
    const k=key(l), d=rec(l,true)||{}, pay=payOf(l);
    return `<div class="lrow ${d.dispo?"done":""} ${k===listOpen?"sel":""}">
      <div class="lhead" onclick="pickRow('${jsq(k)}')">
        <span class="lnum">${String(i+1).padStart(2,"0")}</span>
        <span class="lbiz"><b>${esc(l.business_name||"?")}</b>
          <span>${esc(fmtPhone(l.phone))} · ${esc(l.city||"")}${
            isHiring(l)&&l.posted_role?" · "+esc(l.posted_role):""}</span></span>
        ${d.dispo?`<span class="lpay" style="color:var(--dim)">${esc(d.dispo)}</span>`:pay?`<span class="lpay">$${Math.round(pay/1000)}k</span>`:""}
      </div></div>`;
  }).join("");
  const l=sel, d=rec(l,true)||{}, vf=l.verify||{}, M=msgs(l);
  const name=greet(l), ask=askName(l);
  const warns=(vf.flags||[]).filter(f=>f.status==="check");
  const who = rep===REP_DEFAULT?"Garrett":esc(rep);
  const pane = `<div class="pane">
    <div class="cname">${esc(l.business_name||"")}</div>
    <div class="cmeta">${esc(fmtPhone(l.phone))} · ${esc(l.city||"")}${name?` · ask for <b>${esc(name)}</b>`:ask?` · maybe <b>${esc(ask)}</b>?`:""}</div>
    ${foundLine(l)}
    ${warns.map(f=>`<div class="warn"><b>Before you dial:</b> ${esc(f.why)}</div>`).join("")}
    <div class="theask">
      <div class="ol">Open with this — then stop talking</div>
      <q>${openLine(l, who).replace(/^"|"$/g,"")}</q>
      <div class="then">${questions(l).then}</div>
    </div>
    <a class="callbtn" href="${telHref(l.phone)}" onclick="markCalled()">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      <span>Call ${esc(fmtPhone(l.phone))}</span></a>
    <div class="sec">
      <div class="seclab">Text them</div>
      <div class="row2">
        <a href="${smsHref(l.phone, M.book.body)}" onclick="sent('book')">Booking link</a>
        <a href="${smsHref(l.phone, M.postvm.body)}" onclick="sent('postvm')">Missed-call text</a>
        <button onclick="copyText('${jsq(BOOK_LINK)}');toast('Link copied')">Copy link</button>
      </div>
      <div class="txt"><b>Missed-call text:</b> ${esc(M.postvm.body)}</div>
    </div>
    <div class="sec">
      <div class="seclab">How did the call go?</div>
      <div class="grid5">${DISPOS.map(([c,short,full])=>
        `<button class="dbtn ${c} ${d.dispo===full?"on":""}" onclick="setDispo('${full}')">${short}</button>`).join("")}
        <button class="dbtn ${d.kill==="bad_number"?"on":""}" onclick="setKill('bad_number')">Bad #</button></div>
      <input class="note-in" placeholder="One line — what they actually said…"
        value="${esc(d.note||"")}" onchange="setNote(this.value)">
    </div>
    <details class="meta"><summary>More texts · objections</summary>
      ${Object.entries(M).filter(([k])=>k!=="book"&&k!=="postvm").map(([k,m])=>
        `<a class="txt" style="display:block" href="${smsHref(l.phone,m.body)}" onclick="sent('${k}')"><b>${esc(m.label)}:</b> ${esc(m.body)}</a>`).join("")}
      ${isAeo(l)?aeoScript(l):isHiring(l)?hiringScript(l):""}
    </details>
  </div>`;
  v.innerHTML = `<div class="deckwrap">
    <div class="deckbar"><span>${list.length} numbers</span>
      <span class="prog"><i style="width:${list.filter(l=>(rec(l,true)||{}).dispo).length/list.length*100}%"></i></span>
      ${modeSwitch()}</div>
    <div class="split"><div class="llist">${rows}</div>${pane}</div>
  </div>`;
}
function pickRow(k){ listOpen=k; renderDial(); }
window.addEventListener("resize",(()=>{let w=isWide();return ()=>{if(isWide()!==w){w=isWide();if(dialMode==="list")renderDial();}};})());

function renderDial(){
  const v=$("scr-dial"), list=queueLeads();
  if(!list.length){
    v.innerHTML = `<h1>Nothing in the deck</h1>
      <div class="sub">Every lead in this playlist is either worked, killed, or held back by the verify gate.</div>
      <div class="empty">Pick different niches, or run <b>verify.py</b> on more leads
      so they can enter the deck.<br><br>
      <button class="mini" onclick="openQueue()">Change the queue</button></div>`;
    return;
  }
  if(dialMode==="list") return renderList(v, list);

// ════════════════ SWIPE ════════════════
// The whole deck is one gesture. No Prev, no Next — drag the card. Mouse drag
// works too, so it behaves the same on the laptop as on the phone.
function armSwipe(){
  const card=$("card"), wrap=$("deckwrap"); if(!card) return;
  const hL=$("hintL"), hR=$("hintR");
  let x0=null, dx=0, id=null;
  const TH=72;

  const down=e=>{
    if(e.target.closest("input,select,textarea,details,a,button")) return;
    if(e.pointerType==="mouse" && e.button!==0) return;
    x0=e.clientX; dx=0; id=e.pointerId;
    card.classList.remove("snap"); card.setPointerCapture(id);
  };
  const move=e=>{
    if(x0===null||e.pointerId!==id) return;
    dx=e.clientX-x0;
    const r=Math.max(-1,Math.min(1,dx/160));
    card.style.transform=`translateX(${dx*.62}px) rotate(${r*2.2}deg)`;
    hR.style.opacity = dx<-TH?1:0;   // dragging left reveals "Next"
    hL.style.opacity = dx> TH?1:0;
  };
  const up=e=>{
    if(x0===null||e.pointerId!==id) return;
    card.classList.add("snap");
    hL.style.opacity=hR.style.opacity=0;
    if(Math.abs(dx)>TH){
      const dir = dx<0 ? 1 : -1;
      card.style.transform=`translateX(${dx<0?-460:460}px) rotate(${dx<0?-9:9}deg)`;
      setTimeout(()=>nav(dir),140);
    } else {
      card.style.transform="";
    }
    x0=null; try{ card.releasePointerCapture(id); }catch(_){}
  };
  card.addEventListener("pointerdown",down);
  card.addEventListener("pointermove",move,{passive:true});
  card.addEventListener("pointerup",up);
  card.addEventListener("pointercancel",up);
  wrap.addEventListener("dragstart",e=>e.preventDefault());
}
function nav(dir){
  const n=queueLeads().length; if(!n) return;
  idx=(idx+dir+n)%n;
  if(dialMode==="list") listOpen=key(queueLeads()[idx]);
  renderDial(); renderQueueBtn(); $("main").scrollTop=0;
}
function cbTime(h){
  const now=new Date();
  if(h===-9){ const t=new Date(now); t.setDate(t.getDate()+1); t.setHours(9,0,0,0); return t.toISOString(); }
  return new Date(now.getTime()+h*3600e3).toISOString();
}
function current(){ return queueLeads()[idx]; }

// Everything still alive, in one place. This is the answer to "after I hit next
// on a dead one, I still need to get back to the ones that are going somewhere."
function buckets(){
  const now=Date.now(), due=[],green=[],hot=[],sent=[],won=[],back=[];
  leads.forEach(l=>{
    const d=results[key(l)]; if(!d||d.kill) return;
    const st=stageOf(d);
    if(d.dispo==="BOOKED"||st==="booked"){ won.push({l,d}); return; }
    if(d.dispo==="Not Interested" && !d.greenlight) return;
    const dueAt=[d.cbDue,d.fuDue].filter(Boolean).sort()[0];
    if(dueAt && new Date(dueAt).getTime()<=now){ due.push({l,d,when:dueAt}); return; }
    if(d.greenlight){ green.push({l,d,when:dueAt}); return; }
    // An interested lead is an interested lead. A pending 4-hour nudge does not
    // demote it into a diary entry — it shows as a time on the row instead.
    if(d.dispo==="Interested"){ hot.push({l,d,when:dueAt}); return; }
    if(STAGES.indexOf(st)>=STAGES.indexOf("demo_sent")){ sent.push({l,d,when:dueAt}); return; }
    if(dueAt){ back.push({l,d,when:dueAt}); return; }
  });
  due.sort((a,b)=>a.when<b.when?-1:1);
  back.sort((a,b)=>a.when<b.when?-1:1);
  const t=x=>x.when?new Date(x.when).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"}):(x.d.ts?ago(x.d.ts)+" ago":"");
  hot.forEach(x=>x.right=x.when?"nudge "+t(x):t(x)); sent.forEach(x=>x.right=x.when?"nudge "+t(x):t(x));
  green.forEach(x=>x.right=x.when?"nudge "+t(x):t(x));
  return {due,green,hot,sent,back,won};
}
function renderWork(){
  const v=$("scr-work"), b=buckets();
  const total=b.due.length+b.green.length+b.hot.length+b.sent.length+b.back.length+b.won.length;
  if(!total){
    v.innerHTML=`<h1>Working</h1><div class="sub">Live leads land here the moment you log an outcome.</div>
      <div class="empty">Nothing in play yet.<br>Mark someone <b>Interested</b> or send a demo and they'll show up here — so a dead call never costs you the live ones.</div>`;
    return;
  }
  const row=(x,cls,right)=>{
    const st=x.d.greenlight ? "🟢 Green Lit" : (STAGE_LABEL[stageOf(x.d)]||"");
    const ph=fmtPhone(x.l.phone);
    return `<button class="wcard ${cls}" onclick="openLead('${esc(jsq(key(x.l)))}')">
      <span class="bar"></span><span class="b">
        <span class="t">${esc(greet(x.l)||x.l.business_name)} <span style="font-size:11px;opacity:.75;font-weight:600;margin-left:6px">${esc(ph)}</span></span>
        <span class="d">${greet(x.l)?esc(x.l.business_name)+" · ":""}${st}${
          x.d.note?" · "+esc(x.d.note):""}</span></span>
      <span class="w">${right}</span></button>`;
  };
  const grp=(t,arr,fn)=>arr.length?`<div class="grouph">${t}<span class="n">${arr.length}</span></div>`+arr.map(fn).join(""):"";
  v.innerHTML=`<h1>Working</h1>
    <div class="sub">${total} live. Nothing here is a cold call — they all know who you are.</div>
    ${grp("🟢 Green Lit / Work in Progress", b.green, x=>row(x,"hot", x.right||""))}
    ${grp("Owed a call back now", b.due, x=>row(x,"due",(Date.now()-new Date(x.when)>36e5?"overdue<br>":"")+ago(x.when)+" ago"))}
    ${grp("Said interested",       b.hot, x=>row(x,"hot", x.right||""))}
    ${grp("Demo sent, waiting",    b.sent,x=>row(x,"hot", x.right||""))}
    ${grp("Called back later",     b.back,x=>row(x,"",new Date(x.when).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"})))}
    ${grp("Booked",                b.won, x=>row(x,"won","✓"))}
    ${meetings.length?`<div class="grouph">Calendar<span class="n">${meetings.length}</span></div>`+
      meetings.slice().sort((a,b2)=>a.when<b2.when?-1:1).map(m=>{
        const dt=new Date(m.when), past=dt<new Date();
        return `<div class="wcard ${past?"":"won"}" style="${past?"opacity:.5":""}">
          <span class="bar"></span><span class="b"><span class="t">${esc(m.name)}${past?" ✓":""}</span>
          <span class="d">${dt.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} · ${m.dur} min${m.note?" · "+esc(m.note):""}</span></span>
          <span class="w"><button class="mini ghost" onclick="event.stopPropagation();downloadIcs('${m.id}')">.ics</button></span></div>`;
      }).join(""):""}`;
}
function openLead(k){
  const i=queueLeads().findIndex(l=>key(l)===k);
  if(i>=0){ idx=i; go("dial"); return; }
  queue=[]; deckOrder=null; saveQueue();       // outside the playlist — widen and jump
  const j=queueLeads().findIndex(l=>key(l)===k);
  idx=Math.max(0,j); go("dial"); renderQueueBtn();
}

// ════════════════ STATS ════════════════
function renderStats(){
  const v=$("scr-stats"), today=new Date().toISOString().slice(0,10);
  const all=Object.values(results).filter(d=>d.dispo||d.kill);
  const td=all.filter(d=>(d.ts||"").slice(0,10)===today);
  const conn=a=>a.filter(d=>["Not Interested","Interested","BOOKED"].includes(d.dispo));
  const cnt=(a,x)=>a.filter(d=>d.dispo===x).length;
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const kills=all.filter(d=>d.kill);
  const called=all.filter(d=>d.dispo).length, booked=cnt(all,"BOOKED");
  const inter=cnt(all,"Interested")+booked;

  const byN={};
  leads.forEach(l=>{
    const d=results[key(l)], o=byN[l.category]||(byN[l.category]={t:0,c:0,i:0,b:0,k:0});
    o.t++; if(d&&d.dispo){o.c++; if(["Interested","BOOKED"].includes(d.dispo))o.i++; if(d.dispo==="BOOKED")o.b++;}
    if(d&&d.kill) o.k++;
  });
  const gate={ok:0,check:0,held:0};
  leads.forEach(l=>{const s=(l.verify||{}).status; gate[s==="ok"?"ok":s==="check"?"check":"held"]++;});

  v.innerHTML=`<h1>Stats</h1><div class="sub">The scoreboard doesn't lie.</div>
    <div class="hero"><div class="num">${td.length}</div><div class="cap">dials today · goal ${DAILY_GOAL}</div>
      <div class="goal"><i style="width:${Math.min(100,pct(td.length,DAILY_GOAL))}%"></i></div></div>
    <div class="kpis">
      <div class="kpi"><div class="n">${conn(td).length}</div><div class="c">connects today</div></div>
      <div class="kpi"><div class="n">${cnt(td,"BOOKED")}</div><div class="c">booked today</div></div>
      <div class="kpi"><div class="n">${pct(conn(all).length,called)}%</div><div class="c">connect rate, all time</div></div>
      <div class="kpi"><div class="n">${pct(booked,called)}%</div><div class="c">book rate of called</div></div>
    </div>

    <div class="panel"><div class="cl">Lead quality — the number that cost you 09-01</div>
      <div class="fbar"><span class="fl">Clean</span><div class="fb"><i style="width:${pct(gate.ok,leads.length)}%;background:var(--green)"></i></div><span class="ft">${gate.ok}</span></div>
      <div class="fbar"><span class="fl">Caveated</span><div class="fb"><i style="width:${pct(gate.check,leads.length)}%;background:var(--amber)"></i></div><span class="ft">${gate.check}</span></div>
      <div class="fbar"><span class="fl">Held back</span><div class="fb"><i style="width:${pct(gate.held,leads.length)}%;background:var(--dim)"></i></div><span class="ft">${gate.held}</span></div>
      <div class="srcline" style="margin-top:10px">${kills.length
        ? `<b>${kills.length}</b> killed at the phone: `+KILLS.map(([k,lab])=>
            `${lab.toLowerCase()} ${kills.filter(d=>d.kill===k).length}`).join(" · ")+
          `. Export and merge these back — a defect found twice is a process that isn't working.`
        : "Nothing killed at the phone yet. Every kill you log here is a correction the corpus keeps."}</div>
    </div>

    <div class="panel"><div class="cl">Funnel — all time</div>
      ${[["Verified",gate.ok+gate.check,"var(--dim)"],["Called",called,"var(--blue)"],
         ["Interested",inter,"var(--amber)"],["Booked",booked,"var(--green)"]].map(([lab,n,c])=>
        `<div class="fbar"><span class="fl">${lab}</span><div class="fb"><i style="width:${pct(n,gate.ok+gate.check||1)}%;background:${c}"></i></div><span class="ft">${n}</span></div>`).join("")}
    </div>

    <div class="panel"><div class="cl">By niche</div>
      <table class="ntab"><tr><th>Niche</th><th>Leads</th><th>Called</th><th>Int</th><th>Bad</th><th>Booked</th></tr>
      ${Object.entries(byN).sort((a,b)=>b[1].c-a[1].c||b[1].t-a[1].t).map(([c,o])=>
        `<tr><td>${nlabel(c)}</td><td>${o.t}</td><td>${o.c}</td><td>${o.i}</td><td>${o.k||""}</td><td class="g">${o.b||""}</td></tr>`).join("")}
      </table></div>`;
}

// ════════════════ ACTIONS ════════════════
function go(name){
  scr=name;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("scr-"+name).classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.scr===name));
  $("main").scrollTop=0; closeSheet(); render();
}
function render(){
  if(scr==="dial") renderDial(); else if(scr==="work") renderWork(); else renderStats();
  renderQueueBtn();
  $("avatar").textContent=rep;
  const n=buckets().due.length, b=$("workBadge");
  b.style.display=n?"":"none"; b.textContent=n;
}
function toggleGreenLight(){
  const l=current(); if(!l) return;
  const d=rec(l);
  d.greenlight = !d.greenlight;
  d.ts = new Date().toISOString();
  d.rep = rep;
  delete d.kill;
  if(d.greenlight){
    if(!d.dispo) d.dispo = "Interested";
    advance(d, "contacted");
    toast("🟢 Green Lit — Saved to Working!");
  } else {
    toast("Green light removed");
  }
  save();
  render();
}
function setDispo(dispo){
  const l=current(); if(!l) return;
  const d=rec(l);
  d.dispo=dispo; d.ts=new Date().toISOString(); d.rep=rep; delete d.kill;
  advance(d, dispo==="BOOKED"?"booked":"contacted");
  if(dispo==="Interested") armFollowup(d);
  if(dispo==="BOOKED"||dispo==="Not Interested") delete d.fuDue;
  save();
  if(dispo==="BOOKED"){ bookIt(); return; }
  // A dead outcome moves you on. A live one keeps the card up so you can send.
  if(dispo==="No Answer"||dispo==="Not Interested"){ toast(dispo+" — next"); setTimeout(()=>nav(1),260); }
  else render();
}
// The correction channel. Three dead leads on 09-01 were found with a dial and
// then forgotten; logged here they leave the deck AND come out in the export.
function setKill(k){
  const l=current(); if(!l) return;
  const d=rec(l);
  if(d.kill===k){ delete d.kill; save(); render(); return; }
  d.kill=k; d.ts=new Date().toISOString(); d.rep=rep;
  d.killNote=`${KILL_LABEL[k]} — found at the phone ${new Date().toLocaleDateString()}`;
  delete d.cbDue; delete d.fuDue;
  save(); toast(KILL_LABEL[k]+" — pulled from the deck");
  setTimeout(()=>{ idx=Math.max(0,idx-0); render(); },260);
}
function setCb(due){
  const l=current(); if(!l) return; const d=rec(l);
  if(due) d.cbDue=due; else delete d.cbDue;
  save(); render();
}
function setNote(v){ const l=current(); if(!l) return; rec(l).note=v; save(); }
function setDemoUrl(u){
  const l=current(); if(!l) return;
  u=(u||"").trim();
  if(u && !/^https?:\/\//i.test(u)){ toast("Needs to start with https://"); return; }
  const d=rec(l); if(u) d.demoUrl=u; else delete d.demoUrl;
  save(); render(); if(u) toast("Demo link saved — texts are live");
}
function markCalled(){ const l=current(); if(!l) return; const d=rec(l); if(!d.ts) d.ts=new Date().toISOString(); save(); }
function sent(k){
  const l=current(); if(!l) return; const d=rec(l);
  if(k==="pricing"){ advance(d,"pricing_sent"); delete d.fuDue; }
  else if(k==="demo"||k==="postvm"||k==="info"){ advance(d,"demo_sent"); armFollowup(d); }
  save(); setTimeout(render,400);
}
function buildDemo(){
  const l=current(); if(!l) return;
  copyText(buildCmd(l));
  const d=rec(l); d.demoRequested=new Date().toISOString(); save();
  toast("Build command copied — paste it in the terminal");
}
function bookIt(){
  const l=current(); if(!l) return;
  bookKey=key(l);
  $("bookSub").textContent=`${l.business_name}${greet(l)?" — "+greet(l):""}`;
  $("bDate").value=new Date(Date.now()+864e5).toISOString().slice(0,10);
  openSheet("bookSheet");
}
function saveMeeting(){
  const l=leads.find(x=>key(x)===bookKey); if(!l) return;
  const when=$("bDate").value+"T"+$("bTime").value;
  if(!$("bDate").value){ toast("Pick a date"); return; }
  const m={id:"m"+Date.now(), leadKey:bookKey, name:l.business_name, phone:l.phone,
    when:new Date(when).toISOString(), dur:+$("bDur").value, note:$("bNote").value, rep};
  meetings.push(m); saveMeetings();
  const d=rec(l); advance(d,"booked"); d.dispo="BOOKED"; d.ts=new Date().toISOString();
  delete d.fuDue; delete d.cbDue; save();
  downloadIcs(m.id); closeSheet(); go("work"); toast("Booked — .ics downloaded");
}
function downloadIcs(id){
  const m=meetings.find(x=>x.id===id); if(!m) return;
  const s=new Date(m.when), e=new Date(s.getTime()+m.dur*60000);
  const f=d=>d.toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//RecoverRevenue//SalesHQ//EN","BEGIN:VEVENT",
    "UID:"+m.id+"@recoverrevenue","DTSTAMP:"+f(new Date()),"DTSTART:"+f(s),"DTEND:"+f(e),
    "SUMMARY:Demo call — "+String(m.name).replace(/[,;]/g," "),
    "DESCRIPTION:"+((m.note||"")+" · "+fmtPhone(m.phone)).replace(/[,;]/g," "),
    "BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY","DESCRIPTION:Pull up the demo link","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download="meeting-"+String(m.name).replace(/\W+/g,"-").toLowerCase()+".ics";
  a.click();
}
function openTpl(){
  const l=current(); if(!l) return;
  const M=msgs(l), url=demoUrl(l);
  tplCache=Object.entries(M).map(([k,m])=>({k,...m,blocked:m.needsDemo&&!url}));
  $("tplSub").textContent=`${l.business_name} — filled in, ready to send`;
  $("tplBody").innerHTML=tplCache.map((t,i)=>`<div class="tpl">
    <div class="tk">${esc(t.label)}${t.blocked?" · needs a demo link":""}</div>
    <div class="tt">${esc(t.hint)}</div><div class="tb">${esc(t.body)}</div>
    <div class="tacts"><button class="mini ghost" onclick="copyTpl(${i},this)">Copy</button>
    ${t.blocked?"":`<a class="mini" href="${smsHref(l.phone,t.body)}" onclick="sent('${t.k}')">Text it</a>`}</div>
  </div>`).join("");
  openSheet("tplSheet");
}
function copyTpl(i,btn){
  const t=tplCache[i]; if(!t) return;
  copyText(t.body);
  if(btn){ btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent="Copy",1200); }
}
function copyText(t){
  if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});
  else{ const i=document.createElement("textarea"); i.value=t; document.body.appendChild(i);
        i.select(); document.execCommand("copy"); i.remove(); }
}
function switchRep(){
  const r=prompt("Rep initials (who's dialing?)",rep);
  if(r&&r.trim()){ rep=r.trim().toUpperCase().slice(0,4); localStorage.setItem("rr_rep",rep); render(); }
}
function exportResults(){
  const out={exported:new Date().toISOString(), rep,
    corrections:leads.filter(l=>(results[key(l)]||{}).kill).map(l=>({
      business_name:l.business_name, phone:l.phone, category:l.category,
      kill:results[key(l)].kill, note:results[key(l)].killNote })),
    leads:leads.map(l=>({...l, result:results[key(l)]||null})), meetings};
  const name="sales-hq-"+new Date().toISOString().slice(0,10)+".json";
  const json=JSON.stringify(out,null,2);
  const blob=new Blob([json],{type:"application/json"});
  const done=()=>toast(out.corrections.length+" corrections in the export");

  // iOS Safari ignores <a download> on a blob, so the day's calls would be
  // stranded on the phone. Share sheet first, anchor only as the desktop path.
  try{
    const f=new File([blob],name,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:name})
        .then(done)
        .catch(err=>{ if(err && err.name!=="AbortError") anchorDownload(blob,name,done); });
      return;
    }
  }catch(_){}
  anchorDownload(blob,name,done);
}
function anchorDownload(blob,name,done){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name; a.rel="noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  if(done) done();
}
$("fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const data=JSON.parse(r.result), arr=Array.isArray(data)?data:data.leads;
    if(!Array.isArray(arr)||!arr.length) return alert("Expected an array of leads.");
    const ungated=arr.filter(l=>!(l.verify||{}).status).length;
    if(ungated) return alert(`${ungated} of ${arr.length} leads have not been through verify.py.\n\nRun it first:\n  python3 ~/claude/agency/dialer/verify.py`);
    leads=arr.map(x=>{ const {result,...l}=x; return l; });
    idx=0; queue=[]; deckOrder=null; saveQueue(); closeSheet(); render();
    toast(leads.length+" leads loaded");
  }catch(err){ alert("Invalid JSON: "+err.message); } };
  r.readAsText(f);
});

// ════════════════ SHELL ════════════════
function openSheet(id){ $(id).classList.add("open"); $("scrim").classList.add("open"); }
function closeSheet(){
  document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("open"));
  $("scrim").classList.remove("open");
}
function toggleTheme(){
  const d=document.documentElement;
  const next=d.getAttribute("data-theme")==="dark"?"light":"dark";
  d.setAttribute("data-theme",next); localStorage.setItem("rr_theme",next);
}
(function initTheme(){
  const saved=localStorage.getItem("rr_theme");
  if(saved) document.documentElement.setAttribute("data-theme",saved);
  else if(matchMedia("(prefers-color-scheme: dark)").matches)
    document.documentElement.setAttribute("data-theme","dark");
})();
document.addEventListener("keydown",e=>{
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(scr!=="dial") return;
  if(e.key==="ArrowRight") nav(1);
  if(e.key==="ArrowLeft")  nav(-1);
});
(function boot(){
  const g=(function(){const c={ok:0,check:0,held:0};
    leads.forEach(l=>{const s=(l.verify||{}).status; c[s==="ok"?"ok":s==="check"?"check":"held"]++;});return c;})();
  $("healthLine").innerHTML=`<b>${g.ok+g.check}</b> of ${leads.length} verified · `+
    `${g.check} carry a caveat · <b>${g.held}</b> held back by the gate`;
  $("repLine").innerHTML=`Calls get tagged <b>${esc(rep)}</b> — tap to change`;
  $("sheetRep").textContent = rep===REP_DEFAULT?"Garrett":rep;
  render();
  if(!queue.length && !Object.keys(results).length) setTimeout(openQueue,420);
})();
</script>
